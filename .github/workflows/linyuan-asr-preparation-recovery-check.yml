name: 识别准备漏报失败的真实恢复回放（不调度不投稿）
on:
  push:
    branches: [codex/linyuan-asr-prepare-recovery-20261022]
    paths:
      - .github/workflows/linyuan-asr-preparation-recovery-check.yml
      - linyuan/check_asr_preparation_recovery.py
      - linyuan/production_failure_report.py
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r linyuan/fc/runtime-requirements.txt
      - name: 核对实际失败步骤、没有审核报告、对应代码修复及有界恢复
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python linyuan/check_asr_preparation_recovery.py
