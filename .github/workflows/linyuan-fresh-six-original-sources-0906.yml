name: 林园新六条官方母片补位
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-fresh-six-original-sources-0906.yml]
permissions:
  actions: write
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, subprocess
          for n,article in [(7,'103329354'),(8,'102581577')]:
              url=f'https://www.yicai.com/video/{article}.html'
              subprocess.run(['gh','workflow','run','linyuan-produce-cn.yml','--repo',os.environ['GITHUB_REPOSITORY'],
                  '--ref','production/fresh-six-0906','-f','source='+url,
                  '-f',f'slug=ly-fresh-six-0906-{n:02d}','-f','speaker=林园',
                  '-f','occasion=第一财经官方采访 '+article,'-f','source_platform=yicai',
                  '-f','delay_hours=0','-F','auto_publish=false','-f','target_parts=0',
                  '-F','include_full=false','-F','prefer_live_video=true'],check=True)
              print('已触发官方母片',article,flush=True)
          PY
