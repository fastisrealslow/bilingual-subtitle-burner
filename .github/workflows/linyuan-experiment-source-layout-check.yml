name: 真实母片画幅排产只读核验（不出片不调度）
on:
  push:
    branches: [codex/linyuan-experiment-source-layout-20261023]
    paths: [linyuan/fc/index.py, linyuan/check_experiment_source_layout.py, .github/workflows/linyuan-experiment-source-layout-check.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 对照真实发布回执，只读验证新排产顺序
        env:
          GH_TOKEN: ${{ github.token }}
        run: python linyuan/check_experiment_source_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-source-layout-verification
          path: experiment-source-layout-verification/
          if-no-files-found: error
