name: 林园在途长源分辨率核验
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stream-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 只读取清晰度元数据，不下载视频
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'linyuan')
          import ci_fetch_bilibili as b
          op=b.opener()
          for page in (35,16):
              cid=b.via_view(op,'BV19P4y1m77K',page)
              url=f'https://api.bilibili.com/x/player/playurl?bvid=BV19P4y1m77K&cid={cid}&qn=80&fnval=4048&fourk=0&high_quality=1'
              raw=json.loads(op.open(url,timeout=30).read())
              selected=b.select_streams(raw)
              print(json.dumps(dict(page=page,code=raw.get('code'),selected={k:selected.get(k) for k in ('width','height','quality')},streams=[{k:row.get(k) for k in ('id','width','height','codecid','bandwidth')} for row in raw.get('data',{}).get('dash',{}).get('video',[])]),ensure_ascii=False))
          PY
