name: 林园802竖屏源分辨率核验
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stream-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 只读取清晰度元数据，不下载视频
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'linyuan')
          import ci_fetch_bilibili as b
          op=b.opener()
          cid=b.via_view(op,'BV1PcNh6rErV')
          url=f'https://api.bilibili.com/x/player/playurl?bvid=BV1PcNh6rErV&cid={cid}&qn=80&fnval=4048&fourk=0&high_quality=1'
          raw=json.loads(op.open(url,timeout=30).read())
          print(json.dumps(dict(code=raw.get('code'),streams=[{k:s.get(k) for k in ('id','width','height','codecid','bandwidth')} for s in raw.get('data',{}).get('dash',{}).get('video',[])]),ensure_ascii=False))
          selected=b.select_streams(raw)
          print(json.dumps({k:selected.get(k) for k in ('width','height','quality')},ensure_ascii=False))
          PY
