name: One-time creator analytics field types
on:
  push:
    branches: ['dot/comments-read-probe-20261115']
    paths: ['.github/workflows/linyuan-fans-shape-probe-20261124.yml']
permissions:
  contents: read
jobs:
  schema-check:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify own-creator metric presence without exporting values
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          if time.time() > 1795492158:
              sys.exit("probe expired")
          try:
              blob = json.loads(os.environ.pop("BILIBILI_COOKIES", "") or "{}")
              cookies = {c["name"]:str(c["value"]) for c in ((blob.get("cookie_info") or {}).get("cookies") or blob.get("cookies") or [])}
              if cookies.get("DedeUserID") != "275211725" or not cookies.get("SESSDATA"):
                  sys.exit("existing creator credentials unavailable or account mismatch")
              allowed = ("SESSDATA", "DedeUserID", "DedeUserID__ckMd5", "bili_jct")
              header = "; ".join(k+"="+cookies[k] for k in allowed if cookies.get(k))
              if "\\r" in header or "\\n" in header:
                  sys.exit("bad cookie syntax")
              opener = build_opener(NoRedirect())
              def read(url):
                  q = Request(url, headers={"Cookie":header,"Referer":"https://member.bilibili.com/","User-Agent":"Mozilla/5.0"}, method="GET")
                  with opener.open(q,timeout=12) as response:
                      return json.load(response)
              nav = read("https://api.bilibili.com/x/web-interface/nav")
              owner = nav.get("data") or {}
              if nav.get("code") != 0 or not owner.get("isLogin") or str(owner.get("mid")) != "275211725":
                  sys.exit("creator session not verified")
              result = read("https://member.bilibili.com/x/web/data/archive_diagnose/compare?size=1")
              code = result.get("code")
              print("analytics_api_code:", code if type(code) is int else "missing")
              if code != 0:
                  sys.exit("analytics request not accepted")
              rows = (result.get("data") or {}).get("list") or []
              if len(rows) != 1:
                  sys.exit("single sampled video unavailable")
              row = rows[0]
              print("video_identity_present:", bool(row.get("bvid") or row.get("aid")))
              import re
              safe_key=re.compile(r"^[a-zA-Z_][a-zA-Z0-9_]{0,63}$")
              interesting=re.compile(r"view|play|attention|fan|follow|stat|period|cycle|date|range",re.I)
              def walk(o, depth=0):
                  if depth>4 or not isinstance(o,dict): return
                  for k,v in o.items():
                      if not isinstance(k,str) or not safe_key.fullmatch(k): continue
                      if interesting.search(k):
                          numeric_text=isinstance(v,str) and bool(re.fullmatch(r"-?\d+(?:\.\d+)?%?",v))
                          print("metric_shape:", k, type(v).__name__, "numeric_text="+str(numeric_text))
                      if isinstance(v,dict): walk(v, depth+1)
                      if isinstance(v,list) and v and isinstance(v[0],dict): walk(v[0], depth+1)
              walk(row)
              print("row_field_names:", ",".join(k for k in row if safe_key.fullmatch(k)))
          except HTTPError as exc:
              print("http_status:", exc.code)
              sys.exit(1)
          except Exception as exc:
              print("stopped:", type(exc).__name__)
              sys.exit(1)
          PY
