name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Source79-only replay after source-bound channel and verified shot boundary fixes.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '79'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
