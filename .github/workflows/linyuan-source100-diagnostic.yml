name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Validate selector25 on fixed sources with hash-verified CPU recognition
    # evidence. Identity, picture, deduplication and final gates stay unchanged.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '7,68'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
