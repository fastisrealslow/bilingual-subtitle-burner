name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Validate 7492544's dense contiguous identity-window recheck against the
    # same seven real fixed sources. Candidate identity, picture, deduplication
    # and final acceptance thresholds remain unchanged.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '30,31,52,56,84,93,98'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
