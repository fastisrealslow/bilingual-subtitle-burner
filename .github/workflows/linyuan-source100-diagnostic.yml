name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Recheck three structurally complete candidates whose prior failures were
    # limited to picture geometry; retain bounded pre-ranking evidence;
    # acceptance gates and the fixed100 denominator remain unchanged.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '15,46,76'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
