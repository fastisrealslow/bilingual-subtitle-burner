name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Validate automatic format-failure isolation on the same source8 mother.
    # Reuse hash-verified CPU ASR; every original acceptance gate stays active.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '8'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
