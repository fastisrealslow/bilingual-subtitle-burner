name: 固定素材技术诊断（不计全量成功率）
'on':
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-source100-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    # Recover source65's fixed URL by removing only a bounded unmatched media
    # tail, then run every unchanged source, editorial and picture gate;
    # acceptance gates and the fixed100 denominator remain unchanged.
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '65'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
