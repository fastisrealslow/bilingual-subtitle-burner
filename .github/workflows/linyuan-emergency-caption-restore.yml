name: 林园字幕紧急修复并单条回归
on:
  push:
    paths: ['.github/workflows/linyuan-emergency-caption-restore.yml']
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: 恢复完整模块并修复0.25秒碎片
        run: |
          set -euo pipefail
          git checkout 5da2003285034c8c17286201cb2b843187d5e8b5 -- linyuan/presentation.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('linyuan/presentation.py'); s=p.read_text()
          old="""            if duration < .25:\n                raise ValueError('字幕出现不足0.25秒的闪屏，需修复转写时间')\n            result.append({'start_sec':group[start][1],'end_sec':group[end-1][2],\n                           'zh':text[start:end],'en':'','lines':lines,'font_px':cue_font})\n            start=end\n"""
          new="""            if duration < .25:\n                # 极短 ASR 碎片不单独闪屏：优先并入上一屏；若是首屏则\n                # 扩到下一个完整词边界。保留全部原文，不放宽最终可读性。\n                if result and len(result[-1]['zh']) + len(text[start:end]) <= 2*cap:\n                    merged=result[-1]['zh']+text[start:end]\n                    try:\n                        merged_lines=wrap_words(merged,max(cap, max((b-a for a,b in word_spans(merged)),default=cap)))\n                        result[-1]['zh']=merged; result[-1]['lines']=merged_lines\n                        result[-1]['end_sec']=group[end-1][2]\n                        start=end; continue\n                    except ValueError:\n                        pass\n                later=[c for c in usable if c[0]>end and c[2]>=.25]\n                if later:\n                    end,lines,duration,cue_font=later[0]\n                else:\n                    raise ValueError('字幕极短碎片无法安全并入相邻完整意群')\n            result.append({'start_sec':group[start][1],'end_sec':group[end-1][2],\n                           'zh':text[start:end],'en':'','lines':lines,'font_px':cue_font})\n            start=end\n"""
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile linyuan/presentation.py linyuan/produce_cn.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linyuan/presentation.py
          git commit -m 'fix: merge sub-250ms caption fragments safely'
          git push
