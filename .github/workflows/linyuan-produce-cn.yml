name: 中文源出片

# 中文视频 → 3 分钟双语字幕短片。
#
# 与 produce.yml（英文源）的关系：那条走 produce.py，direction 写死 en2zh；
# 这条走 produce_cn.py，针对中文股东会素材做了三处专门处理
# （large-v3 词级重切 / ASR 专名术语表 / loudnorm 响度标准化）。
#
# ASR 用 large-v3 而不是 base：实测 4 核 runner 上实时率 1.17x，
# 9 分钟素材约 11 分钟转写，Actions 6 小时上限完全放得下。
# 质量差距是决定性的 —— small 输出繁体且把「安宫」听成「安公」，
# large-v3 简体且专名基本正确。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '视频 URL 或仓库内相对路径'
        required: true
        type: string
      slug:
        description: '产物目录名 deliver/<slug>/'
        required: true
        type: string
      speaker:
        description: '主讲人（用于金句判断）'
        required: false
        default: '林园'
        type: string
      occasion:
        description: '场合，写进简介（如「片仔癀 2026 年度股东大会」）'
        required: false
        default: ''
        type: string
      delay_hours:
        description: '投稿定时发布：延迟小时数（0=立即发布）'
        required: false
        default: '0'
        type: string
      source_platform:
        description: '来源平台（bilibili/weibo/tencent 等）'
        required: false
        default: ''
        type: string
      auto_publish:
        description: '出片后在 CI 直接投稿（已实测：upos 对海外 runner 零吞吐，物理不可行；投稿由境内 publish_worker 完成，此开关仅留作将来网络变化时的备用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: produce-cn-${{ inputs.slug }}
  cancel-in-progress: false     # 取消会白扔已付费的 LLM 调用

jobs:
  produce:
    runs-on: ubuntu-latest
    # 转写 + 3 次编码，长素材可能到 1 小时以上，留足余量
    timeout-minutes: 180
    defaults:
      run:
        working-directory: linyuan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # fonts-noto-cjk 必装：缺了中文字体，字幕会烧成一排豆腐块
      - name: 安装 ffmpeg 与中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg fonts-noto-cjk poppler-utils libgl1 libglib2.0-0
          fc-cache -f
          ffprobe -version | head -1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # opencv 必须锁 <5：OpenCV 5.0 移除了 cv2.CascadeClassifier，会静默打断封面人脸检测
          # （2026-09-01 实测：装到 5.0.0 后人脸检测全失败，封面退化成取第一帧）
          pip install faster-whisper yt-dlp pillow fonttools 'opencv-python<5' jieba rapidocr-onnxruntime
          # Fun-ASR-Nano 后端：sherpa-onnx 推理框架（onnxruntime CPU，无需 torch）
          pip install sherpa-onnx

      # whisper large-v3 仍是默认后端（可回滚），缓存照旧保留。
      # large-v3 是 2.9GB，每次现下要好几分钟且可能超时。
      # 缓存键固定（模型不会变），命中后直接复用。
      # Actions 单仓库缓存上限 10GB，这个占 3GB 可以接受。
      - name: 缓存 Whisper large-v3
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-large-v3-ct2-v1

      # Fun-ASR-Nano int8 模型（~1GB）：编码器适配 + LLM + embedding + tokenizer。
      # 从 HF 拉官方 sherpa-onnx 版（CI 海外访问 HF 快），缓存命中后直接复用。
      - name: 缓存 Fun-ASR-Nano 模型
        id: funasr-cache
        uses: actions/cache@v4
        with:
          # cache 的 path 相对仓库根，而下载在 linyuan/ 工作目录下
          path: linyuan/sensevoice_model
          key: sensevoice-int8-v1

      - name: 下载 SenseVoice 模型
        if: steps.sensevoice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sensevoice_model
          curl -sfL --retry 3 --max-time 600 -o /tmp/sv.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          tar xjf /tmp/sv.tar.bz2 -C sensevoice_model --strip-components=1
          ls -lh sensevoice_model/

      - name: 预下载模型
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          # 首次会从 HF 拉 CTranslate2 权重到 ~/.cache/huggingface/hub
          WhisperModel("large-v3", device="cpu", compute_type="int8")
          print("模型就位")
          PY

      # LLM 响应按内容寻址缓存：出片失败重跑时，金句和翻译不重复付费
      - name: 复用 LLM 缓存
        uses: actions/cache@v4
        with:
          path: linyuan/.llm_cache
          key: llm-cn-${{ inputs.slug }}-${{ github.run_id }}
          restore-keys: |
            llm-cn-${{ inputs.slug }}-
            llm-cn-

      - name: 取源
        id: src
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE" =~ bilibili\.com/video/BV ]]; then
            # B站 API 在 GitHub runner 上反而通（监控每天在调），
            # yt-dlp 裸请求会被 412，走自己的指纹会话下载器
            mkdir -p _src
            python3 ci_fetch_bilibili.py --url "$SOURCE" --out _src/video.mp4
            echo "path=_src/video.mp4" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" =~ ^https?:// ]]; then
            mkdir -p _src
            # FC 上传的 staging release 素材：releases/download/<tag>/<slug>.mp4
            # 公开仓库的 download 链接无需 token，直接 curl（yt-dlp 不认这种链接）
            if [[ "$SOURCE" =~ github\.com/.*/releases/download/ ]]; then
              echo "GitHub release 素材，直接下载"
              curl -sfL --retry 3 --max-time 600 -o _src/video.mp4 "$SOURCE"
              [ -s _src/video.mp4 ] || { echo "::error::release 素材下载失败"; exit 1; }
            else
              yt-dlp --socket-timeout 120 --retries 5 \
                -f 'bv*[height<=1080]+ba/b[height<=1080]/b' \
                -o '_src/video.%(ext)s' "$SOURCE"
            fi
            echo "path=$(ls _src/video.* | head -1)" >> $GITHUB_OUTPUT
          else
            [ -f "$SOURCE" ] || { echo "::error::找不到 $SOURCE"; exit 1; }
            echo "path=$SOURCE" >> $GITHUB_OUTPUT
          fi

      - name: 时长校验
        # 2026-09-02 新增：微博/抖音等源改为「透传 URL 给 CI 下载」后，FC 侧不再做
        # 下载后时长检查（原来会拦掉 8s、43s 这类废片）。这道校验必须补在 CI，
        # 否则太短/太长的素材会一路跑完 ASR+出片才发现，白烧算力。
        run: |
          set -euo pipefail
          SRC="${{ steps.src.outputs.path }}"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC" | cut -d. -f1)
          echo "素材时长: ${DUR}s"
          if [ "$DUR" -lt 90 ] || [ "$DUR" -gt 5400 ]; then
            echo "::error::时长 ${DUR}s 不在 [90,5400]，放弃出片"
            exit 1
          fi

      - name: 出片
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          WHISPER_MODEL: large-v3
          # SenseVoice-Small 后端（非 LLM 不会死循环，自带标点）；出问题可临时改 whisper 回滚
          ASR_BACKEND: sensevoice
          SENSEVOICE_MODEL_DIR: sensevoice_model
          # ubuntu runner 没有 Microsoft YaHei/Arial，libass 找不到会烧成豆腐块
          ZH_FONT: Noto Sans CJK SC
          EN_FONT: DejaVu Sans
        run: |
          set -euo pipefail
          python3 -u produce_cn.py \
            --source "${{ steps.src.outputs.path }}" \
            --slug "${{ inputs.slug }}" \
            --speaker "${{ inputs.speaker }}" \
            --occasion "${{ inputs.occasion }}" \
            --source-platform "${{ inputs.source_platform }}"

      - name: 整理归档（slug 命名，留存可分析产物）
        run: |
          set -euo pipefail
          cd "deliver/${{ inputs.slug }}"
          # 成片、元数据、字幕都按 slug 命名，避免 deliver release 同名覆盖
          # 成片（长视频可能多个 final_n.mp4）、元数据、字幕都按 slug 命名
          for f in final*.mp4; do
            [ -f "$f" ] && cp "$f" "${{ inputs.slug }}.$f"
          done
          [ -f meta.json ] && cp meta.json "${{ inputs.slug }}.meta.json"
          n=1
          for f in _tmp/seg*.ass; do
            [ -f "$f" ] && cp "$f" "${{ inputs.slug }}.seg$n.ass" && n=$((n+1))
          done
          echo "归档产物："
          ls -la "${{ inputs.slug }}".* 2>/dev/null || true

      - name: 上传成片到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ inputs.slug }}
          path: linyuan/deliver/${{ inputs.slug }}/
          exclude: linyuan/deliver/${{ inputs.slug }}/_tmp/**
          retention-days: 90
          if-no-files-found: error

      - name: 上传成片到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deliver
          name: 成品库
          files: linyuan/deliver/${{ inputs.slug }}/${{ inputs.slug }}.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失败时把转写、金句、译文带出来，否则只能靠日志猜是哪步不达标
      - name: 失败时上传中间产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ inputs.slug }}
          path: linyuan/deliver/${{ inputs.slug }}/_tmp/
          retention-days: 14
          if-no-files-found: ignore

      - name: 摘要
        if: always()
        run: |
          {
            echo "## ${{ inputs.slug }}"
            # cwd 是 linyuan/（job 级 working-directory），路径不带前缀；
            # 只有 actions/* 的 with.path 才相对仓库根、需要 linyuan/ 前缀。
            if [ -f "deliver/${{ inputs.slug }}/meta.json" ]; then
              echo '```json'
              cat "deliver/${{ inputs.slug }}/meta.json"
              echo '```'
            else
              echo "未产出 meta.json，见 debug artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── B 站自动投稿（可选，默认关闭）─────────────────────────────
      # 开启方式：本机跑 linyuan/setup_bilibili_cookies.sh，扫码登录后
      # cookies.json 会写进 BILIBILI_COOKIES secret。
      #
      # 这里分两步，理由：
      # 1. secret 里装的是 cookies.json 全文（内容），不是路径 —— 直接当
      #    路径传给脚本必然报「文件不存在」。
      # 2. secrets 不能出现在步骤级 if 里 —— 必须由准备步骤把「配没配好」
      #    翻译成 GITHUB_ENV 变量，投稿步骤再判断。
      - name: 准备 B站登录态
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          python3 bili_cookies.py \
            --out "$RUNNER_TEMP/bili_cookies.json" \
            --github-env "$GITHUB_ENV"

      - name: B 站投稿
        if: env.BILI_COOKIES_FILE != '' && inputs.auto_publish
        env:
          RUST_LOG: info
        run: |
          set -euo pipefail
          # 跨太平洋疑似 MTU 黑洞：小包全通、大包全丢、16m20s 确定性超时
          # （≈tcp_retries2 上限）。压低 MSS 强制对端按小包收发。
          sudo iptables -t mangle -A OUTPUT -p tcp --tcp-flags SYN,RST SYN \
            -j TCPMSS --set-mss 1300
          echo "MSS 已压到 1300"
          python -m pip install -q biliup
          DTIME=0
          if [ "${{ inputs.delay_hours }}" != "0" ]; then
            DTIME=$(date -d "+${{ inputs.delay_hours }} hours" +%s)
            echo "定时发布：$(date -d "@$DTIME" '+%Y-%m-%d %H:%M') UTC"
          fi
          python3 publish_bilibili_cn.py --slug "${{ inputs.slug }}" --dtime "$DTIME"
