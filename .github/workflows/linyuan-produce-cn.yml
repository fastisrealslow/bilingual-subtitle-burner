name: 中文源出片

# 中文素材使用 SenseVoice CPU 离线识别；不预下载未使用的 Whisper。
# 模型比较见 linyuan-asr-cpu-benchmark.yml，识别阶段禁用网络。

on:
  # Path-scoped push trigger gives connected GitHub automation a bounded E2E
  # entry point when workflow_dispatch is unavailable. Ordinary commits do not
  # start production; changing this marker is an explicit one-shot test.
  push:
    branches: [main]
    paths: ['.github/linyuan-e2e.trigger']
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: '复用同一母片失败任务的转写和选段证据；留空正常生产'
        required: false
        default: ''
        type: string
      local_text_model:
        description: 'CPU离线文本模型；更新版先用于同源实产验收'
        required: false
        type: choice
        default: 'qwen3:4b'
        options:
          - 'qwen3:4b'
          - 'qwen3:4b-instruct-2507-q4_K_M'
      source:
        description: '视频 URL 或仓库内相对路径'
        required: true
        type: string
      slug:
        description: '产物目录名 deliver/<slug>/'
        required: true
        type: string
      speaker:
        description: '主讲人（用于金句判断）'
        required: false
        default: '林园'
        type: string
      occasion:
        description: '场合，写进简介（如「片仔癀 2026 年度股东大会」）'
        required: false
        default: ''
        type: string
      delay_hours:
        description: '投稿定时发布：延迟小时数（0=立即发布）'
        required: false
        default: '0'
        type: string
      source_platform:
        description: '来源平台（bilibili/weibo/tencent 等）'
        required: false
        default: ''
        type: string
      auto_publish:
        description: '出片后在 CI 直接投稿（已实测：upos 对海外 runner 零吞吐，物理不可行；投稿由境内 publish_worker 完成，此开关仅留作将来网络变化时的备用）'
        required: false
        default: false
        type: boolean
      target_parts:
        description: '固定观点切片数（本次园园对标用 13；0=常规自动）'
        required: false
        default: '0'
        type: string
      selected_parts:
        description: '仅补产已通过选段验证的自动切片编号；所有成片门禁照常运行'
        required: false
        default: ''
        type: string
      reviewed_parts:
        description: '仅补产已核对选段编号，逗号分隔；留空正常生产全部'
        required: false
        default: ''
        type: string
      repair_bvid:
        description: '已登记稿件原位修复；仅渲染，不能作为新稿发布'
        required: false
        default: ''
        type: string
      include_full:
        description: '追加完整访谈'
        required: false
        default: false
        type: boolean
      prefer_live_video:
        description: '兼容旧调用；当前自动保留原画比例，不合格原画改人物资料卡'
        required: false
        default: true
        type: boolean

env:
  RUN_TEXT_MODEL: ${{ inputs.local_text_model || 'qwen3:4b' }}
  RUN_SOURCE: ${{ inputs.source || 'https://www.bilibili.com/video/BV1tuCDBhE6C' }}
  RUN_SLUG: ${{ inputs.slug || 'ly-e2e-local-0908' }}
  RUN_SPEAKER: ${{ inputs.speaker || '林园' }}
  RUN_OCCASION: ${{ inputs.occasion || '2025年11月2日林园演讲，CPU离线端到端验收' }}
  RUN_SOURCE_PLATFORM: ${{ inputs.source_platform || 'bilibili' }}
  RUN_REVIEWED_PARTS: ${{ github.event_name == 'push' && '1' || inputs.reviewed_parts }}

permissions:
  contents: write
  actions: write

concurrency:
  group: produce-cn-${{ inputs.slug || 'ly-e2e-local-0908' }}
  # 同一 slug 的新版验收会取代旧版；不同日常 slug 仍可并行，不影响正常出片。
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    # 转写 + 3 次编码，长素材可能到 1 小时以上，留足余量
    timeout-minutes: 180
    defaults:
      run:
        working-directory: linyuan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: CPU离线ASR与完整观点规则回归（失败不进入实产）
        working-directory: .
        run: |
          python -m pip install -q pytest jieba
          python -m pytest -q tests/test_linyuan_asr_integrity.py tests/test_linyuan_editorial_policy.py tests/test_linyuan_qwen_evidence.py tests/test_linyuan_caption_timeout.py

      # fonts-noto-cjk 必装：缺了中文字体，字幕会烧成一排豆腐块
      - name: 安装 ffmpeg 与中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg fonts-noto-cjk poppler-utils libgl1 libglib2.0-0 zstd
          fc-cache -f
          ffprobe -version | head -1

      - name: 安装素材质检依赖
        run: |
          python -m pip install --upgrade pip
          # opencv 必须锁 <5：OpenCV 5.0 移除了 cv2.CascadeClassifier，会静默打断封面人脸检测
          # （2026-09-01 实测：装到 5.0.0 后人脸检测全失败，封面退化成取第一帧）
          pip install yt-dlp pillow 'opencv-python<5' rapidocr-onnxruntime

      - name: 缓存 CPU 本地人物模型
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/linyuan-face-models
          key: opencv-yunet-sface-2023mar-2021dec-v1

      - name: 取源
        id: src
        # 20-minute downloader budget leaves room to persist a retry report.
        timeout-minutes: 25
        env:
          SOURCE: ${{ env.RUN_SOURCE }}
          # 下载和投稿共用同一份登录态；有登录态时 B站可取得 720/1080P，
          # 未配置时下载器仍会选择匿名可用的最高画质。
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE" =~ bilibili\.com/video/BV ]]; then
            # B站 API 在 GitHub runner 上反而通（监控每天在调），
            # yt-dlp 裸请求会被 412，走自己的指纹会话下载器
            mkdir -p _src
            python3 -u ci_fetch_bilibili.py --url "$SOURCE" --out _src/video.mp4 \
              --budget-seconds 1200 \
              --failure-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"
            echo "path=_src/video.mp4" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" =~ yicai\.com/video/ ]]; then
            python3 ci_fetch_yicai.py --url "$SOURCE" --out _src/video.mp4
            echo "path=_src/video.mp4" >> $GITHUB_OUTPUT
          elif [[ "$SOURCE" =~ ^https?:// ]]; then
            mkdir -p _src
            # FC 上传的 staging release 素材：releases/download/<tag>/<slug>.mp4
            # 公开仓库的 download 链接无需 token，直接 curl（yt-dlp 不认这种链接）
            if [[ "$SOURCE" =~ github\.com/.*/releases/download/ ]]; then
              echo "GitHub release 素材，直接下载"
              curl -sfL --retry 3 --max-time 600 -o _src/video.mp4 "$SOURCE"
              [ -s _src/video.mp4 ] || { echo "::error::release 素材下载失败"; exit 1; }
            else
              yt-dlp --continue --socket-timeout 120 --retries 10 \
                --fragment-retries 10 --concurrent-fragments 4 \
                -f 'bv*[height<=1080]+ba/b[height<=1080]/b' \
                --merge-output-format mp4 \
                -o '_src/video.%(ext)s' "$SOURCE"
            fi
            echo "path=$(ls _src/video.* | head -1)" >> $GITHUB_OUTPUT
          else
            [ -f "$SOURCE" ] || { echo "::error::找不到 $SOURCE"; exit 1; }
            echo "path=$SOURCE" >> $GITHUB_OUTPUT
          fi

      - name: 素材质量门禁
        id: source_gate
        env:
          LOCAL_FACE_MODEL_DIR: ${{ runner.tool_cache }}/linyuan-face-models
        run: |
          set -euo pipefail
          # 所有渠道都确认音视频轨、时长漂移与头尾可解码；
          # 避免 DASH/HLS 合流“命令成功但下到半截”继续进 ASR。
          python3 ci_fetch_bilibili.py --validate-only "${{ steps.src.outputs.path }}"
          python3 -u produce_cn.py \
            --source "${{ steps.src.outputs.path }}" \
            --slug "${{ env.RUN_SLUG }}" \
            --speaker "${{ env.RUN_SPEAKER }}" \
            --source-check-only \
            --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      # 只有素材通过后才安装 ASR、恢复大模型并下载权重。低清、双字幕、
      # 错人物素材不会再消耗 1~3 小时转写/编码资源。
      - name: 安装出片依赖
        run: |
          pip install fonttools jieba sherpa-onnx==1.13.7

      - name: 读取已验证的CPU离线识别配置
        run: python prepare_asr_runtime.py select --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      - name: 恢复相同母片的离线识别缓存
        uses: actions/cache/restore@v4
        with:
          path: linyuan/.mother_asr/${{ env.MOTHER_ASR_KEY }}
          key: mother-asr-${{ env.MOTHER_ASR_KEY }}

      - name: 按母片哈希载入原始转写
        run: python mother_asr_cache.py restore --work "deliver/${{ env.RUN_SLUG }}/_tmp" --cache ".mother_asr/$MOTHER_ASR_KEY" --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      - name: 复用同源失败任务的已完成证据
        if: inputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          python restore_production_evidence.py --run-id "$RECOVERY_RUN_ID" --work "deliver/$RUN_SLUG/_tmp"

      - name: 检查原始识别证据，避免重复下载和推理
        run: python prepare_asr_runtime.py cache --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      - name: 准备CPU离线Qwen识别及逐字对齐
        if: env.ASR_BACKEND == 'qwen3' && env.ASR_EVIDENCE_READY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CUDA_VISIBLE_DEVICES: ''
          ASR_SOURCE_SLUG: ${{ env.RUN_SLUG }}
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install qwen-asr
          python prepare_asr_runtime.py prepare --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      - name: 缓存 SenseVoice CPU 模型
        id: sensevoice-cache
        if: env.ASR_BACKEND == 'sensevoice'
        uses: actions/cache@v4
        with:
          path: linyuan/sensevoice_model
          key: sensevoice-int8-v1

      - name: 下载 SenseVoice 模型
        if: env.ASR_BACKEND == 'sensevoice' && steps.sensevoice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sensevoice_model
          curl -sfL --retry 3 --max-time 600 -o /tmp/sv.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          tar xjf /tmp/sv.tar.bz2 -C sensevoice_model --strip-components=1
          ls -lh sensevoice_model/

      - name: 复用 LLM 缓存
        uses: actions/cache@v4
        with:
          path: linyuan/.llm_cache
          key: llm-cn-${{ env.RUN_SLUG }}-${{ github.run_id }}
          restore-keys: |
            llm-cn-${{ env.RUN_SLUG }}-
            llm-cn-

      - name: 缓存 CPU 本地文本模型
        id: ollama-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ${{ env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1' }}

      - name: 启动 CPU 本地文本模型（禁止云 API）
        env:
          OLLAMA_VERSION: v0.33.3
          OLLAMA_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 600 \
            -o /tmp/ollama-linux-amd64.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  /tmp/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama-linux-amd64.tar.zst -C /usr
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=24h OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_NUM_PARALLEL=1 \
            ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          case "$RUN_TEXT_MODEL" in
            qwen3:4b|qwen3:4b-instruct-2507-q4_K_M) ;;
            *) echo '只允许已列明的CPU离线模型' >&2; exit 1 ;;
          esac
          ollama pull "$RUN_TEXT_MODEL"
          ollama show "$RUN_TEXT_MODEL" >/dev/null
          # Pulling only downloads weights.  Warm them into RAM before the
          # bounded CPU review budget begins.
          python -c 'import json,os; print(json.dumps(dict(model=os.environ["RUN_TEXT_MODEL"],messages=[dict(role="user",content="Reply ready")],stream=False,think=False,options=dict(temperature=0,num_predict=8,num_ctx=16384))))' > /tmp/ollama-warmup.json
          curl -fsS --max-time 600 http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/ollama-warmup.json \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert (d.get("message") or {}).get("content")'

      - name: 保存 CPU 本地文本模型缓存
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ${{ env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1' }}

      - name: 出片
        id: render
        env:
          # 字幕识别与清理只在本地 CPU 运行，禁止 API 改写转写结果
          ASR_CPU_THREADS: '2'
          CUDA_VISIBLE_DEVICES: ''
          TEXT_BACKEND: local
          LOCAL_LLM_URL: http://127.0.0.1:11434/api/chat
          LOCAL_LLM_MODEL: ${{ env.RUN_TEXT_MODEL }}
          LOCAL_LLM_TIMEOUT_SEC: '600'
          SENSEVOICE_MODEL_DIR: sensevoice_model
          # ubuntu runner 没有 Microsoft YaHei/Arial，libass 找不到会烧成豆腐块
          ZH_FONT: Noto Sans CJK SC
          EN_FONT: DejaVu Sans
          # auto：干净原画用实景封面，资料卡在浅色/深色间按标题稳定选择。
          COVER_STYLE: ${{ vars.COVER_STYLE || 'auto' }}
          REVIEWED_PARTS: ${{ env.RUN_REVIEWED_PARTS }}
          SELECTED_PARTS: ${{ inputs.selected_parts }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ORIGIN_URL: ${{ env.RUN_SOURCE }}
          PUBLICATION_STATE_PATH: _publication_state.json
          REPAIR_BVID: ${{ inputs.repair_bvid }}
          RENDER_SLUG: ${{ env.RUN_SLUG }}
        run: |
          set -euo pipefail
          # Read actual receipts so a cached mother does not re-render used excerpts.
          gh api "repos/$GITHUB_REPOSITORY/contents/linyuan/.automation/fc_state.json?ref=main" --jq '.content' | base64 --decode > "$PUBLICATION_STATE_PATH"
          if [ -n "$REPAIR_BVID" ]; then
            test '${{ inputs.auto_publish }}' != 'true'
            python media_revision.py --bvid "$REPAIR_BVID" --slug "$RENDER_SLUG" --state "$PUBLICATION_STATE_PATH"
          fi
          python3 -u produce_cn.py \
            --source "${{ steps.src.outputs.path }}" \
            --slug "${{ env.RUN_SLUG }}" \
            --speaker "${{ env.RUN_SPEAKER }}" \
            --occasion "${{ env.RUN_OCCASION }}" \
            --source-platform "${{ env.RUN_SOURCE_PLATFORM }}" \
            --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json" \
            --split-highlights \
            --only-reviewed-parts "$REVIEWED_PARTS" \
            --only-selected-parts "$SELECTED_PARTS" \
            ${{ inputs.target_parts != '' && inputs.target_parts != '0' && format('--target-parts {0}', inputs.target_parts) || '' }} \
            ${{ inputs.include_full && '--include-full' || '' }} \
            ${{ (github.event_name == 'push' || inputs.prefer_live_video) && '--prefer-live-video' || '' }}

      - name: 留存完整观点与原始ASR核验材料
        if: always() && steps.render.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ env.RUN_SLUG }}
          path: |
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/asr*.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/cues_raw.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/highlight*.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/highlight*.txt
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/context_response*.txt
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/editorial_review*.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/qr_review/
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/semantic*.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/semantic*.txt
            linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json
            linyuan/deliver/${{ env.RUN_SLUG }}/meta.json
            linyuan/deliver/${{ env.RUN_SLUG }}/subtitles*.ass
          retention-days: 30
          if-no-files-found: ignore

      - name: 保存已完成的母片转写供后续选段复用
        if: always() && steps.render.outcome != 'skipped' && env.MOTHER_ASR_KEY != ''
        run: python mother_asr_cache.py save --work "deliver/${{ env.RUN_SLUG }}/_tmp" --cache ".mother_asr/$MOTHER_ASR_KEY" --source-report "deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json"

      - uses: actions/cache/save@v4
        if: always() && steps.render.outcome != 'skipped' && env.MOTHER_ASR_KEY != ''
        with:
          path: linyuan/.mother_asr/${{ env.MOTHER_ASR_KEY }}
          key: mother-asr-${{ env.MOTHER_ASR_KEY }}

      - name: 整理归档（slug 命名，留存可分析产物）
        run: |
          set -euo pipefail
          cd "deliver/${{ env.RUN_SLUG }}"
          python3 -c 'import sys; sys.path.insert(0,"../.."); from batch_delivery import archive_accepted; archive_accepted(".",sys.argv[1])' "${{ env.RUN_SLUG }}"
          echo "归档产物："
          ls -la _accepted/

      - name: 上传成片到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ env.RUN_SLUG }}
          path: linyuan/deliver/${{ env.RUN_SLUG }}/_accepted/
          retention-days: 90
          if-no-files-found: error

      - name: 上传成片到 Release
        # The accepted Artifact above is the publication source of truth.
        # A colliding thumbnail in this optional mirror must not lose a batch.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deliver-${{ env.RUN_SLUG }}
          name: 成品库 · ${{ env.RUN_SLUG }}
          files: linyuan/deliver/${{ env.RUN_SLUG }}/_accepted/${{ env.RUN_SLUG }}.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保留部分失败的实际成片与逐帧取景证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-evidence-${{ env.RUN_SLUG }}
          path: |
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/rejected/
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/tracked*.json
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/live-region-*/
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/final_identity*/
          retention-days: 14
          if-no-files-found: ignore

      # 失败时把转写、金句、译文带出来，否则只能靠日志猜是哪步不达标
      - name: 保存本地模型运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-text-runtime-${{ env.RUN_SLUG }}
          path: /tmp/ollama.log
          if-no-files-found: ignore

      - name: 失败时上传中间产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ env.RUN_SLUG }}
          path: |
            linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/
            linyuan/deliver/${{ env.RUN_SLUG }}/meta.json
            linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json
            linyuan/deliver/${{ env.RUN_SLUG }}/final*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传整源无合格片结果供自动补位
        if: failure() && steps.render.outcome == 'failure' && inputs.repair_bvid == ''
        uses: actions/upload-artifact@v4
        with:
          name: production-reject-${{ env.RUN_SLUG }}
          path: linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json
          retention-days: 14
          if-no-files-found: ignore

      # 素材门禁失败要与普通出片异常分开：FC 每小时读取这个小 artifact，
      # 立即淘汰该素材并补调一个新候选，不再傻等 12 小时无成片超时。
      - name: 上传素材拒绝结果
        if: failure() && (steps.source_gate.outcome == 'failure' || steps.src.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: source-reject-${{ env.RUN_SLUG }}
          path: linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json
          retention-days: 14
          if-no-files-found: error

      - name: 摘要
        if: always()
        run: |
          {
            echo "## ${{ env.RUN_SLUG }}"
            # cwd 是 linyuan/（job 级 working-directory），路径不带前缀；
            # 只有 actions/* 的 with.path 才相对仓库根、需要 linyuan/ 前缀。
            if [ -f "deliver/${{ env.RUN_SLUG }}/meta.json" ]; then
              echo '```json'
              cat "deliver/${{ env.RUN_SLUG }}/meta.json"
              echo '```'
            else
              echo "未产出 meta.json，见 debug artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── B 站自动投稿（可选，默认关闭）─────────────────────────────
      # 开启方式：本机跑 linyuan/setup_bilibili_cookies.sh，扫码登录后
      # cookies.json 会写进 BILIBILI_COOKIES secret。
      #
      # 这里分两步，理由：
      # 1. secret 里装的是 cookies.json 全文（内容），不是路径 —— 直接当
      #    路径传给脚本必然报「文件不存在」。
      # 2. secrets 不能出现在步骤级 if 里 —— 必须由准备步骤把「配没配好」
      #    翻译成 GITHUB_ENV 变量，投稿步骤再判断。
      - name: 准备 B站登录态
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          python3 bili_cookies.py \
            --out "$RUNNER_TEMP/bili_cookies.json" \
            --github-env "$GITHUB_ENV"

      - name: B 站投稿
        if: env.BILI_COOKIES_FILE != '' && inputs.auto_publish
        env:
          RUST_LOG: info
        run: |
          set -euo pipefail
          # 跨太平洋疑似 MTU 黑洞：小包全通、大包全丢、16m20s 确定性超时
          # （≈tcp_retries2 上限）。压低 MSS 强制对端按小包收发。
          sudo iptables -t mangle -A OUTPUT -p tcp --tcp-flags SYN,RST SYN \
            -j TCPMSS --set-mss 1300
          echo "MSS 已压到 1300"
          python -m pip install -q biliup
          DTIME=0
          if [ "${{ inputs.delay_hours }}" != "0" ]; then
            DTIME=$(date -d "+${{ inputs.delay_hours }} hours" +%s)
            echo "定时发布：$(date -d "@$DTIME" '+%Y-%m-%d %H:%M') UTC"
          fi
          python3 publish_bilibili_cn.py --slug "${{ env.RUN_SLUG }}" --dtime "$DTIME"

      - name: 明确触发库存核验与自动补位
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linyuan-source-inventory.yml --repo "$GITHUB_REPOSITORY" --ref main
