name: 林园成片交付与剩余片段验收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-delivery-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 回归新旧成片库兼容性
        run: |
          pip install -q pytest jieba pillow 'opencv-python<5' rapidocr-onnxruntime
          python -m pytest -q tests/test_fc_delivery_releases.py
      - name: 补齐第647次已合格成片的独立 Release 备份
        run: |
          gh run download 34342158327 -n deliver-ly-0909-7c4660-tracked14 -D /tmp/accepted647
          tag=deliver-ly-0909-7c4660-tracked14
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title '成品库 · ly-0909-7c4660-tracked14' --notes '已通过成片质量门禁；从原始交付 Artifact 恢复备份。'
          gh release upload "$tag" /tmp/accepted647/ly-0909-7c4660-tracked14.* --clobber
      - name: 让实际合格视频进入库存核验
        run: gh workflow run linyuan-source-inventory.yml --ref main
      - name: 复核第652次实片中的两帧误拒绝侧脸
        run: |
          gh run download 34344143239 -n render-evidence-ly-0909-7c4660-tracked17 -D /tmp/rejected652
          PYTHONPATH=linyuan python - <<'PY'
          import produce_cn as p
          video='/tmp/rejected652/rejected/2/final_2.mp4'
          result=p.verify_live_region_after_render(video)
          assert result['full_face_frames']==6
          print('Actual #652 profile clip passes all live-window gates:',result)
          PY
      - name: 只复测尚未通过的第二条，保留实际失败画面
        run: python linyuan/register_selection_recovery.py --suffix tracked18 --evidence-run 34340237266 --selected-parts 2
