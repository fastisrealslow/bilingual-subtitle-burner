name: 内容理解分阶段实验：8B/9B阅读、8B拟稿、9B盲审
'on':
  push:
    branches:
    - codex/linyuan-reliability-packaging
    paths:
    - .github/workflows/linyuan-content-stages.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: linyuan-content-stages
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
        - 0
        - 1
        - 2
        profile:
        - 8b-reader
        - 9b-reader
    env:
      RUN_TEXT_MODEL: ${{ matrix.profile == '9b-reader' && 'qwen3.5:9b' || 'qwen3:8b' }}
      CUDA_VISIBLE_DEVICES: ''
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 缓存 CPU 本地文本模型
      id: ollama-cache
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ${{ env.RUN_TEXT_MODEL == 'qwen3.5:9b' && 'ollama-qwen35-9b-v1' || env.RUN_TEXT_MODEL == 'qwen3:8b'
          && 'ollama-qwen3-8b-v1' || env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1'
          }}
    - name: 缓存已校验的 Ollama 安装包
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: /tmp/ollama-runtime
        key: ollama-linux-amd64-v0.33.3-c13cea8f3389db41
    - name: 启动 CPU 本地文本模型（禁止云 API）
      id: local_text
      env:
        OLLAMA_VERSION: v0.33.3
        OLLAMA_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
      run: "set -euo pipefail\nmkdir -p /tmp/ollama-runtime\narchive=/tmp/ollama-runtime/ollama-linux-amd64.tar.zst\n\
        if ! echo \"${OLLAMA_SHA256}  $archive\" | sha256sum -c -; then\n  curl -fsSL --retry 8 --retry-all-errors\
        \ --retry-delay 5 --retry-max-time 300 --max-time 600 \\\n    -o /tmp/ollama-download.tar.zst \\\n    \"\
        https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst\"\n  echo\
        \ \"${OLLAMA_SHA256}  /tmp/ollama-download.tar.zst\" | sha256sum -c -\n  mv /tmp/ollama-download.tar.zst\
        \ \"$archive\"\nfi\nsudo tar --zstd -xf \"$archive\" -C /usr\nOLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=24h\
        \ OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \\\n  ollama serve > /tmp/ollama.log\
        \ 2>&1 &\nfor _ in $(seq 1 30); do\n  curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break\n  sleep\
        \ 1\ndone\ncurl -fsS http://127.0.0.1:11434/api/tags >/dev/null\ncase \"$RUN_TEXT_MODEL\" in\n  qwen3:4b|qwen3:4b-instruct-2507-q4_K_M|qwen3:8b|qwen3.5:9b)\
        \ ;;\n  *) echo '只允许已列明的CPU离线模型' >&2; exit 1 ;;\nesac\nollama pull \"$RUN_TEXT_MODEL\"\nollama show \"$RUN_TEXT_MODEL\"\
        \ >/dev/null\n# Pulling only downloads weights.  Warm them into RAM before the\n# bounded CPU review budget\
        \ begins.\npython -c 'import json,os; print(json.dumps(dict(model=os.environ[\"RUN_TEXT_MODEL\"],messages=[dict(role=\"\
        user\",content=\"Reply ready\")],stream=False,think=False,options=dict(temperature=0,num_predict=8,num_ctx=8192))))'\
        \ > /tmp/ollama-warmup.json\ncurl -fsS --max-time 600 http://127.0.0.1:11434/api/chat \\\n  -H 'Content-Type:\
        \ application/json' \\\n  --data-binary @/tmp/ollama-warmup.json \\\n  | python -c 'import json,sys; d=json.load(sys.stdin);\
        \ assert (d.get(\"message\") or {}).get(\"content\")'\n"
    - name: 分阶段内容实验；不生产、不投稿
      run: python -u scripts/linyuan_content_stages.py read --case "${{ matrix.case }}" --profile "${{ matrix.profile
        }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: content-read-${{ matrix.profile }}-${{ matrix.case }}
        path: content-stage-results/
        if-no-files-found: warn
        retention-days: 30
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
        - 0
        - 1
        - 2
        profile:
        - 8b-reader
        - 9b-reader
    env:
      RUN_TEXT_MODEL: qwen3:8b
      CUDA_VISIBLE_DEVICES: ''
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v4
      with:
        name: content-read-${{ matrix.profile }}-${{ matrix.case }}
        path: stage-input
    - name: 缓存 CPU 本地文本模型
      id: ollama-cache
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ${{ env.RUN_TEXT_MODEL == 'qwen3.5:9b' && 'ollama-qwen35-9b-v1' || env.RUN_TEXT_MODEL == 'qwen3:8b'
          && 'ollama-qwen3-8b-v1' || env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1'
          }}
    - name: 缓存已校验的 Ollama 安装包
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: /tmp/ollama-runtime
        key: ollama-linux-amd64-v0.33.3-c13cea8f3389db41
    - name: 启动 CPU 本地文本模型（禁止云 API）
      id: local_text
      env:
        OLLAMA_VERSION: v0.33.3
        OLLAMA_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
      run: "set -euo pipefail\nmkdir -p /tmp/ollama-runtime\narchive=/tmp/ollama-runtime/ollama-linux-amd64.tar.zst\n\
        if ! echo \"${OLLAMA_SHA256}  $archive\" | sha256sum -c -; then\n  curl -fsSL --retry 8 --retry-all-errors\
        \ --retry-delay 5 --retry-max-time 300 --max-time 600 \\\n    -o /tmp/ollama-download.tar.zst \\\n    \"\
        https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst\"\n  echo\
        \ \"${OLLAMA_SHA256}  /tmp/ollama-download.tar.zst\" | sha256sum -c -\n  mv /tmp/ollama-download.tar.zst\
        \ \"$archive\"\nfi\nsudo tar --zstd -xf \"$archive\" -C /usr\nOLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=24h\
        \ OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \\\n  ollama serve > /tmp/ollama.log\
        \ 2>&1 &\nfor _ in $(seq 1 30); do\n  curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break\n  sleep\
        \ 1\ndone\ncurl -fsS http://127.0.0.1:11434/api/tags >/dev/null\ncase \"$RUN_TEXT_MODEL\" in\n  qwen3:4b|qwen3:4b-instruct-2507-q4_K_M|qwen3:8b|qwen3.5:9b)\
        \ ;;\n  *) echo '只允许已列明的CPU离线模型' >&2; exit 1 ;;\nesac\nollama pull \"$RUN_TEXT_MODEL\"\nollama show \"$RUN_TEXT_MODEL\"\
        \ >/dev/null\n# Pulling only downloads weights.  Warm them into RAM before the\n# bounded CPU review budget\
        \ begins.\npython -c 'import json,os; print(json.dumps(dict(model=os.environ[\"RUN_TEXT_MODEL\"],messages=[dict(role=\"\
        user\",content=\"Reply ready\")],stream=False,think=False,options=dict(temperature=0,num_predict=8,num_ctx=8192))))'\
        \ > /tmp/ollama-warmup.json\ncurl -fsS --max-time 600 http://127.0.0.1:11434/api/chat \\\n  -H 'Content-Type:\
        \ application/json' \\\n  --data-binary @/tmp/ollama-warmup.json \\\n  | python -c 'import json,sys; d=json.load(sys.stdin);\
        \ assert (d.get(\"message\") or {}).get(\"content\")'\n"
    - name: 分阶段内容实验；不生产、不投稿
      run: python -u scripts/linyuan_content_stages.py write --case "${{ matrix.case }}" --profile "${{ matrix.profile
        }}" --input stage-input/read.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: content-write-${{ matrix.profile }}-${{ matrix.case }}
        path: content-stage-results/
        if-no-files-found: warn
        retention-days: 30
    needs:
    - read
    if: ${{ always() && !cancelled() }}
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
        - 0
        - 1
        - 2
