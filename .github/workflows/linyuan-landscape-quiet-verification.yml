name: 横版深灰底与更大真人窗口完整复验（不投稿）
on:
  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-landscape-quiet-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '79'
      content_policy: reference_v1
      title_draft_profile: source_choices
      output_layout: landscape
      landscape_style: quiet
      recovery_run_id: '35837686332'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
