name: 完整句选段超时修复验收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-topic-budget-recovery.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: topic-budget-recovery-0913
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 验证全部候选仍被完整审核且不跨话题凑时长
        run: |
          pip install -q pytest jieba requests numpy 'opencv-python-headless<5'
          python -m pytest -q tests/test_linyuan_context_review.py tests/test_linyuan_source_selection.py tests/test_linyuan_candidate_gate.py
      - name: 复用第798次的原始转写，登记一次有界恢复
        run: >-
          python linyuan/register_selection_recovery.py
          --origin-slug ly-0913-a52266
          --expected-source https://www.bilibili.com/video/BV1knXhB9EZc
          --suffix boundary16
          --output-layout portrait
          --evidence-run 34751989579
