name: 林园真人动态70%正式上线

on:
  push:
    paths:
      - '.github/workflows/linyuan-production-live70-rollout.yml'

permissions:
  contents: write
  actions: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固化用户审片后的正式生产策略
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('linyuan/produce_cn.py')
          s=p.read_text()
          # 保持最终 V11 黑边门禁：用户实审 51/52/53 明显黑区不合格，
          # 21/22/23/31/32/33 可接受。真人动态比例靠选片/补候选达到，
          # 不通过放宽黑边质量阈值硬凑。
          marker='LIVE_VIDEO_TARGET_RATIO = 0.70\n'
          if 'LIVE_VIDEO_TARGET_RATIO' not in s:
              insert='''\n# 正式生产目标（2026-09-06 用户实审）：发布候选真人动态 >=70%，\n# audio_card <=30%。明显持续黑区/错误取景仍由 V11 淘汰，不能放水。\nLIVE_VIDEO_TARGET_RATIO = 0.70\nAUDIO_CARD_MAX_RATIO = 0.30\n\n'''
              anchor='AUDIO_CARD_WIDTH = 720\n'
              if anchor not in s: raise SystemExit('constants anchor not found')
              s=s.replace(anchor, insert+anchor, 1)
          p.write_text(s)
          PY
          python3 -m py_compile linyuan/produce_cn.py linyuan/presentation.py
          git diff --check
      - name: 提交正式生产配置
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linyuan/produce_cn.py
          git diff --cached --quiet || git commit -m 'prod: target 70 percent approved live video without relaxing black-border gate'
          git push
      - name: 立即触发日常候选补量
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 触发现有日常候选/发现链，正式生产继续由原日常调度负责，避免另造平行生产线。
          for wf in linyuan-candidate-pool.yml linyuan-discover.yml; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}' || true)
            echo "$wf -> $code"
            if [ "$code" != 204 ] && [ "$code" != 404 ]; then cat /tmp/resp; exit 1; fi
          done
