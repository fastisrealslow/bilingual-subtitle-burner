name: 林园10条验收V2修复并重跑

on:
  push:
    paths:
      - '.github/workflows/linyuan-live70-review-v2-hotfix.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修复长回退切点、孤立字幕碎片和真人窗口
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('linyuan/produce_cn.py')
          s=p.read_text()

          old='''    # 切片边界必须落在完整句。旧逻辑错误地检查 cues[a] 自己是否以句号结尾，\n    # 这无法判断 a 是否处在上一句话中间；因此会出现成片第一帧直接从“了是吧？”\n    # 这种尾巴开始。正确规则：start 的前一条必须已经结束一个完整句，否则持续向左\n    # 回退；end 则向右扩到本句结束。\n    SENT_TAIL = "。！？!?"\n    for v in valid:\n        a, b = v["start"], v["end"]\n        while a > 0:\n            prev = (cues[a-1].get("text") or "").rstrip()\n            if prev and prev[-1] in SENT_TAIL:\n                break\n            a -= 1\n        while b < len(cues) - 1:\n            cur = (cues[b].get("text") or "").rstrip()\n            if cur and cur[-1] in SENT_TAIL:\n                break\n            b += 1\n        v["start"], v["end"] = a, b\n'''
          new='''    # 切片边界尽量落在完整句，但绝不能为找句号跨几十秒/几分钟回退。\n    # SenseVoice 的句号并不稳定，旧版无限 while 会把 30~90s 金句扩成 2~4 分钟，\n    # 既破坏开头钩子也直接拖垮渲染。这里将对齐限制在 8 秒/4 cue：\n    # 先找最近的上一句结束；找不到就向前丢掉当前残句，宁可少几秒也不从半句话开头。\n    SENT_TAIL = "。！？!?"\n    MAX_ALIGN_SEC = 8.0\n    MAX_ALIGN_CUES = 4\n    for v in valid:\n        a0, b0 = v["start"], v["end"]\n        a, b = a0, b0\n        found = False\n        for j in range(a0 - 1, max(-1, a0 - MAX_ALIGN_CUES - 1), -1):\n            if cues[a0]["start"] - cues[j]["end"] > MAX_ALIGN_SEC:\n                break\n            prev = (cues[j].get("text") or "").rstrip()\n            if prev and prev[-1] in SENT_TAIL:\n                a = j + 1\n                found = True\n                break\n        if not found:\n            for j in range(a0, min(b0, a0 + MAX_ALIGN_CUES) + 1):\n                if cues[j]["end"] - cues[a0]["start"] > MAX_ALIGN_SEC:\n                    break\n                cur = (cues[j].get("text") or "").rstrip()\n                if cur and cur[-1] in SENT_TAIL and j + 1 <= b0:\n                    a = j + 1\n                    break\n        for j in range(b0, min(len(cues), b0 + MAX_ALIGN_CUES + 1)):\n            if cues[j]["end"] - cues[b0]["end"] > MAX_ALIGN_SEC:\n                break\n            cur = (cues[j].get("text") or "").rstrip()\n            b = j\n            if cur and cur[-1] in SENT_TAIL:\n                break\n        v["start"], v["end"] = a, b\n'''
          if old not in s: raise SystemExit('old unbounded boundary block not found')
          s=s.replace(old,new,1)

          old2='''    cues = _merge_cues(cues)\n    # 去重 + GLOSSARY 纠错（SenseVoice 偶发小错字，如「金钱二」→「金钱上」）\n    for c in cues:\n'''
          new2='''    cues = _merge_cues(cues)\n    # 合并极短孤立尾巴后再交给 LLM 通顺化。否则会出现上一屏“回来一大”\n    # 下一屏只剩“钱？”这种肉眼可见的半句话。短碎片只有在紧邻且上一句未结束时合并。\n    compact = []\n    for c in cues:\n        text = (c.get("text") or "").strip()\n        bare = text.rstrip("。！？!?，,；;：:")\n        if (compact and len(bare) <= 3\n                and c["start"] - compact[-1]["end"] <= 0.65\n                and not (compact[-1].get("text") or "").rstrip().endswith(tuple("。！？!?"))):\n            compact[-1]["text"] = (compact[-1].get("text") or "") + text\n            compact[-1]["end"] = c["end"]\n        else:\n            compact.append(dict(c))\n    cues = compact\n    # 去重 + GLOSSARY 纠错（SenseVoice 偶发小错字，如「金钱二」→「金钱上」）\n    for c in cues:\n'''
          if old2 not in s: raise SystemExit('sensevoice merge anchor not found')
          s=s.replace(old2,new2,1)

          old3='''    crop_h = min(height, int(height * 0.78)) // 2 * 2\n    crop_w = min(width, int(crop_h * target_ratio)) // 2 * 2\n    if crop_w > width:\n        crop_w = width // 2 * 2\n        crop_h = int(crop_w / target_ratio) // 2 * 2\n    crop_x = int((width - crop_w) * 0.68) // 2 * 2\n    crop_y = int((height - crop_h) * 0.45) // 2 * 2\n'''
          new3='''    # 横屏访谈优先取人物上半身，主动避开底部常驻字幕/栏目条。\n    # 旧版取 78% 高度会把 0.73~0.95H 的来源条带一起带进真人窗口，\n    # 导致本来可用的 1080P 双人访谈全部退回 audio_card。\n    crop_h = min(height, int(height * 0.60)) // 2 * 2\n    crop_w = min(width, int(crop_h * target_ratio)) // 2 * 2\n    if crop_w > width:\n        crop_w = width // 2 * 2\n        crop_h = int(crop_w / target_ratio) // 2 * 2\n    crop_x = int((width - crop_w) * 0.72) // 2 * 2\n    crop_y = int(height * 0.05) // 2 * 2\n'''
          if old3 not in s: raise SystemExit('live crop block not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          python3 -m py_compile linyuan/produce_cn.py
          git diff --check
          git diff -- linyuan/produce_cn.py
      - name: 提交生产修复
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linyuan/produce_cn.py
          git commit -m 'fix: bound sentence alignment and rescue clean live interview crops'
          git push
      - name: 重跑10条审阅样片
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run linyuan-ten-sample-review.yml --repo fastisrealslow/bilingual-subtitle-burner --ref main
