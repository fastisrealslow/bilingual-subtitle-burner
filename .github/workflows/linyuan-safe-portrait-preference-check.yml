name: 实验竖版偏好双原片画面回放（不入库不投稿）
on:
  push:
    branches: [codex/linyuan-safe-portrait-preference-20261023]
    paths: [linyuan/produce_cn.py, linyuan/check_safe_portrait_preference.py, .github/workflows/linyuan-safe-portrait-preference-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      LINYUAN_AUTOMATIC_ONLY: 'true'
      LINYUAN_EDITORIAL_PROFILE: field-story-v1
      OUTPUT_LAYOUT: portrait
      CONTENT_POLICY: reference_v1
      TEXT_BACKEND: local
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 与生产相同的有界媒体工具准备
        timeout-minutes: 15
        run: bash linyuan/ci_install_media_tools.sh
      - name: 仅安装画面检查依赖，不安装或调用语音与文本模型
        run: pip install pillow numpy jieba 'opencv-python<5' rapidocr-onnxruntime
      - name: 第一条横版必须保留；旧竖版只验证原像素与完整动态区
        run: python -u linyuan/check_safe_portrait_preference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-portrait-preference-verification
          path: safe-portrait-preference-verification/
          retention-days: 7
          if-no-files-found: error
