name: FC staging package

# FC 调度代码每次进入 main 后，覆盖 staging Release 中的固定资产。
# 部署端始终可以用同一个 URL 下载最新版：
# https://github.com/fastisrealslow/bilingual-subtitle-burner/releases/download/staging/fc-code.zip
on:
  push:
    branches: [main]
    paths:
      - linyuan/fc/index.py
      - linyuan/fc/stage_revision.py
      - linyuan/fc/title_revision.py
      - linyuan/fc/media_repair.py
      - linyuan/fc/reviewed_updates.py
      - linyuan/fc/reviewed_third_video.py
      - linyuan/fc/reviewed_0910/**
      - linyuan/stage_context.py
      - linyuan/title_rewrite.py
      - linyuan/title_quantity_context.py
      - linyuan/title_market_impression.py
      - linyuan/presentation.py
      - linyuan/live_motion.py
      - linyuan/source_geometry.py
      - linyuan/fc/package_code.py
      - linyuan/artifact_range.py
      - linyuan/speaker_attribution.py
      - linyuan/source_priority.py
      - linyuan/production_diagnostics.py
      - linyuan/headline_policy.py
      - linyuan/editorial_policy.py
      - linyuan/caption_readability.py
      - .github/workflows/fc-staging-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fc-staging-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 打包 FC 代码
        run: |
          set -euo pipefail
          python linyuan/fc/package_code.py "$RUNNER_TEMP/fc-code.zip"
          unzip -l "$RUNNER_TEMP/fc-code.zip"

      - name: 更新 staging Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view staging >/dev/null 2>&1; then
            gh release create staging \
              --target "$GITHUB_SHA" \
              --title "FC staging" \
              --notes "Rolling staging package for Aliyun FC." \
              --prerelease
          fi
          gh release upload staging "$RUNNER_TEMP/fc-code.zip" --clobber
