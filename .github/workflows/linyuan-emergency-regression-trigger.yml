name: 林园完整意群有界缩放回归触发
on:
  push:
    paths: ['.github/workflows/linyuan-emergency-regression-trigger.yml']
permissions:
  contents: read
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发已定位字幕失败素材回归
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 该条已通过清晰度和人物门禁；修复既覆盖词边界有界缩放，也覆盖
          # 跨 8 秒意群仅按原始 ASR 词边界重分。用新 slug 重跑，避免把旧失败记录
          # 或旧 MP4 伪装成合格片；当天投稿仍受 FC 的 6 条硬上限控制。
          while IFS='|' read -r source slug; do
            gh workflow run linyuan-produce-cn.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f source="$source" \
              -f slug="$slug" \
              -f speaker='林园' \
              -f occasion='完整意群有界缩放回归' \
              -f source_platform='bilibili_search' \
              -f auto_publish=false \
              -f prefer_live_video=true
          done <<'EOF'
          https://www.bilibili.com/video/BV1NFbe6VELY|ly-caption-scale-0906-01-r5
          EOF
