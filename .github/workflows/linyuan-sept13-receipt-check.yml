name: 林园9月13日补发回执核验
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-sept13-receipt-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 只读核对两条补发稿件的公开状态
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python linyuan/bili_archive_status.py --bvid BV11qYB6MEyq --bvid BV11BYB6iEHY --out sept13-makeup-receipts.json
      - name: 确认稿件已经公开
        run: |
          python - <<'PY'
          import json
          report=json.load(open('sept13-makeup-receipts.json'))
          assert report.get('public_count') == 2, 'Upload receipt exists but public visibility is not yet confirmed; do not reupload'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sept13-makeup-receipts
          path: sept13-makeup-receipts.json
          if-no-files-found: error
