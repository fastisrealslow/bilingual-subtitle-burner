name: 接续已通过 CPU 验收的原稿修复部署
on:
  push:
    branches: [codex/linyuan-replace-jitter-20261015]
    paths: [.github/workflows/linyuan-resume-tracking-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi aliyun-log-python-sdk
      - name: 核对登录配置并获取一次受互斥保护的替换回执
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, io, subprocess
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as api
          from alibabacloud_tea_util import models as util
          c=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],access_key_secret=os.environ['ALIYUN_SK'],endpoint='fcv3.cn-hangzhou.aliyuncs.com'))
          t=c.get_async_task_with_options('fc-develop','tracking-20261015-e26f63ee30ff3283-0',m.GetAsyncTaskRequest(qualifier='LATEST'),{},util.RuntimeOptions(autoretry=False)).body.to_map()
          print('Task fields:',sorted(t))
          selected={k:v for k,v in t.items() if any(s in k.lower() for s in ('error','failure','status','returnpayload'))}
          text=json.dumps(selected,ensure_ascii=False)
          text=re.sub(r'https?://[^\s"\\]+','[url]',text)
          text=re.sub(r'(?i)(SESSDATA|bili_jct|access.?key|token)[=:][^\s,;]+',r'\1=[redacted]',text)
          print(text[:12000])
          for n in range(10):
              task_id='tracking-20261015-e76e558a84e169fb-'+str(n)
              try:
                  task=c.get_async_task_with_options('fc-develop',task_id,m.GetAsyncTaskRequest(qualifier='LATEST'),{},util.RuntimeOptions(autoretry=False)).body.to_map()
              except Exception as exc:
                  if any(v in str(getattr(exc,'code','')) for v in ('NotFound','NotExist')):continue
                  raise
              print(json.dumps({k:task.get(k) for k in ('taskId','status','startedTime','endTime','durationMs','taskErrorMessage')},ensure_ascii=False))
          cfg=c.get_function('fc-develop',m.GetFunctionRequest(qualifier='LATEST')).body.log_config
          print('Function log configured:',bool(cfg and cfg.project and cfg.logstore))
          if cfg and cfg.project and cfg.logstore:
              from aliyun.log import LogClient
              from datetime import datetime
              parse=lambda v:int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp())
              logs=LogClient('cn-hangzhou.log.aliyuncs.com',os.environ['ALIYUN_AK'],os.environ['ALIYUN_SK'])
              out=logs.get_log(cfg.project,cfg.logstore,parse(t['startedTime'])-5,parse(t['endTime'])+10,query='"'+t['requestId']+'"',size=100)
              for row in out.get_logs():
                  fields=dict(row.contents)
                  message=str(fields.get('message') or fields.get('content') or fields)
                  if not any(x in message for x in ('Error','Exception','Traceback','File "','raise ','ValueError','RuntimeError')):continue
                  message=re.sub(r'https?://[^\s"\\]+','[url]',message)
                  if any(x.lower() in message.lower() for x in ('sessdata','bili_jct','cookie','accesskey')):
                      message='[sensitive diagnostic line omitted]'
                  print(message[:6000])
          PY
