name: 接续已通过 CPU 验收的原稿修复部署
on:
  push:
    branches: [codex/linyuan-replace-jitter-20261015]
    paths: [.github/workflows/linyuan-resume-tracking-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 只读查询唯一替换任务错误
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
        run: |
          python - <<'PY'
          import json, os, re
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as api
          from alibabacloud_tea_util import models as util
          c=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],access_key_secret=os.environ['ALIYUN_SK'],endpoint='fcv3.cn-hangzhou.aliyuncs.com'))
          t=c.get_async_task_with_options('fc-develop','tracking-20261015-e26f63ee30ff3283-0',m.GetAsyncTaskRequest(qualifier='LATEST'),{},util.RuntimeOptions(autoretry=False)).body.to_map()
          print('Task fields:',sorted(t))
          selected={k:v for k,v in t.items() if any(s in k.lower() for s in ('error','failure','status','returnpayload'))}
          text=json.dumps(selected,ensure_ascii=False)
          text=re.sub(r'https?://[^\s"\\]+','[url]',text)
          text=re.sub(r'(?i)(SESSDATA|bili_jct|access.?key|token)[=:][^\s,;]+',r'\1=[redacted]',text)
          print(text[:12000])
          PY
