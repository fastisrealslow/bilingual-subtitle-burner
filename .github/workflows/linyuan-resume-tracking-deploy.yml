name: 接续已通过 CPU 验收的原稿修复部署
on:
  push:
    branches: [codex/linyuan-replace-jitter-20261015]
    paths: [.github/workflows/linyuan-resume-tracking-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 仅接续已验收的当前修复主线
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor 889be4d387cb3ccfcb03ec260000acbc321d8953 HEAD
          python - <<'PY'
          import json, subprocess
          def get(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          base='repos/fastisrealslow/bilingual-subtitle-burner/'
          deployed=get(base+'actions/runs/38686586178')
          assert deployed['head_sha']=='889be4d387cb3ccfcb03ec260000acbc321d8953'
          assert deployed['path']=='.github/workflows/fc-production-deploy.yml'
          assert deployed['status']=='completed' and deployed['conclusion']=='success'
          jobs=get(base+'actions/runs/38686586178/jobs?per_page=100')['jobs']
          assert all(any(j['name']==name and j['conclusion']=='success' for j in jobs)
                     for name in ('editorial-check','deploy'))
          subprocess.run(['gh','workflow','run','linyuan-apply-reported-tracking.yml','--ref','main'],check=True)
          print('已确认正式部署成功，接续有持久回执和互斥锁保护的唯一原稿替换。')
          PY
