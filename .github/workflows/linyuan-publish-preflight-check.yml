name: 四条真实重复排片的发布前核验回放（不投稿）
on:
  push:
    paths:
      - linyuan/fc/index.py
      - linyuan/check_publish_preflight.py
      - .github/workflows/linyuan-publish-preflight-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装与实际库存校验一致的运行依赖
        run: pip install -q -r linyuan/fc/runtime-requirements.txt
      - name: 原封不动回读14点前快照，核对实际四条重复片
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u linyuan/check_publish_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-preflight-verification
          path: publish-preflight-verification.json
          retention-days: 30
          if-no-files-found: error
