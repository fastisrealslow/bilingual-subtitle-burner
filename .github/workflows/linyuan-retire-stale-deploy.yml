name: 取消被新修复替代的旧部署
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-retire-stale-deploy.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 核对旧版本后取消唯一指定旧任务
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          old=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/34762661471']))
          assert old['head_sha']=='d8739c581b433154afc5d7519fc78ff9410973b7' and old['path']=='.github/workflows/fc-production-deploy.yml'
          new=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/34763327956']))
          assert new['head_sha']=='f58a085b7a7728447f892711aa8902a07baceecb'
          if old['status']!='completed':
              subprocess.run(['gh','run','cancel',str(old['id']),'--repo',repo],check=True)
          print('旧版本已结束或已请求取消；新修复保持完整校验')
          PY
