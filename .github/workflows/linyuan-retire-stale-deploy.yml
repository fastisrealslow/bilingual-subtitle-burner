name: 取消被新修复替代的旧部署
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-retire-stale-deploy.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 停止封面被长度语法截断的166部署
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          old=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/34769234478']))
          assert old['head_sha']=='12ae5acda3d8c4da668dc0a0580cbdafd25fd96a' and old['path']=='.github/workflows/fc-production-deploy.yml'
          if old['status']!='completed':
              subprocess.run(['gh','run','cancel',str(old['id']),'--repo',repo],check=True)
          print('已停止封面截成残句的部署；保留实际失败证据')
          PY
