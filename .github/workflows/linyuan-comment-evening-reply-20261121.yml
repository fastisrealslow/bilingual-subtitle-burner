name: One-time Lin Yuan comment evening replies 2026-11-21
on:
  push:
    branches: ['dot/comments-read-probe-20261115']
    paths: ['.github/workflows/linyuan-comment-evening-reply-20261121.yml']
permissions:
  contents: read
concurrency:
  group: linyuan-comment-history-reply
  cancel-in-progress: false
jobs:
  reply:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Send reviewed neutral replies and verify
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time
          from datetime import datetime, timezone
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlencode

          # Only the two reviewed roots below; never read or print secret values outside this process.
          OWNER = "275211725"
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = build_opener(NoRedirect())
          def emit(kind, **data):
              # JSON escaping prevents comment text from becoming workflow commands.
              print(json.dumps(dict(kind=kind, **data), ensure_ascii=True))
          try:
              raw = os.environ.pop("BILIBILI_COOKIES", "")
              if not raw:
                  emit("blocked", reason="existing_ci_secret_unavailable")
                  sys.exit(1)
              payload = json.loads(raw)
              entries = (payload.get("cookie_info") or {}).get("cookies") or payload.get("cookies") or []
              cookies = {str(c["name"]): str(c["value"]) for c in entries}
              if cookies.get("DedeUserID") != OWNER or not cookies.get("bili_jct"):
                  emit("blocked", reason="cookie_owner_mismatch_or_missing_csrf")
                  sys.exit(1)
              if any("\r" in x or "\n" in x for pair in cookies.items() for x in pair):
                  raise ValueError("invalid_cookie")
              cookie_header = "; ".join(k+"="+v for k,v in cookies.items())
              def get(path, **params):
                  assert path in ("/x/web-interface/nav", "/x/web-interface/view", "/x/v2/reply", "/x/v2/reply/reply")
                  time.sleep(3)
                  req = Request("https://api.bilibili.com"+path+("?" + urlencode(params) if params else ""),
                      headers={"Cookie":cookie_header,"User-Agent":"Mozilla/5.0",
                               "Referer":"https://www.bilibili.com/"}, method="GET")
                  with opener.open(req, timeout=15) as response:
                      result = json.load(response)
                  if result.get("code") != 0:
                      emit("api_error", endpoint=path, code=result.get("code"))
                      return None
                  return result.get("data") or {}
              if datetime.now(timezone.utc) > datetime(2026, 11, 21, 15, 30, tzinfo=timezone.utc):
                  raise ValueError("batch_expired")
              nav = get("/x/web-interface/nav")
              if not nav or not nav.get("isLogin") or str(nav.get("mid")) != OWNER:
                  emit("blocked", reason="authenticated_owner_not_verified")
                  sys.exit(1)
              emit("account_verified", owner=OWNER)
              if os.environ.get("GITHUB_RUN_ATTEMPT") != "1" or os.environ.get("GITHUB_RUN_NUMBER") != "1":
                  raise ValueError("one_time_execution_guard")
              targets = [["BV154ytzeEaK",117651972033463,"320864986305","后期配音吗","你指的是哪一句听起来像后期配音？可以留个时间点。"],["BV1t9sJ6NEcL",117619726288294,"324707654352","还是好人多","他从四十岁这个节点讲自己怎么想杠杆，这段还挺有意思。"]]
              def required(data):
                  if data is None:
                      raise ValueError("read_failed")
                  return data
              def find_root(aid, root):
                  for pn in range(1,11):
                      data = required(get("/x/v2/reply", type=1, oid=aid, pn=pn, ps=20, sort=0))
                      rows = data.get("replies") or []
                      wanted = next((r for r in rows if str(r.get("rpid")) == root), None)
                      if wanted is not None or len(rows) < 20:
                          return wanted
                  return None
              def children(aid, root):
                  t = required(get("/x/v2/reply/reply", type=1, oid=aid, root=root, pn=1, ps=20))
                  return t.get("replies") or [], (t.get("page") or {}).get("count")
              sent = 0
              for bvid, aid, root, expected, message in targets:
                  v = required(get("/x/web-interface/view", bvid=bvid))
                  if str((v.get("owner") or {}).get("mid")) != OWNER or v.get("aid") != aid:
                      emit("skipped", root=root, reason="video_mismatch")
                      continue
                  row = find_root(aid, root)
                  if not row or str(row.get("mid")) == OWNER or re.sub(r"\[笑哭\]$", "", (row.get("content") or {}).get("message","")).strip() != expected:
                      emit("skipped", root=root, reason="root_mismatch")
                      continue
                  n = int(row.get("rcount") or 0)
                  if n or row.get("replies"):
                      kids, total = children(aid, root)
                      if not isinstance(total,int) or len(kids) < max(total,n) or any(str(k.get("mid")) == OWNER for k in kids):
                          emit("skipped", root=root, reason="already_replied_or_incomplete")
                          continue
                  form = urlencode(dict(type=1, oid=aid, root=root, parent=root, message=message, csrf=cookies["bili_jct"])).encode()
                  req = Request("https://api.bilibili.com/x/v2/reply/add", data=form, headers={
                      "Cookie":cookie_header,"User-Agent":"Mozilla/5.0","Referer":"https://www.bilibili.com/video/"+bvid,
                      "Content-Type":"application/x-www-form-urlencoded"}, method="POST")
                  time.sleep(7)
                  emit("submission_started", bvid=bvid, root=root)
                  with opener.open(req, timeout=20) as response:
                      result = json.load(response)
                  if result.get("code") != 0:
                      emit("submission_not_confirmed", root=root, code=result.get("code"))
                      sys.exit(1)
                  info = result.get("data") or {}
                  rid = str(info.get("rpid") or (info.get("reply") or {}).get("rpid") or "")
                  if not rid.isdigit():
                      raise ValueError("missing_reply_id")
                  emit("accepted", root=root, reply_id=rid)
                  for _ in range(3):
                      kids, _total = children(aid, root)
                      if any(str(k.get("rpid")) == rid and str(k.get("mid")) == OWNER and (k.get("content") or {}).get("message") == message for k in kids):
                          sent += 1
                          emit("verified_visible", root=root, bvid=bvid, reply_id=rid)
                          break
                  else:
                      emit("verification_pending", root=root, reply_id=rid)
                      sys.exit(1)
              emit("complete", verified=sent)
          except Exception as exc:
              emit("stopped", reason=type(exc).__name__, http_status=getattr(exc,"code",None))
              sys.exit(1)
          PY
