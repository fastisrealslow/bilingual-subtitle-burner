name: 林园平台合集与参考覆盖核验
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-platform-collections.yml
      - linyuan/platform_collections.py
      - linyuan/reference_audit.py
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linyuan-platform-collections
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest requests
      - name: 合集与声明分类离线安全回归
        run: python -m pytest -q tests/test_linyuan_platform_collections.py tests/test_linyuan_reference_audit.py
      - name: 最新三十条与来源覆盖审计（不把参考片当库存）
        continue-on-error: true
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python -u linyuan/reference_audit.py --output /tmp/linyuan-reference-audit.json
      - name: 实际创建并同步自有已发布同场合集（每轮最多新建一个）
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python -u linyuan/platform_collections.py --apply --output /tmp/linyuan-collection-sync.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linyuan-collection-reference-evidence-${{ github.run_id }}
          path: |
            /tmp/linyuan-reference-audit.json
            /tmp/linyuan-collection-sync.json
          retention-days: 30
          if-no-files-found: warn
