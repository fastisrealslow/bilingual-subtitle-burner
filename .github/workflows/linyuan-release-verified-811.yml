name: 核验上线后补发811两条成片
on:
  workflow_run:
    workflows: ['FC production deploy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: release-verified-811
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.id == 34769815061 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      VERIFIED_DEPLOY_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '34769815061' }}

      SLUG: ly-0912-5dc339-stable-clean-proof-portrait
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 等待指定修复通过真实CPU核验并上线
        id: gate
        run: |
          python - <<'PY'
          import os,json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['VERIFIED_DEPLOY_RUN']]))
          expected={'34769815061':'81bf9f19bbd12c61cc67e989c5a2f5bf02195fb1'}
          assert run['head_sha']==expected[os.environ['VERIFIED_DEPLOY_RUN']]
          ready=run['conclusion']=='success'
          assert ready,'指定部署没有成功完成，未投稿；不能将等待状态报告为发布成功'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(ready).lower()+'\n')
          print('指定修复已上线，继续核验实际成片' if ready else '指定修复尚未成功上线，保持待审，不投稿')
          PY
      - name: 验证部署证明与两条实际文件
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          gh run download "$VERIFIED_DEPLOY_RUN" --repo "$GITHUB_REPOSITORY" --name production-verification --dir /tmp/deploy-proof
          gh release download "deliver-$SLUG" --repo "$GITHUB_REPOSITORY" --pattern "$SLUG.*" --dir /tmp/811
          python -m pip install -q requests numpy 'opencv-python-headless<5' alibabacloud-fc20230330 alibabacloud-tea-openapi
          python - <<'PY'
          import sys,os,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'linyuan')
          from source_supply import validate_part
          from reuse_title_verification import validate_guest_fixture
          from repair_811_copy import repair
          proof=json.loads(Path('/tmp/deploy-proof/production-verification.json').read_text())
          assert proof['verification_complete'] is True
          assert proof['health']['code_sha256']==hashlib.sha256(Path('linyuan/fc/index.py').read_bytes()).hexdigest()
          assert proof['health']['daily_limit']==4 and proof['health']['publish_hours_beijing']==[10,14,16,21]
          directory=Path('/tmp/811');prefix=os.environ['SLUG']+'.'
          for path in directory.iterdir():
              assert path.name.startswith(prefix)
              path.rename(path.with_name(path.name[len(prefix):]))
          repair(directory)
          expected={'final_2.mp4':'eb149d3134302c0a37c5c2e7df86a38fe294421099227e1d6af3da5d8dd0fc15',
                    'final_4.mp4':'b49fb3a54a1f6f0b0fb4a2c4723491e1cf9a479ca33e8eaf54cf78ef35eb9052'}
          metas=json.loads((directory/'meta.json').read_text())
          assert {m['final'] for m in metas}==set(expected)
          results=[]
          for meta in metas:
              assert meta['source_sha256']=='e6e7afee52ec9f7cb8ba390c312a1071489aab445130d64a7e123b4d5b413f47'
              assert meta['fingerprints']['sha256']==expected[meta['final']]
              if meta['final']=='final_4.mp4':
                  validate_guest_fixture(dict(fixture='linyuan_0913_landscape_title.json',**meta))
              issue=validate_part(meta,directory)
              assert not issue,issue
              results.append(dict(final=meta['final'],sha256=expected[meta['final']],validated=True))
          Path('811-release-proof.json').write_text(json.dumps(dict(deploy_run=os.environ['VERIFIED_DEPLOY_RUN'],files=results),indent=2))
          print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        id: fixed_delivery
        with:
          name: deliver-ly-0912-5dc339-stable-clean-proof-portrait
          path: /tmp/811
          if-no-files-found: error
          retention-days: 14
      - name: 仅解除这两条已核验成片的临时待审
        if: steps.gate.outputs.ready == 'true'
        env:
          VERIFIED_ARTIFACT_ID: ${{ steps.fixed_delivery.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import sys,os,json,base64,time,subprocess
          sys.path.insert(0,'linyuan')
          from register_selection_recovery import read_state,gh,REPO,PATH
          from fc import index as fc
          slug=os.environ['SLUG']
          def release():
              for attempt in range(6):
                  doc,st=read_state()
                  entries=[e for e in st['dispatched'] if e.get('slug')==slug]
                  assert entries and all(e['source_url']=='https://www.bilibili.com/video/BV1hj411X7BL' for e in entries)
                  for entry in entries:
                      if entry.get('failed'):
                          assert entry.get('review_hold') and entry.get('failure_stage')=='release-verification'
                      for key in ('failed','review_hold','failure_stage','last_error'):entry.pop(key,None)
                      entry['release_verification']=dict(deploy_run=os.environ['VERIFIED_DEPLOY_RUN'],verified_at=int(time.time()),proof_run=os.environ['GITHUB_RUN_ID'],artifact_id=int(os.environ['VERIFIED_ARTIFACT_ID']))
                  body=dict(message='ops: release only the two SHA-verified clean 811 clips after production verification',sha=doc['sha'],branch='main',content=base64.b64encode(json.dumps(st,ensure_ascii=False,separators=(',',':')).encode()).decode())
                  try:
                      gh('api','--method','PUT',f'repos/{REPO}/contents/{PATH}','--input','-',body=body)
                      return dict(released=slug,daily=st.get('daily_publish'))
                  except subprocess.CalledProcessError:
                      if attempt==5:raise
                      time.sleep(2)
          for attempt in range(10):
              result=fc.run_with_lease('dispatch',release)
              if result.get('released'):break
              time.sleep(10)
          assert result.get('released'),result
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: 补发已验收成片并核对实际日期与平台回执
        if: steps.gate.outputs.ready == 'true'
        env:
          VERIFIED_ARTIFACT_ID: ${{ steps.fixed_delivery.outputs.artifact-id }}
        run: |
          python -u - <<'PY'
          import sys,os,json,subprocess,time
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          sys.path.insert(0,'linyuan')
          sys.path.insert(0,'linyuan/fc')
          from register_selection_recovery import read_state
          from catchup_from_inventory import tracked_request
          from publish_fresh_six import prepare_async_tasks
          import index as fc
          from bili_archive_status import archive_status
          slug=os.environ['SLUG'];repo=os.environ['GITHUB_REPOSITORY']
          metas=json.loads(Path('/tmp/811/meta.json').read_text())
          def found(st):
              return {p.get('fingerprints',{}).get('sha256'):p for p in st.get('published',{}).get(slug,{}).get('parts',[])
                      if p.get('status')=='published' and p.get('bvid')}
          today=datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d')
          _,initial=read_state()
          if today=='2026-09-13':
              for attempt in range(2):
                  _,st=read_state()
                  if len(found(st))==2:break
                  if attempt:
                      subprocess.run([sys.executable,'linyuan/fc/catchup_from_inventory.py'],check=True,timeout=700)
                      continue
                  started=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
                  subprocess.run(['gh','workflow','run','linyuan-source-inventory.yml','--repo',repo,'--ref','main'],check=True)
                  run_id=None
                  for _ in range(12):
                      rows=json.loads(subprocess.check_output(['gh','run','list','--repo',repo,'--workflow','linyuan-source-inventory.yml','--event','workflow_dispatch','--branch','main','--limit','8','--json','databaseId,createdAt']))
                      candidates=[r for r in rows if r['createdAt']>=started]
                      if candidates:run_id=min(candidates,key=lambda r:r['databaseId'])['databaseId'];break
                      time.sleep(5)
                  assert run_id,'Inventory dispatch unresolved; do not duplicate'
                  subprocess.run(['gh','run','watch',str(run_id),'--repo',repo,'--exit-status','--interval','20'],check=True,timeout=1000)
          else:
              # An overdue upload after midnight belongs to its actual publication day.
              # Keep the normal daily cap and all media/dedup gates; do not backdate state.
              assert today>'2026-09-13'
              from alibabacloud_fc20230330.client import Client
              from alibabacloud_fc20230330 import models as m
              from alibabacloud_tea_openapi import models as api
              from alibabacloud_tea_util import models as util
              client=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],access_key_secret=os.environ['ALIYUN_SK'],
                  endpoint='fcv3.'+os.environ['FC_REGION']+'.aliyuncs.com'))
              function=os.environ['FC_FUNCTION_NAME']
              runtime=util.RuntimeOptions(connect_timeout=10000,read_timeout=60000,autoretry=False)
              prepare_async_tasks(client,function,m,runtime)
              tasks=[]
              for meta in metas:
                  sha=meta['fingerprints']['sha256']
                  _,before=read_state()
                  if sha in found(before):continue
                  assert not any(e.get('uploading') for e in before['dispatched']),'Existing upload unresolved'
                  task_id='ly-811-0913-'+sha[:20]+'-a1'
                  request=dict(triggerName='publish-batch',batch_slug=slug,artifact_id=int(os.environ['VERIFIED_ARTIFACT_ID']),
                      expected_sha256=sha,batch_remaining=1,title=meta['title'],
                      source_url='https://www.bilibili.com/video/BV1hj411X7BL')
                  tasks.append(dict(task_id=task_id,sha256=sha,status='Reconciling'))
                  Path('catchup-receipt.json').write_text(json.dumps(dict(tasks=tasks),ensure_ascii=False,indent=2))
                  task=tracked_request(client,function,m,runtime,'publish-batch',task_id,payload=request,wait_seconds=600)
                  tasks[-1].update(status=task.status if task else 'Unknown',return_payload=task.return_payload if task else None)
                  Path('catchup-receipt.json').write_text(json.dumps(dict(tasks=tasks),ensure_ascii=False,indent=2))
                  print(json.dumps(tasks[-1],ensure_ascii=False),flush=True)
                  assert task and task.status=='Succeeded','Keep stable task ID; reconcile before another upload'
                  _,after=read_state()
                  assert sha in found(after),'No exact publication receipt; do not replay the upload'
          _,st=read_state();receipts=found(st)
          expected={m['fingerprints']['sha256'] for m in metas}
          assert expected<=set(receipts),'Two exact clean-file publication receipts are still missing'
          day_bvs={}
          for info in st.get('published',{}).values():
              for part in info.get('parts') or [info]:
                  if part.get('bvid') and part.get('status')!='skipped' and part.get('ts'):
                      day=datetime.fromtimestamp(part['ts'],timezone(timedelta(hours=8))).strftime('%Y-%m-%d')
                      day_bvs.setdefault(day,set()).add(part['bvid'])
          report=dict(missed_schedule=['2026-09-13 16','2026-09-13 21'],
              receipts=[receipts[sha] for sha in sorted(expected)],
              actual_daily_counts={d:len(bvs) for d,bvs in day_bvs.items() if d>='2026-09-13'},
              daily_publish=st.get('daily_publish'))
          Path('811-publication-receipts.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False),flush=True)
          report['creator_verification']=archive_status([receipts[sha]['bvid'] for sha in sorted(expected)],fc.OWNER_MID,os.environ['BILIBILI_COOKIES'])
          Path('811-publication-receipts.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          assert all(v['public'] for v in report['creator_verification']['videos']),'Bilibili review is pending; preserve receipts and check status without reposting'
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: verified-811-release
          path: |
            811-release-proof.json
            catchup-receipt.json
            811-publication-receipts.json
          if-no-files-found: warn
