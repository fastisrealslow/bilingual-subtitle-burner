name: 林园 GitHub 调度与 FC 节费切换

on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-dispatch-runner.yml
      - linyuan/fc/dispatch_on_runner.py
      - tests/test_linyuan_runner_dispatch.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: linyuan-dispatch-runner
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装调度与验证依赖
        run: pip install -q pytest requests jieba 'opencv-python-headless<5' alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 核对供片、锁、恢复与投稿保护
        run: >-
          python -m pytest -q tests/test_linyuan_runner_dispatch.py
          tests/test_linyuan_dispatch_retry.py
          tests/test_linyuan_reserve_integrity.py tests/test_linyuan_state_merge.py
          tests/test_linyuan_preflight_recovery.py tests/test_linyuan_makeup_slot.py
          tests/test_linyuan_missed_slots.py tests/test_linyuan_config_health.py
          tests/test_linyuan_receipt_recovery.py
      - name: 在 GitHub 接管调度，成功后关闭 FC 小时空跑
        run: python -u linyuan/fc/dispatch_on_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-dispatch-receipt
          path: |
            github-dispatch-receipt.json
            catchup-receipt.json
          if-no-files-found: warn
          retention-days: 14
