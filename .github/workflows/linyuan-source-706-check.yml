name: 林园706取源回归与实测
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-source-706-check.yml
      - linyuan/ci_fetch_generic.py
      - linyuan/ci_fetch_bilibili.py
      - tests/test_linyuan_generic_fetch.py
      - tests/test_linyuan_fetch_budget.py
      - tests/test_linyuan_hd_download.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装下载器测试依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pytest yt-dlp
      - name: 真实格式选择、JPEG轨道与下载恢复回归
        run: python -m pytest -q tests/test_linyuan_generic_fetch.py tests/test_linyuan_fetch_budget.py tests/test_linyuan_hd_download.py
      - name: 核对706当前可下载媒体（不出片、不投稿）
        id: probe
        continue-on-error: true
        timeout-minutes: 6
        run: >-
          python -u linyuan/ci_fetch_generic.py
          --url https://m.weibo.cn/detail/5341555042815645
          --directory /tmp/source-706
          --failure-report /tmp/source-706-report.json
          --github-output "$GITHUB_OUTPUT"
      - name: 输出实际取源结论
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('/tmp/source-706-report.json')
          if not path.exists():
              path.write_text(json.dumps(dict(media_validated=os.environ['PROBE_OUTCOME']=='success',
                  probe_outcome=os.environ['PROBE_OUTCOME']),ensure_ascii=False,indent=2))
          print(path.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-706-check
          path: /tmp/source-706-report.json
