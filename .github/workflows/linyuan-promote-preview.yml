name: 自动样片发布前文件核验（不调用FC）
on:
  push:
    branches: [codex/automatic-preview]
    paths: [.github/linyuan-preview-promotion.json]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装实际媒体检查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q pytest requests pillow jieba numpy "opencv-python-headless<5"
      - name: 文件绑定与自动验收门禁回归
        run: python -m pytest -q tests/test_linyuan_preview_promotion.py
      - name: 核验完整原文件（不改文案、不重编码）
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/promote_linyuan_preview.py --request .github/linyuan-preview-promotion.json --output /tmp/verified-preview
      - uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ steps.verified.outputs.slug }}
          path: /tmp/verified-preview/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-promotion-receipt
          path: preview-promotion-receipt.json
          if-no-files-found: warn
