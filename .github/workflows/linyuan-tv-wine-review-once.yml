name: 电视机与酒单条重制
# Shot-aware revision 5: clean archive labels; read-only artifact delivery.
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-tv-wine-review-once.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: tv-wine-review-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ZH_FONT: Noto Sans CJK SC
      EN_FONT: DejaVu Sans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 准备精确原片与已校验字幕
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk libchromaprint-tools
          pip install yt-dlp pillow 'opencv-python<5' rapidocr-onnxruntime jieba
          gh run download 33951966452 --repo "$GITHUB_REPOSITORY" --name debug-ly-v11-review-0905 --dir "$RUNNER_TEMP/debug"
          mkdir -p "$RUNNER_TEMP/source"
          yt-dlp --continue --socket-timeout 120 --retries 10 --fragment-retries 10 --concurrent-fragments 4 -f 'bv*[height<=1080]+ba/b[height<=1080]/b' --merge-output-format mp4 -o "$RUNNER_TEMP/source/video.%(ext)s" 'https://m.weibo.cn/detail/5335082961471123'
      - name: 只重做指定238秒并复检120帧
        run: |
          python linyuan/rebuild_tv_wine_review.py --source "$RUNNER_TEMP/source/video.mp4" --debug "$RUNNER_TEMP/debug" --out "$RUNNER_TEMP/review"
      - name: 保存单条实际成片与检查图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-wine-review
          path: ${{ runner.temp }}/review/
          if-no-files-found: ignore
