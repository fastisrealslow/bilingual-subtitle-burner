name: 一键出片

# 触发方式：
#   1) workflow_dispatch：填一条 URL，立刻出一条成片
#   2) push sources/*.json：每个 json 一条任务，用 matrix 并发出片
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "视频 URL 或本地路径（yt-dlp 支持的平台 / archive.org）"
        required: true
        type: string
      slug:
        description: "产物目录名（deliver/<slug>/）"
        required: true
        type: string
      title_override:
        description: "标题（留空则让模型起，15 字以内）"
        required: false
        default: ""
        type: string
      translator:
        description: "翻译模型"
        required: false
        default: "deepseek-v3"
        type: choice
        options: ["deepseek-v3", "claude-sonnet-4.6"]
      dual:
        description: "两个翻译都跑并出对比拼图"
        required: false
        default: false
        type: boolean
      cover_time_sec:
        description: "手动指定封面帧时间点（秒），留空则自动选帧。用于全片没有主讲人正脸的解说式剪辑。多集时用逗号分隔，一集一个按顺序对应（如 287,412），个数须等于集数"
        required: false
        default: ""
        type: string
      cover_crop:
        description: "封面裁切 W:H:X:Y（同 ffmpeg crop 滤镜），留空不裁。用于切掉源片底部烧死的英文硬字幕，如 854:396:0:0"
        required: false
        default: ""
        type: string
      speaker:
        description: "说话人名字，用于金句打分和封面左上角红标。留空用 produce.py 的默认值"
        required: false
        default: ""
        type: string
      sub_mode:
        description: "烧字幕语种：both 中英双语；zh-only 只烧中文（源片自带英文硬字幕时用，避免叠字）"
        required: false
        default: "both"
        type: choice
        options: ["both", "zh-only"]
      sub_margin_v:
        description: "zh-only 时中文怎么坐在源片硬字幕带上方：auto 逐条 cue 探测该时段硬字幕带的上沿各自避让（源片大字号引言板位置更高，固定值躲不开）；也可填整数把全片钉死在该像素。留空用 produce.py 默认 auto"
        required: false
        default: ""
        type: string
      sub_avoid_gap:
        description: "sub_margin_v=auto 时，中文块底边与源片硬字幕带上沿之间留的像素间隙。留空用默认 24"
        required: false
        default: ""
        type: string
      episodes:
        description: "一次出几集。下载和转写只做一次，highlight 挑 N 组互不重叠的片段。源撑不起这个集数就整批退 2，不会少出几集。留空用默认 1"
        required: false
        default: ""
        type: string

  push:
    paths:
      - "sources/*.json"

# 发 Release、把站点索引提交回仓库都要写权限
permissions:
  contents: write

jobs:
  # 把两种触发方式收敛成同一份 matrix，产出环节只写一遍
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: 汇总出片任务
        env:
          EVENT: ${{ github.event_name }}
          IN_SOURCE: ${{ inputs.source_url }}
          IN_SLUG: ${{ inputs.slug }}
          IN_TITLE: ${{ inputs.title_override }}
          IN_TRANSLATOR: ${{ inputs.translator }}
          IN_DUAL: ${{ inputs.dual }}
          IN_COVER_TIME_SEC: ${{ inputs.cover_time_sec }}
          IN_COVER_CROP: ${{ inputs.cover_crop }}
          IN_SPEAKER: ${{ inputs.speaker }}
          IN_SUB_MODE: ${{ inputs.sub_mode }}
          IN_SUB_MARGIN_V: ${{ inputs.sub_margin_v }}
          IN_SUB_AVOID_GAP: ${{ inputs.sub_avoid_gap }}
          IN_EPISODES: ${{ inputs.episodes }}
        run: python3 .github/scripts/plan_matrix.py

  produce:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # secrets 上下文用不了在 step 的 if 里，这里先落成 'true' / 'false'。
      # BILIBILI_COOKIES 目前不存在 → 恒为 'false' → 投稿那步永远跳过。
      BILIBILI_ENABLED: ${{ secrets.BILIBILI_COOKIES != '' }}
    strategy:
      fail-fast: false      # 一条片源挂掉不该带走其他几条
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # 站点索引那步要 rebase 到 main 再推，浅克隆 rebase 不了
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # fonts-noto-cjk 必装：缺了 CJK 字体，字幕和封面标题会烧成一排豆腐块
      - name: 安装 ffmpeg 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          fc-cache -f

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 yt-dlp
        run: |
          pip install --upgrade yt-dlp
          yt-dlp --version

      # 同一条素材失败重跑时，前面已经付过钱的 LLM/VLM 调用直接命中缓存。
      # key 带 run_id 保证每次都会回写，restore-keys 逐级回退到同 slug 的上一次。
      - name: 复用 LLM 响应缓存
        uses: actions/cache@v4
        with:
          path: .llm_cache
          key: llm-cache-${{ matrix.job.slug }}-${{ github.run_id }}
          restore-keys: |
            llm-cache-${{ matrix.job.slug }}-
            llm-cache-

      - name: 出片
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SOURCE: ${{ matrix.job.source }}
          SLUG: ${{ matrix.job.slug }}
          TITLE_OVERRIDE: ${{ matrix.job.title_override }}
          TRANSLATOR: ${{ matrix.job.translator }}
          DUAL: ${{ matrix.job.dual }}
          COVER_TIME_SEC: ${{ matrix.job.cover_time_sec }}
          COVER_CROP: ${{ matrix.job.cover_crop }}
          SPEAKER: ${{ matrix.job.speaker }}
          SUB_MODE: ${{ matrix.job.sub_mode }}
          SUB_MARGIN_V: ${{ matrix.job.sub_margin_v }}
          SUB_AVOID_GAP: ${{ matrix.job.sub_avoid_gap }}
          EPISODES: ${{ matrix.job.episodes }}
        run: |
          set -euo pipefail
          args=(--source "$SOURCE" --slug "$SLUG" --translator "$TRANSLATOR")
          [ -n "$TITLE_OVERRIDE" ] && args+=(--title-override "$TITLE_OVERRIDE")
          [ "$DUAL" = "true" ] && args+=(--dual)
          [ -n "$COVER_TIME_SEC" ] && args+=(--cover-time-sec "$COVER_TIME_SEC")
          [ -n "$COVER_CROP" ] && args+=(--cover-crop "$COVER_CROP")
          [ -n "$SPEAKER" ] && args+=(--speaker "$SPEAKER")
          [ -n "$SUB_MODE" ] && args+=(--sub-mode "$SUB_MODE")
          [ -n "$SUB_MARGIN_V" ] && args+=(--sub-margin-v "$SUB_MARGIN_V")
          [ -n "$SUB_AVOID_GAP" ] && args+=(--sub-avoid-gap "$SUB_AVOID_GAP")
          [ -n "$EPISODES" ] && args+=(--episodes "$EPISODES")
          python produce.py "${args[@]}"

      - name: 上传成片
        uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ matrix.job.slug }}
          path: deliver/${{ matrix.job.slug }}/
          retention-days: 90
          if-no-files-found: error

      # 失败时把中间产物带出来：转写、金句、译文都在 _tmp/ 里，
      # 没有它们就只能靠日志猜是哪一步不达标
      - name: 失败时上传中间产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.job.slug }}
          path: _tmp/
          retention-days: 14
          if-no-files-found: ignore

      # ── 发布：Release 直链是手机页唯一的下载来源 ──────────────────────────
      # artifact 要登录才能下，手机上没法用；Release 资产公开仓库免登录、
      # 原样 mp4、不打 zip。
      - name: 准备 Release 资产
        env:
          SLUG: ${{ matrix.job.slug }}
        run: |
          set -euo pipefail
          python scripts/release_assets.py \
            --queue "deliver/$SLUG/queue.json" \
            --out _release --notes _release_notes.md

      - name: 发布 Release（同名 asset 覆盖）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ matrix.job.slug }}
        run: |
          set -euo pipefail
          TAG="clips-$SLUG"
          # 重跑时 tag 已经在了：改正文而不是重建，再 --clobber 覆盖同名 asset
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file _release_notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file _release_notes.md
          fi
          gh release upload "$TAG" _release/* --clobber

      # 手机页读的是仓库里的静态 index.json，不打 GitHub API（未登录
      # 60 次/小时/IP 会被限流）
      #
      # 合并的同时会把超出保留窗口的旧批次整批下架 —— 同一段素材换个 slug 重跑
      # 时，页面上不会同时挂着两批重复内容。见 spec/publish_chain.md。
      - name: 合并进站点索引并提交
        if: github.ref == 'refs/heads/main'
        env:
          SLUG: ${{ matrix.job.slug }}
        run: |
          set -euo pipefail
          python scripts/update_site_index.py \
            --queue "deliver/$SLUG/queue.json" \
            --index site/data/index.json
          if git diff --quiet -- site/data/index.json; then
            echo "索引没有变化，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json
          git commit -m "chore(site): 更新 $SLUG 的发布索引"
          # matrix 里几条 job 会同时往 main 上推，撞车就 rebase 重试
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "推送失败（第 $i 次），重试"
            sleep $((i * 5))
          done
          exit 1

      # 下架只把条目从 index.json 里摘掉，Release 还在占空间。这里只报账不动手：
      # 删 Release 不可逆，要真删就在本地跑同一条命令加 --execute。
      - name: 列出可清理的陈旧 Release（dry-run）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin main
          python scripts/prune_releases.py --index site/data/index.json

      # B 站投稿：预留接口，默认关闭。BILIBILI_COOKIES 这个 secret 目前不存在，
      # 所以这一步永远跳过 —— 用户的决定是先手动投稿。
      # （secrets 上下文不能直接写在 step 的 if 里，先在 job 级 env 落成字符串）
      - name: 投稿 B 站（默认关闭）
        if: env.BILIBILI_ENABLED == 'true'
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
          SLUG: ${{ matrix.job.slug }}
        run: |
          set -euo pipefail
          pip install biliup
          python - <<'PY' > /tmp/episodes.txt
          import json, os
          q = json.load(open(f"deliver/{os.environ['SLUG']}/queue.json", encoding="utf-8"))
          print("\n".join(ep["id"] for ep in q["episodes"]))
          PY
          while read -r ep; do
            [ -n "$ep" ] || continue
            python scripts/publish_bilibili.py \
              --queue "deliver/$SLUG/queue.json" --episode "$ep"
          done < /tmp/episodes.txt
