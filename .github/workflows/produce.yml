name: 一键出片

# 触发方式：
#   1) workflow_dispatch：填一条 URL，立刻出一条成片
#   2) push sources/*.json：每个 json 一条任务，用 matrix 并发出片
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "视频 URL 或本地路径（yt-dlp 支持的平台 / archive.org）"
        required: true
        type: string
      slug:
        description: "产物目录名（deliver/<slug>/）"
        required: true
        type: string
      title_override:
        description: "标题（留空则让模型起，15 字以内）"
        required: false
        default: ""
        type: string
      translator:
        description: "翻译模型"
        required: false
        default: "deepseek-v3"
        type: choice
        options: ["deepseek-v3", "claude-sonnet-4.6"]
      dual:
        description: "两个翻译都跑并出对比拼图"
        required: false
        default: false
        type: boolean
      cover_time_sec:
        description: "手动指定封面帧时间点（秒），留空则自动选帧。用于全片没有主讲人正脸的解说式剪辑"
        required: false
        default: ""
        type: string
      cover_crop:
        description: "封面裁切 W:H:X:Y（同 ffmpeg crop 滤镜），留空不裁。用于切掉源片底部烧死的英文硬字幕，如 854:396:0:0"
        required: false
        default: ""
        type: string
      speaker:
        description: "说话人名字，用于金句打分和封面左上角红标。留空用 produce.py 的默认值"
        required: false
        default: ""
        type: string
      sub_mode:
        description: "烧字幕语种：both 中英双语；zh-only 只烧中文（源片自带英文硬字幕时用，避免叠字）"
        required: false
        default: "both"
        type: choice
        options: ["both", "zh-only"]
      sub_margin_v:
        description: "zh-only 时中文怎么坐在源片硬字幕带上方：auto 逐条 cue 探测该时段硬字幕带的上沿各自避让（源片大字号引言板位置更高，固定值躲不开）；也可填整数把全片钉死在该像素。留空用 produce.py 默认 auto"
        required: false
        default: ""
        type: string
      sub_avoid_gap:
        description: "sub_margin_v=auto 时，中文块底边与源片硬字幕带上沿之间留的像素间隙。留空用默认 24"
        required: false
        default: ""
        type: string

  push:
    paths:
      - "sources/*.json"

permissions:
  contents: read

jobs:
  # 把两种触发方式收敛成同一份 matrix，产出环节只写一遍
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: 汇总出片任务
        env:
          EVENT: ${{ github.event_name }}
          IN_SOURCE: ${{ inputs.source_url }}
          IN_SLUG: ${{ inputs.slug }}
          IN_TITLE: ${{ inputs.title_override }}
          IN_TRANSLATOR: ${{ inputs.translator }}
          IN_DUAL: ${{ inputs.dual }}
          IN_COVER_TIME_SEC: ${{ inputs.cover_time_sec }}
          IN_COVER_CROP: ${{ inputs.cover_crop }}
          IN_SPEAKER: ${{ inputs.speaker }}
          IN_SUB_MODE: ${{ inputs.sub_mode }}
          IN_SUB_MARGIN_V: ${{ inputs.sub_margin_v }}
          IN_SUB_AVOID_GAP: ${{ inputs.sub_avoid_gap }}
        run: python3 .github/scripts/plan_matrix.py

  produce:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false      # 一条片源挂掉不该带走其他几条
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # fonts-noto-cjk 必装：缺了 CJK 字体，字幕和封面标题会烧成一排豆腐块
      - name: 安装 ffmpeg 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          fc-cache -f

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 yt-dlp
        run: |
          pip install --upgrade yt-dlp
          yt-dlp --version

      # 同一条素材失败重跑时，前面已经付过钱的 LLM/VLM 调用直接命中缓存。
      # key 带 run_id 保证每次都会回写，restore-keys 逐级回退到同 slug 的上一次。
      - name: 复用 LLM 响应缓存
        uses: actions/cache@v4
        with:
          path: .llm_cache
          key: llm-cache-${{ matrix.job.slug }}-${{ github.run_id }}
          restore-keys: |
            llm-cache-${{ matrix.job.slug }}-
            llm-cache-

      - name: 出片
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SOURCE: ${{ matrix.job.source }}
          SLUG: ${{ matrix.job.slug }}
          TITLE_OVERRIDE: ${{ matrix.job.title_override }}
          TRANSLATOR: ${{ matrix.job.translator }}
          DUAL: ${{ matrix.job.dual }}
          COVER_TIME_SEC: ${{ matrix.job.cover_time_sec }}
          COVER_CROP: ${{ matrix.job.cover_crop }}
          SPEAKER: ${{ matrix.job.speaker }}
          SUB_MODE: ${{ matrix.job.sub_mode }}
          SUB_MARGIN_V: ${{ matrix.job.sub_margin_v }}
          SUB_AVOID_GAP: ${{ matrix.job.sub_avoid_gap }}
        run: |
          set -euo pipefail
          args=(--source "$SOURCE" --slug "$SLUG" --translator "$TRANSLATOR")
          [ -n "$TITLE_OVERRIDE" ] && args+=(--title-override "$TITLE_OVERRIDE")
          [ "$DUAL" = "true" ] && args+=(--dual)
          [ -n "$COVER_TIME_SEC" ] && args+=(--cover-time-sec "$COVER_TIME_SEC")
          [ -n "$COVER_CROP" ] && args+=(--cover-crop "$COVER_CROP")
          [ -n "$SPEAKER" ] && args+=(--speaker "$SPEAKER")
          [ -n "$SUB_MODE" ] && args+=(--sub-mode "$SUB_MODE")
          [ -n "$SUB_MARGIN_V" ] && args+=(--sub-margin-v "$SUB_MARGIN_V")
          [ -n "$SUB_AVOID_GAP" ] && args+=(--sub-avoid-gap "$SUB_AVOID_GAP")
          python produce.py "${args[@]}"

      - name: 上传成片
        uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ matrix.job.slug }}
          path: deliver/${{ matrix.job.slug }}/
          retention-days: 90
          if-no-files-found: error

      # 失败时把中间产物带出来：转写、金句、译文都在 _tmp/ 里，
      # 没有它们就只能靠日志猜是哪一步不达标
      - name: 失败时上传中间产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.job.slug }}
          path: _tmp/
          retention-days: 14
          if-no-files-found: ignore
