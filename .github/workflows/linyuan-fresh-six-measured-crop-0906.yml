name: 林园新六条实测取景补位
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-fresh-six-measured-crop-0906.yml]
permissions:
  actions: write
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run linyuan-produce-cn.yml --repo "$GITHUB_REPOSITORY" --ref production/fresh-six-0906 \
            -f source=https://www.bilibili.com/video/BV1ADetzQEuE \
            -f slug=ly-fresh-six-0906-05 -f speaker=林园 \
            -f occasion=2025年8月21日专访 -f source_platform=bilibili \
            -f delay_hours=0 -F auto_publish=false -f target_parts=0 \
            -F include_full=false -F prefer_live_video=true
