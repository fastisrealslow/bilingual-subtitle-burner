name: 取源可行性测试

# 一次性诊断用：验证 GitHub runner 能不能下载各类素材源（微博直链/微博页面/B站）。
# 只测下载，不出片不投稿，跑完即弃。
on:
  workflow_dispatch:
    inputs:
      url:
        description: '待测 URL'
        required: true
        type: string
      referer:
        description: 'Referer 头（微博需要 https://weibo.com/）'
        required: false
        default: ''
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 环境
        run: |
          echo "出口 IP / 地区："
          curl -s --max-time 20 https://ipinfo.io/json || echo "(ipinfo 不可达)"
      - name: 方式A - curl 直连
        continue-on-error: true
        run: |
          set -x
          time curl -sSL --max-time 300 -w '\nHTTP=%{http_code} SIZE=%{size_download} SPEED=%{speed_download}B/s\n' \
            ${{ inputs.referer != '' && format('-H "Referer: {0}"', inputs.referer) || '' }} \
            -H 'User-Agent: Mozilla/5.0' \
            -o a.bin "${{ inputs.url }}"
          ls -la a.bin || true
          file a.bin || true
      - name: 方式B - yt-dlp
        continue-on-error: true
        run: |
          pip install -q yt-dlp
          set -x
          time yt-dlp --socket-timeout 60 --retries 3 -o 'b.%(ext)s' "${{ inputs.url }}" || echo "yt-dlp 失败"
          ls -la b.* || true
      - name: 结论
        run: |
          echo "=== 结果 ==="
          for f in a.bin b.*; do [ -f "$f" ] && echo "$f: $(stat -c%s "$f") bytes"; done || true
