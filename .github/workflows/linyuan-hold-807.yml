name: 恢复成片等待最终画面与部署核验
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-hold-807.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 恢复成片在最终复检完成前暂缓发布
        run: |
          python - <<'PY'
          import sys,json,base64,time,subprocess
          sys.path.insert(0,'linyuan')
          from register_selection_recovery import read_state,gh,REPO,PATH
          slug='ly-0912-5dc339-stable-clean-proof-portrait'
          for attempt in range(6):
              doc,st=read_state()
              for entry in st['dispatched']:
                  if entry.get('slug')==slug:
                      entry.update(failed=True,review_hold=True,failure_stage='release-verification',last_error='等待实际成片画面复检及新版字幕证明校验上线，避免旧发布器误处理新产物')
              body=dict(message='ops: hold recovered clean-proof clips until final visual and deployed-code verification',sha=doc['sha'],branch='main',content=base64.b64encode(json.dumps(st,ensure_ascii=False,separators=(',',':')).encode()).decode())
              try:
                  gh('api','--method','PUT',f'repos/{REPO}/contents/{PATH}','--input','-',body=body)
                  print(json.dumps(dict(held=slug,daily=st.get('daily_publish'),published=bool(st.get('published',{}).get(slug))),ensure_ascii=False))
                  break
              except subprocess.CalledProcessError:
                  if attempt==5:raise
                  time.sleep(2)
          PY
