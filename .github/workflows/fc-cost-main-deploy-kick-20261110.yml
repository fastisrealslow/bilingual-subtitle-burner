name: 恢复账户后启动最新主线FC部署
on:
  push:
    branches: [ops/fc-cost-main-deploy-20261110]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 启动主线原有完整验收与部署流程
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fc-production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow fc-production-deploy.yml --limit 6 --json databaseId,headSha,status,conclusion,createdAt
