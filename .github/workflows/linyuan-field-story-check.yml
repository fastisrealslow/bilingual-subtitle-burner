name: 交替发布实验上线前验收
on:
  push:
    branches: [codex/linyuan-alternate-experiment-20261017, codex/linyuan-story-reliable-20261020, codex/linyuan-story-coverage-20261020]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk libchromaprint-tools
      - run: pip install -q pytest numpy pillow requests jieba fonttools pyyaml 'yt-dlp==2026.8.19' 'opencv-python-headless<5'
      - name: 全部林园生产发布回归，禁止投稿
        run: python -m pytest -q tests/test_linyuan* tests/test_fc_deploy_code.py tests/test_cover_wrap_title.py
      - name: 实验补位告警前端回归
        run: node --test tests/test_production_status_page.cjs
  cpu-story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEXT_BACKEND: local
      LOCAL_LLM_MODEL: qwen3.5:9b
      CUDA_VISIBLE_DEVICES: ''
      LOCAL_LLM_TIMEOUT_SEC: '900'
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: 24h
      LINYUAN_EDITORIAL_PROFILE: field-story-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pillow requests jieba
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen35-9b-v1
      - uses: actions/cache@v4
        with:
          path: /tmp/ollama-runtime
          key: ollama-linux-amd64-v0.33.3-c13cea8f3389db41
      - name: 启动固定版本CPU模型，不使用云API
        run: |
          set -euo pipefail
          mkdir -p /tmp/ollama-runtime
          archive=/tmp/ollama-runtime/ollama-linux-amd64.tar.zst
          if ! echo "c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f  $archive" | sha256sum -c -; then
            curl -fsSL --retry 5 --max-time 600 -o "$archive" https://github.com/ollama/ollama/releases/download/v0.33.3/ollama-linux-amd64.tar.zst
          fi
          echo "c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f  $archive" | sha256sum -c -
          sudo tar --zstd -xf "$archive" -C /usr
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:9b
          ollama show qwen3.5:9b >/dev/null
      - name: 真实母片故事选题、反例与新版标题生成复核
        run: python -u scripts/review_linyuan_field_story.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-story-cpu-review
          path: |
            output/field-story-review
            /tmp/ollama.log
