name: 林园离线开发回归
on:
  pull_request:
    paths:
      - 'linyuan/**'
      - 'tests/test_linyuan_*.py'
      - 'requirements-dev.txt'
      - 'scripts/check_linyuan_local.sh'
      - 'scripts/title_model_lab.py'
      - 'scripts/title_batch_cpu.py'
      - 'scripts/source100_ab.py'
      - '.github/workflows/linyuan-local-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装开发依赖与中文字体
        run: |
          python -m pip install -r requirements-dev.txt
          # The Azure Ubuntu mirror stalled on the 61 MB CJK package until
          # the entire real Linux verification timed out (run 39742251970).
          # Keep Ubuntu's signed package validation, using its main archive.
          # Hosted runners use mirror+file, so rewriting ubuntu.sources
          # alone leaves Azure selected. Handle the actual mirror list too.
          for source_config in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_config" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_config"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk ffmpeg
      - name: 离线回归（不生产、不投稿）
        run: PYTHON_BIN="$(command -v python)" bash scripts/check_linyuan_local.sh
      - name: Linux 完整回归（含 ffprobe 与音频指纹）
        run: |
          python -m pip install yt-dlp==2026.8.19
          python -m pytest -q tests/test_linyuan_*.py tests/test_fc_deploy_code.py --tb=short
