name: 林园离线开发回归
on:
  pull_request:
    paths:
      - 'linyuan/**'
      - 'tests/test_linyuan_*.py'
      - 'requirements-dev.txt'
      - 'scripts/check_linyuan_local.sh'
      - 'scripts/title_model_lab.py'
      - 'scripts/title_batch_cpu.py'
      - 'scripts/source100_ab.py'
      - '.github/workflows/linyuan-local-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装开发依赖与中文字体
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: 离线回归（不生产、不投稿）
        run: PYTHON_BIN="$(command -v python)" bash scripts/check_linyuan_local.sh
