name: 林园稳定性修复切换
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stability-control.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: linyuan-reserve-13-recovery
  cancel-in-progress: false
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 保留选段范围并恢复仅因字幕计时超限失败的第3段
        run: |
          python -u - <<'PY'
          import sys,json,time,subprocess
          sys.path.insert(0,'linyuan')
          from register_selection_recovery import read_state,gh,REPO
          from fc import index as fc
          slug='ly-0912-5dc339-reserve-3-timing'
          original=json.loads(gh('api',f'repos/{REPO}/actions/runs/34761171240'))
          assert original['display_title']=='中文源出片 · ly-0912-5dc339-reserve-13-portrait' and original['conclusion']=='failure'
          def admit():
              _,st=read_state()
              if any(e.get('slug')==slug for e in st['dispatched']):
                  return dict(dispatched=slug,already_registered=True)
              active=[]
              for status in ('queued','in_progress'):
                  active.extend(json.loads(gh('api',f'repos/{REPO}/actions/workflows/linyuan-produce-cn.yml/runs?status={status}&per_page=100'))['workflow_runs'])
              if len(active)>=6:return dict(waiting_for_source_slot=True)
              subprocess.run([sys.executable,'linyuan/register_selection_recovery.py',
                  '--origin-slug','ly-0912-5dc339','--expected-source','https://www.bilibili.com/video/BV1hj411X7BL',
                  '--suffix','reserve-3-timing','--output-layout','portrait',
                  '--evidence-run','34761171240','--selected-parts','3'],check=True)
              return dict(dispatched=slug,active_before=len(active))
          for _ in range(32):
              result=fc.run_with_lease('dispatch',admit)
              if result.get('dispatched'):
                  print(json.dumps(result,ensure_ascii=False));break
              time.sleep(15)
          else:raise RuntimeError('没有空余生产名额，保持现有队列，不超额调度')
          PY
