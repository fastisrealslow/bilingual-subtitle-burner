name: 林园稳定性修复切换
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stability-control.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 读取153标题实际模型回答
        run: |
          gh run download 34759050925 --repo "$GITHUB_REPOSITORY" --name title-claim-verification --dir /tmp/evidence
          python - <<'PY'
          from pathlib import Path
          import json
          for p in sorted(Path('/tmp/evidence').rglob('*.json')):
              if p.name=='title-claim-verification.json':continue
              data=json.loads(p.read_text())
              print('MODEL_RESPONSE',json.dumps(data,ensure_ascii=False))
          PY
