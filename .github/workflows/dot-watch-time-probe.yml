name: Dot watch-time read-only probe
on:
  push:
    branches: ['dot/probe-bili-watch-time-20261124']
    paths: ['.github/workflows/dot-watch-time-probe.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trace official data-center module and duration formatter
        run: |
          python - <<'PY'
          import re,html
          from urllib.request import urlopen, Request
          from urllib.parse import urljoin,urlsplit
          from concurrent.futures import ThreadPoolExecutor
          def get(u,limit=5000000):
              if urlsplit(u).hostname not in {'member.bilibili.com','s1.hdslb.com'} or not u.startswith('https:'): return ''
              try:
                  with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=8) as f: return f.read(limit).decode('utf-8','replace')
              except Exception: return ''
          start='https://member.bilibili.com/platform/home'
          root=get(start,300000)
          terms=r'archive_diagnose|avg_play_time|averagePlayDuration|average_play_duration|平均播放时长|data-up|data-center|importmap|webpack|video-analysis'
          def links(u,s):
              raw=re.findall(r'''["']([^"'<>&\s]{2,230}\.js)["']''',s)
              return {urljoin(u,x) for x in raw if x.startswith(('https://s1.hdslb.com/','//s1.hdslb.com/','./','../')) or '/' not in x}
          def check(u):
              s=get(u)
              for k in ('archive_diagnose','avg_play_time','averagePlayDuration','average_play_duration','data-up','data-center','importmap','video-analysis'):
                  for m in list(re.finditer(k,s))[:8]:
                      print('TRACE',u.rsplit('/',1)[-1],k,re.sub(r'[\r\n]',' ',s[max(0,m.start()-145):m.end()+150]))
              return links(u,s)
          urls=links(start,root)
          for m in list(re.finditer(terms,root))[:30]:
              print('HTML TRACE',root[max(0,m.start()-60):m.end()+170].splitlines()[0])
          for j in range(3):
              urls=sorted((set(urls)-set(locals().get('seen',[]))),key=lambda u: (not bool(re.search('data|diagnos|analysis|index',u,re.I)),u))[:30]
              seen=set(locals().get('seen',[]))|set(urls)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  urls={a for result in pool.map(check,urls) for a in result}
          PY
