name: Dot watch-time read-only probe
on:
  push:
    branches: ['dot/probe-bili-watch-time-20261124']
    paths: ['.github/workflows/dot-watch-time-probe.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify watch time and the existing public dashboard
        run: |
          python - <<'PY'
          from urllib.request import urlopen, Request
          from datetime import datetime,timezone
          from time import monotonic,sleep
          import json
          base='https://fastisrealslow.github.io/bilingual-subtitle-burner/'
          until=monotonic()+155
          while monotonic()<until:
              try:
                  def get(path):
                      req=Request(base+path+'?probe='+str(int(datetime.now(timezone.utc).timestamp())),headers={'Cache-Control':'no-cache'})
                      with urlopen(req,timeout=8) as f: return f.read().decode()
                  page=get('log.html')
                  script=get('site/creator-metrics.js')
                  snapshot=json.loads(get('site/creator_metrics.json'))
                  rows=snapshot['videos']
                  available=sum(type(v.get('average_watch_seconds')) is int and v['average_watch_seconds']>0 for v in rows)
                  if 'creator-metrics.js' in page and 'duration(row.average_watch_seconds)' in script and available:
                      print('Verified live: updated watch-time rendering, positive durations',available,'of',len(rows),'snapshot',snapshot['observed_at'])
                      break
                  print('Waiting for public deployment: usable durations',available,'of',len(rows))
              except (OSError,ValueError,KeyError) as e: print('Public deployment not verified yet:',type(e).__name__)
              sleep(10)
          else: raise SystemExit('Public watch-time deployment not verified')
          PY
