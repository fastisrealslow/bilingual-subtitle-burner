name: Dot watch-time read-only probe
on:
  push:
    branches: ['dot/probe-bili-watch-time-20261124']
    paths: ['.github/workflows/dot-watch-time-probe.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official creator assets and read-only response shapes
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python - <<'PY'
          import json,os,re
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin,urlsplit
          from urllib.request import Request, build_opener
          from linyuan.collect_creator_metrics import credentials,read_api,NAV,COMPARE,NoRedirect,OWNER
          origin='https://member.bilibili.com'
          def get(url,limit):
              p=urlsplit(url)
              assert p.scheme=='https' and p.hostname in {'member.bilibili.com','s1.hdslb.com','s2.hdslb.com','s3.hdslb.com','s4.hdslb.com','s1.hdslb.com','i0.hdslb.com'}
              with build_opener(NoRedirect()).open(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=8) as f:
                  return f.read(limit).decode('utf-8','replace')
          def asset(url):
              try:
                  src=get(url,6500000)
                  needles=r'avg_play_time_int|average_play_time|avg_play_time|平均播放时长|平均观看时长|/x/web/data/[a-zA-Z0-9_/-]+'
                  matches=set(re.findall(needles,src))
                  print('ASSET',url,'fields/endpoints',sorted(matches)[:140])
                  for term in ('avg_play_time_int','avg_play_time','平均播放时长','平均观看时长'):
                      for m in list(re.finditer(term,src))[:5]:
                          print('SOURCE',re.sub(r'[\r\n]',' ',src[max(0,m.start()-145):m.end()+200]))
                  # Modern chunk maps can reveal the data-center entry; no execution.
                  nested=re.findall(r'https://s[1-4]\.hdslb\.com/[^"\x27\s<>]{5,220}\.js',src)
                  return nested
              except Exception as e:
                  print('asset unavailable',type(e).__name__)
                  return []
          scripts=set()
          for path in ('/platform/home','/platform/data-up/archive','/platform/upload-manager/article'):
              try:
                  src=get(origin+path,500000)
                  urls=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',src)
                  urls=[urljoin(origin,u) for u in urls if '?' not in u]
                  scripts.update(urls)
                  print('ENTRY',path,len(src),urls[:15])
              except Exception as e: print('ENTRY unavailable',path,type(e).__name__)
          with ThreadPoolExecutor(max_workers=8) as pool:
              nested={u for lst in pool.map(asset,sorted(scripts)[:14]) for u in lst}
              list(pool.map(asset,sorted(nested-scripts)[:12]))
          raw=os.environ.pop('BILIBILI_COOKIES','')
          op=build_opener(NoRedirect())
          header=credentials(raw)
          identity=read_api(NAV,header,op)
          if identity.get('isLogin') is not True or str(identity.get('mid'))!=OWNER: raise SystemExit('identity not verified')
          rows=read_api(COMPARE,header,op)['list']
          public={v['bvid'] for v in json.load(open('site/stats.json'))['top']}
          rows=[r for r in rows if r.get('bvid') in public and r.get('is_only_self') in (0,False)]
          for key in ('stat','hour_stat'):
              obj=[r[key] for r in rows if isinstance(r.get(key),dict)]
              keys={k for d in obj for k in d if re.search(r'time|duration|vt|progress',k,re.I)}
              for k in sorted(keys):
                  numbers=[d.get(k) for d in obj if type(d.get(k)) in (float,int)]
                  strings=[d[k] for d in obj if isinstance(d.get(k),str)]
                  print('shape',key,k,'numeric count/positive',len(numbers),sum(x>0 for x in numbers),'strings',len(strings),'time-formatted',sum(bool(re.fullmatch(r'[0-9:.]+',s)) for s in strings))
          PY
