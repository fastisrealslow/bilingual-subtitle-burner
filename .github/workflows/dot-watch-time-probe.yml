name: Dot peer latest-30 verification
on:
  push:
    branches: ['dot/probe-bili-watch-time-20261124']
    paths: ['.github/workflows/dot-watch-time-probe.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both peer panels and latest-30 values on Pages
        run: |
          python - <<'PY'
          import json
          from time import monotonic,sleep,time
          from urllib.request import urlopen,Request
          base='https://fastisrealslow.github.io/bilingual-subtitle-burner/'
          until=monotonic()+230
          while monotonic()<until:
              try:
                  def get(path):
                      req=Request(base+path+'?probe='+str(int(time())),headers={'Cache-Control':'no-cache'})
                      with urlopen(req,timeout=8) as f: return f.read().decode()
                  page=get('log.html')
                  st=json.loads(get('site/stats.json'))
                  peer=st['peers']
                  if 'id="peer-latest-30"' in page and '对标账号（近 30 天' in page and len(peer)>=2 and all('latest30' in p for p in peer):
                      print('PEER_LIVE',json.dumps({'generated_at':st['generated_at'],'peers':peer},ensure_ascii=False))
                      break
              except (OSError,ValueError,KeyError): pass
              sleep(12)
          else: raise SystemExit('Latest 30 was not verified on Pages')
          PY
