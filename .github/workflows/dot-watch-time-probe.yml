name: Dot watch-time read-only probe
on:
  push:
    branches: ['dot/probe-bili-watch-time-20261124']
    paths: ['.github/workflows/dot-watch-time-probe.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the single-video watch-time field with real public samples
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request,build_opener
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from linyuan.collect_creator_metrics import credentials,read_api,NAV,COMPARE,NoRedirect,OWNER,BV
          op=build_opener(NoRedirect())
          header=credentials(os.environ.pop('BILIBILI_COOKIES',''))
          identity=read_api(NAV,header,op)
          assert identity.get('isLogin') is True and str(identity.get('mid'))==OWNER
          rows=read_api(COMPARE,header,op)['list']
          public={v['bvid'] for v in json.load(open('site/stats.json'))['top']}
          rows=[r for r in rows if r.get('bvid') in public and BV.fullmatch(r['bvid']) and type(r.get('is_only_self')) in (bool,int) and r['is_only_self']==0]
          for r in (rows[:3]+rows[7:9]+rows[19:20]):
              bvid=r['bvid']
              u='https://member.bilibili.com/x/web/data/archive?'+urlencode({'bvid':bvid})
              try:
                  with op.open(Request(u,headers={'Cookie':header,'User-Agent':'Mozilla/5.0','Referer':'https://member.bilibili.com/platform/home'}),timeout=8) as resp: p=json.load(resp)
              except HTTPError as e:
                  print('HTTP',e.code);break
              if p.get('code') != 0: print('platform code',p.get('code'));break
              d=p.get('data') or {}
              play=d.get('play') or {}
              safe={k:play.get(k) for k in ('avg_duration','duration','rate') if type(play.get(k)) in (int,float)}
              print('single-video sample',bvid,safe,'compare_duration',r.get('duration'),'plays',r.get('stat',{}).get('play'))
          PY
