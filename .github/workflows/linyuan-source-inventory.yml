name: 林园素材与真实成片库存
# Refresh the actual accepted artifact after the 2026-09-09 review-policy recovery.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-source-inventory.yml
      - linyuan/source_supply.py
      - linyuan/live_motion.py
      - linyuan/headline_policy.py
      - linyuan/source_outcomes.py
      - linyuan/source_rejection_evidence/*.json
  workflow_run:
    workflows: ['林园监控 · 每日抓取']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: linyuan-source-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验实际 MP4、字幕证据和剩余库存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy 'opencv-python-headless<5'
          python linyuan/source_supply.py --max-new 4
      - name: 保存素材台账与成片库存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f linyuan/.automation/source_inventory.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore(supply): verify actual reserve and refresh material ledger'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
      - name: 合格库存补发布位，库存不足自动补源或复核旧转写
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
          python linyuan/fc/catchup_from_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-inventory
          path: |
            linyuan/.automation/source_inventory.json
            catchup-receipt.json
          include-hidden-files: true
          if-no-files-found: warn
