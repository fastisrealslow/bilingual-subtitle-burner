name: 林园素材与真实成片库存
# Refresh the actual accepted artifact after the 2026-09-09 review-policy recovery.
on:
  schedule:
    # Refresh after FC's hourly admission. Inspection expires after three hours;
    # production completion alone cannot keep an idle reserve usable all day.
    - cron: '45 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-source-inventory.yml
      - linyuan/source_supply.py
      - linyuan/production_status.py
      - linyuan/live_motion.py
      - linyuan/headline_policy.py
      - linyuan/source_outcomes.py
      - linyuan/source_rejection_evidence/*.json
      - linyuan/mother_yield.py
      - linyuan/mother_yield_target.json
      - linyuan/source_selection.py
      - linyuan/ci_fetch_bilibili.py
  workflow_run:
    workflows: ['林园监控 · 每日抓取', 'FC production deploy', '中文源出片']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: linyuan-source-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'FC production deploy' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验实际 MP4、字幕证据和剩余库存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy 'opencv-python-headless<5' pytest
          pip install -q -r linyuan/fc/runtime-requirements.txt
          python -c "import sys; sys.path.insert(0,'linyuan'); from experiment_runtime import health; assert health()['passed']"
          python -m pytest -q tests/test_linyuan_production_status.py tests/test_linyuan_source_admission.py
          python -m pytest -q tests/test_linyuan_reserve_integrity.py
          python -m pytest -q tests/test_linyuan_runner_dispatch.py
          node --test tests/test_production_status_page.cjs
          python linyuan/source_supply.py --max-new 4
      - name: 保存素材台账与成片库存
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f linyuan/.automation/source_inventory.json site/production_status.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore(supply): verify actual reserve and refresh material ledger'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
      - name: 合格库存补发布位，库存不足自动补源或复核旧转写
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
          python -m pytest -q tests/test_linyuan_dispatch_retry.py
          python linyuan/fc/catchup_from_inventory.py
      - name: 回读真实运行状态并更新日志页
        if: always()
        run: |
          python linyuan/production_status.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/production_status.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore(status): reconcile production runs and verified inventory'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
      - name: 复测长母片出片率与固定45%目标（不影响补源和发布）
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python linyuan/mother_yield.py \
            --duration-evidence linyuan/operations/long-yield-duration-evidence-20261013.json \
            --source-duration-evidence linyuan/operations/long-yield-source-duration-evidence-20261013.json \
            > mother-yield-observation.json
          python - <<'PY'
          import json, os
          r=json.load(open('mother-yield-observation.json'))
          c=r['cohort']; bounds=r['possible_all_completed_rate_bounds']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## 长母片出片率\n\n')
              out.write(f"固定目标：{r['target_rate']:.0%}；已完成且时长已知的长母片：{c['successful_known_long']}/{c['completed_known_long']}。\n\n")
              out.write(f"时长未分类：{c['completed_duration_unknown']}；运行中/未决：{c['active_or_unresolved']}。\n\n")
              if bounds['lower'] is not None:
                  out.write(f"保守下限：{bounds['lower']:.2%}；达标：{r['target_achieved']}。\n")
              out.write('只计算已有真实成片核验/发布凭据；不降低门禁，不把新增候选当成出片。\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-inventory
          path: |
            linyuan/.automation/source_inventory.json
            catchup-receipt.json
            github-dispatch-receipt.json
            mother-yield-observation.json
          include-hidden-files: true
          if-no-files-found: warn
