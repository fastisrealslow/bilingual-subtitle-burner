name: 已验证历史公司案例的单次正常补产
permissions:
  contents: write
  actions: write
concurrency:
  group: documented-company-recovery
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 验证单次恢复计划与原并发、来源、库存限制
      run: 'pip install -q -r linyuan/fc/runtime-requirements.txt pytest

        python -m pytest -q tests/test_linyuan_documented_company_recovery.py tests/test_linyuan_verified_story_title_recovery.py'
    - name: 仅实际CPU与线上代码均已验证后请求正常生产
      run: python linyuan/documented_company_recovery.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documented-company-recovery-request
        path: documented-company-recovery-request.json
        if-no-files-found: warn
        retention-days: 30
'on':
  push:
    branches:
    - main
    paths:
    - linyuan/documented_company_recovery.py
    - .github/workflows/linyuan-documented-company-recovery.yml
  workflow_run:
    workflows:
    - FC production deploy
    - 林园素材与真实成片库存
    types:
    - completed
  workflow_dispatch: null
