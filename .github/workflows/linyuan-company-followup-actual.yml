# Generated by scripts/build_linyuan_company_followup_actual.py from production workflow.
name: 真实母片省略称呼追问验收（不入库不投稿）
run-name: 完整访谈漏选复测 · ${{ github.run_id }}
'on':
  push:
    branches:
    - fix/company-followup-question-boundaries-20261023
    paths:
    - .github/linyuan-company-followup-actual.trigger
permissions:
  contents: read
  actions: read
concurrency:
  group: company-followup-actual-${{ github.ref }}
  cancel-in-progress: false
env:
  RUN_TEXT_MODEL: qwen3.5:9b
  RUN_SOURCE: https://www.bilibili.com/video/BV1se411H7tj
  RUN_SLUG: preview-${{ github.run_id }}
  RUN_SPEAKER: 林园
  RUN_OCCASION: 访谈
  RUN_SOURCE_PLATFORM: bilibili
  RUN_REVIEWED_PARTS: ''
  LINYUAN_AUTOMATIC_ONLY: 'true'
  RUN_MAX_OUTPUTS: '1'
  RUN_RECOVERY_RUN_ID: '39996641098'
  LINYUAN_EDITORIAL_PROFILE: field-story-v1
  OUTPUT_LAYOUT: portrait
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: linyuan
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: 安装 ffmpeg 与中文字体
      id: media_setup
      timeout-minutes: 15
      run: bash ci_install_media_tools.sh
    - name: CPU离线ASR与完整观点规则回归（失败不进入实产）
      working-directory: .
      env:
        LINYUAN_AUTOMATIC_ONLY: 'false'
        LINYUAN_TITLE_DRAFT_PROFILE: production
      run: 'python -m pip install -q pytest jieba numpy pillow ''opencv-python<5''

        python -m pytest -q tests/test_linyuan_scene_selection.py tests/test_linyuan_geometry_preflight.py tests/test_linyuan_robust_recovery.py
        tests/test_linyuan_asr_integrity.py tests/test_linyuan_editorial_policy.py tests/test_linyuan_qwen_evidence.py
        tests/test_linyuan_qwen_checkpoint.py tests/test_linyuan_caption_timeout.py tests/test_linyuan_caption_readability.py
        tests/test_linyuan_source_selection.py tests/test_linyuan_selection_0915.py tests/test_linyuan_selection_incident.py
        tests/test_linyuan_fetch_budget.py tests/test_linyuan_source_borders.py tests/test_linyuan_live_tracking.py
        tests/test_linyuan_required_live.py tests/test_linyuan_visual_before_copy.py tests/test_linyuan_full_interview_recovery.py
        tests/test_linyuan_title_claims.py tests/test_linyuan_context_review.py tests/test_linyuan_production_history.py

        '
    - name: 读取并校验发布历史
      id: publication_history
      env:
        GH_TOKEN: ${{ github.token }}
      run: python publication_history.py --out _publication_state.json
    - name: 安装素材质检依赖
      run: 'python -m pip install --upgrade pip

        # opencv 必须锁 <5：OpenCV 5.0 移除了 cv2.CascadeClassifier，会静默打断封面人脸检测

        # （2026-09-01 实测：装到 5.0.0 后人脸检测全失败，封面退化成取第一帧）

        pip install yt-dlp pillow ''opencv-python<5'' rapidocr-onnxruntime

        '
    - name: 缓存 CPU 本地人物模型
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/linyuan-face-models
        key: opencv-yunet-sface-2023mar-2021dec-v1
    - name: 核对新源及旧任务重试的已知准入限制
      id: source_admission
      run: python source_admission_guard.py
    - name: 生成母片下载缓存键
      id: source_cache_key
      run: 'python -c ''import hashlib,os; print("key="+hashlib.sha256(os.environ["RUN_SOURCE"].encode()).hexdigest())''
        >> "$GITHUB_OUTPUT"

        '
    - name: 恢复同一完整母片检查点（不重新下载上游视频）
      id: src
      timeout-minutes: 65
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nmkdir -p _src\ncurl -fLsS --retry 2 --max-time 300 -H \"Authorization: Bearer $GH_TOKEN\"\
        \ \\\n  \"https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12422073680/zip\" -o /tmp/company-followup-mother.zip\n\
        unzip -j -o /tmp/company-followup-mother.zip -d _src\nrm /tmp/company-followup-mother.zip\npython - <<'CHECK'\n\
        import hashlib\nfrom pathlib import Path\nassert hashlib.sha256(Path('_src/video.mp4').read_bytes()).hexdigest()=='6f5ddecc6db4f2045e37a83f63a7d3a122f08287ee1258e9c6f085abdb2b9c2d'\n\
        CHECK\necho 'path=_src/video.mp4' >> \"$GITHUB_OUTPUT\"\n"
    - name: 素材质量门禁
      id: source_gate
      env:
        LOCAL_FACE_MODEL_DIR: ${{ runner.tool_cache }}/linyuan-face-models
      run: "set -euo pipefail\n# 所有渠道都确认音视频轨、时长漂移与头尾可解码；\n# 避免 DASH/HLS 合流“命令成功但下到半截”继续进 ASR。\npython3 ci_fetch_bilibili.py\
        \ --validate-only \"${{ steps.src.outputs.path }}\" \\\n  --failure-report \"deliver/$RUN_SLUG/_tmp/source_quality.json\"\
        \npython3 -u produce_cn.py \\\n  --source \"${{ steps.src.outputs.path }}\" \\\n  --slug \"$RUN_SLUG\" \\\
        \n  --speaker \"$RUN_SPEAKER\" \\\n  --source-check-only \\\n  --source-report \"deliver/$RUN_SLUG/_tmp/source_quality.json\"\
        \n"
    - name: 安装出片依赖
      run: 'pip install fonttools jieba sherpa-onnx==1.13.7

        '
    - name: 读取已验证的CPU离线识别配置
      run: python prepare_asr_runtime.py select --source-report "deliver/$RUN_SLUG/_tmp/source_quality.json"
    - name: 恢复相同母片的离线识别缓存
      uses: actions/cache/restore@v4
      with:
        path: linyuan/.mother_asr/${{ env.MOTHER_ASR_KEY }}
        key: mother-asr-${{ env.MOTHER_ASR_KEY }}
    - name: 按母片哈希载入原始转写
      run: python mother_asr_cache.py restore --work "deliver/$RUN_SLUG/_tmp" --cache ".mother_asr/$MOTHER_ASR_KEY"
        --source-report "deliver/$RUN_SLUG/_tmp/source_quality.json"
    - name: 复用同源失败任务的已完成证据
      if: env.RUN_RECOVERY_RUN_ID != ''
      env:
        GH_TOKEN: ${{ github.token }}
        RECOVERY_RUN_ID: ${{ env.RUN_RECOVERY_RUN_ID }}
      run: 'python restore_production_evidence.py --run-id "$RECOVERY_RUN_ID" --work "deliver/$RUN_SLUG/_tmp" --artifact-name
        preview-editorial-preview-39996641098

        '
    - name: 检查原始识别证据，避免重复下载和推理
      env:
        GH_TOKEN: ${{ github.token }}
      run: python prepare_asr_runtime.py cache --source-report "deliver/$RUN_SLUG/_tmp/source_quality.json"
    - name: 准备CPU离线Qwen识别及逐字对齐
      id: asr_prepare
      if: env.ASR_BACKEND == 'qwen3' && env.ASR_EVIDENCE_READY != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        CUDA_VISIBLE_DEVICES: ''
        ASR_SOURCE_SLUG: ${{ env.RUN_SLUG }}
      run: 'pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

        pip install qwen-asr

        python prepare_asr_runtime.py prepare --source-report "deliver/$RUN_SLUG/_tmp/source_quality.json"

        '
    - name: 缓存 SenseVoice CPU 模型
      id: sensevoice-cache
      if: env.ASR_BACKEND == 'sensevoice'
      uses: actions/cache@v4
      with:
        path: linyuan/sensevoice_model
        key: sensevoice-int8-v1
    - name: 下载 SenseVoice 模型
      if: env.ASR_BACKEND == 'sensevoice' && steps.sensevoice-cache.outputs.cache-hit != 'true'
      run: "mkdir -p sensevoice_model\ncurl -sfL --retry 3 --max-time 600 -o /tmp/sv.tar.bz2 \\\n  \"https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2\"\
        \ntar xjf /tmp/sv.tar.bz2 -C sensevoice_model --strip-components=1\nls -lh sensevoice_model/\n"
    - name: 复用 LLM 缓存
      id: llm-cache
      uses: actions/cache/restore@v4
      with:
        path: linyuan/.llm_cache
        key: llm-cn-${{ env.RUN_SLUG }}-${{ github.run_id }}
        restore-keys: 'llm-cn-${{ env.RUN_SLUG }}-

          llm-cn-

          '
    - name: 缓存 CPU 本地文本模型
      id: ollama-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ~/.ollama/models
        key: ${{ env.RUN_TEXT_MODEL == 'qwen3.5:9b' && 'ollama-qwen35-9b-v1' || env.RUN_TEXT_MODEL == 'qwen3:8b'
          && 'ollama-qwen3-8b-v1' || env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1'
          }}
    - name: 缓存已校验的 Ollama 安装包
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: /tmp/ollama-runtime
        key: ollama-linux-amd64-v0.33.3-c13cea8f3389db41
    - name: 启动 CPU 本地文本模型（禁止云 API）
      id: local_text
      continue-on-error: true
      env:
        OLLAMA_VERSION: v0.33.3
        OLLAMA_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
      run: "set -euo pipefail\nmkdir -p /tmp/ollama-runtime\narchive=/tmp/ollama-runtime/ollama-linux-amd64.tar.zst\n\
        if ! echo \"${OLLAMA_SHA256}  $archive\" | sha256sum -c -; then\n  curl -fsSL --retry 8 --retry-all-errors\
        \ --retry-delay 5 --retry-max-time 300 --max-time 600 \\\n    -o /tmp/ollama-download.tar.zst \\\n    \"\
        https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst\"\n  echo\
        \ \"${OLLAMA_SHA256}  /tmp/ollama-download.tar.zst\" | sha256sum -c -\n  mv /tmp/ollama-download.tar.zst\
        \ \"$archive\"\nfi\nsudo tar --zstd -xf \"$archive\" -C /usr\nOLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=24h\
        \ OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_NUM_PARALLEL=1 \\\n  ollama serve > /tmp/ollama.log 2>&1 &\nfor _ in\
        \ $(seq 1 30); do\n  curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break\n  sleep 1\ndone\ncurl\
        \ -fsS http://127.0.0.1:11434/api/tags >/dev/null\ncase \"$RUN_TEXT_MODEL\" in\n  qwen3:4b|qwen3:4b-instruct-2507-q4_K_M|qwen3:8b|qwen3.5:9b)\
        \ ;;\n  *) echo '只允许已列明的CPU离线模型' >&2; exit 1 ;;\nesac\nollama pull \"$RUN_TEXT_MODEL\"\nollama show \"$RUN_TEXT_MODEL\"\
        \ >/dev/null\n# Pulling only downloads weights.  Warm them into RAM before the\n# bounded CPU review budget\
        \ begins.\npython -c 'import json,os; print(json.dumps(dict(model=os.environ[\"RUN_TEXT_MODEL\"],messages=[dict(role=\"\
        user\",content=\"Reply ready\")],stream=False,think=False,options=dict(temperature=0,num_predict=8,num_ctx=16384))))'\
        \ > /tmp/ollama-warmup.json\ncurl -fsS --max-time 600 http://127.0.0.1:11434/api/chat \\\n  -H 'Content-Type:\
        \ application/json' \\\n  --data-binary @/tmp/ollama-warmup.json \\\n  | python -c 'import json,sys; d=json.load(sys.stdin);\
        \ assert (d.get(\"message\") or {}).get(\"content\")'\n"
    - name: 保存 CPU 本地文本模型缓存
      if: steps.local_text.outcome == 'success' && steps.ollama-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ~/.ollama/models
        key: ${{ env.RUN_TEXT_MODEL == 'qwen3.5:9b' && 'ollama-qwen35-9b-v1' || env.RUN_TEXT_MODEL == 'qwen3:8b'
          && 'ollama-qwen3-8b-v1' || env.RUN_TEXT_MODEL == 'qwen3:4b' && 'ollama-qwen3-4b-v1' || 'ollama-qwen3-4b-instruct-2507-q4-v1'
          }}
    - name: 出片
      id: render
      timeout-minutes: 150
      env:
        ASR_CPU_THREADS: '2'
        CUDA_VISIBLE_DEVICES: ''
        TEXT_BACKEND: local
        SOURCE_EDITORIAL_FIRST: 'true'
        TEXT_RUNTIME_UNAVAILABLE: ${{ steps.local_text.outcome != 'success' }}
        LOCAL_LLM_URL: http://127.0.0.1:11434/api/chat
        LOCAL_LLM_MODEL: ${{ env.RUN_TEXT_MODEL }}
        LOCAL_LLM_TIMEOUT_SEC: '600'
        PART_RENDER_BUDGET_SEC: '3600'
        SENSEVOICE_MODEL_DIR: sensevoice_model
        ZH_FONT: Noto Sans CJK SC
        EN_FONT: DejaVu Sans
        COVER_STYLE: ${{ vars.COVER_STYLE || 'auto' }}
        REVIEWED_PARTS: ${{ env.RUN_REVIEWED_PARTS }}
        SELECTED_PARTS: ${{ inputs.selected_parts }}
        GH_TOKEN: ${{ github.token }}
        SOURCE_ORIGIN_URL: ${{ env.RUN_SOURCE }}
        PUBLICATION_STATE_PATH: _publication_state.json
        REPAIR_BVID: ${{ inputs.repair_bvid }}
        RENDER_SLUG: ${{ env.RUN_SLUG }}
        OUTPUT_LAYOUT: ${{ env.OUTPUT_LAYOUT || 'auto' }}
        LINYUAN_EDITORIAL_PROFILE: ${{ env.LINYUAN_EDITORIAL_PROFILE || 'baseline' }}
      run: "set -euo pipefail\n# The history snapshot was validated before downloads or inference.\npython -c 'from\
        \ publication_history import read; read(\"_publication_state.json\")'\nif [ -n \"$REPAIR_BVID\" ]; then\n\
        \  test '${{ inputs.auto_publish }}' != 'true'\n  python media_revision.py --bvid \"$REPAIR_BVID\" --slug\
        \ \"$RENDER_SLUG\" --state \"$PUBLICATION_STATE_PATH\"\nfi\npython3 -u produce_cn.py \\\n  --source \"${{\
        \ steps.src.outputs.path }}\" \\\n  --slug \"$RUN_SLUG\" \\\n  --speaker \"$RUN_SPEAKER\" \\\n  --occasion\
        \ \"$RUN_OCCASION\" \\\n  --source-platform \"$RUN_SOURCE_PLATFORM\" \\\n  --source-report \"deliver/$RUN_SLUG/_tmp/source_quality.json\"\
        \ \\\n  --max-outputs \"$RUN_MAX_OUTPUTS\" \\\n            --split-highlights \\\n  --require-live-video\
        \ \\\n  --only-reviewed-parts \"$REVIEWED_PARTS\" \\\n  --only-selected-parts \"$SELECTED_PARTS\" \\\n \
        \ ${{ inputs.target_parts != '' && inputs.target_parts != '0' && format('--target-parts {0}', inputs.target_parts)\
        \ || '' }} \\\n  ${{ inputs.include_full && '--include-full' || '' }} \\\n  ${{ (github.event_name == 'push'\
        \ || inputs.prefer_live_video) && '--prefer-live-video' || '' }}\n"
    - name: 验收真实实验交付（缺实验成片即失败）
      if: env.LINYUAN_EDITORIAL_PROFILE == 'field-story-v1'
      working-directory: .
      run: python scripts/verify_linyuan_story_delivery.py "linyuan/deliver/$RUN_SLUG"
    - name: 独立复验本次实验原始成片、字幕及封面
      run: "python - <<'VERIFY'\nimport hashlib,json,os\nfrom pathlib import Path\nfrom artifact_range import delivery_files\n\
        from publishing_experiment import actual_profile,TREATMENT\nfrom source_supply import validate_part\nroot=Path('deliver')/os.environ['RUN_SLUG']\n\
        raw=(root/'meta.json').read_bytes();data=json.loads(raw)\nrows=data if isinstance(data,list) else [data]\n\
        accepted=[]\nfor row in rows:\n    if actual_profile(row)!=TREATMENT:continue\n    files=delivery_files(row)\n\
        \    assert all((root/name).is_file() for name in files)\n    before={name:hashlib.sha256((root/name).read_bytes()).hexdigest()\
        \ for name in files}\n    issue=validate_part(row,root)\n    assert issue is None,issue\n    assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==sha\
        \ for name,sha in before.items())\n    accepted.append(dict(title=row['title'],resolution=row['resolution'],files=before))\n\
        assert accepted and (root/'meta.json').read_bytes()==raw\n(root/'original_media_validation.json').write_text(json.dumps(dict(passed=True,\n\
        \    accepted=accepted,metadata_unchanged=True,files_unchanged=True,\n    diagnostic_only=True,registered_stock=False,published=False),ensure_ascii=False,indent=2))\n\
        VERIFY\n"
    - name: 留存独立原始成片复验结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: company-followup-original-media-validation
        path: linyuan/deliver/${{ env.RUN_SLUG }}/original_media_validation.json
        if-no-files-found: warn
    - name: 留存独立实验交付结果（普通出片成功不代表实验成功）
      if: always() && env.LINYUAN_EDITORIAL_PROFILE == 'field-story-v1'
      uses: actions/upload-artifact@v4
      with:
        name: preview-experiment-result-${{ env.RUN_SLUG }}
        path: 'linyuan/deliver/${{ env.RUN_SLUG }}/experiment_production.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/story_selection.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_profile_feasibility.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/keynote_proposals.json

          '
        if-no-files-found: warn
        retention-days: 30
    - name: 为未捕获的运行错误保存恢复报告
      if: failure()
      env:
        PRODUCTION_STEPS: ${{ toJSON(steps) }}
        PRODUCTION_JOB_STATUS: ${{ job.status }}
      run: python production_failure_report.py
    - name: 保存已经完成的文本推理（后续失败仍保留）
      if: always() && steps.llm-cache.outcome == 'success' && steps.render.outcome != 'skipped'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: linyuan/.llm_cache
        key: llm-cn-${{ env.RUN_SLUG }}-${{ github.run_id }}
    - name: 留存完整观点与原始ASR核验材料
      if: always() && steps.render.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: preview-editorial-${{ env.RUN_SLUG }}
        path: 'linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/asr*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/qwen_cpu/*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/cues_raw.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/copywrite*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/title_request*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/title_response*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/transcript_audit*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/transcript_audit*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/highlight*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_question_answers.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/story_selection.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_profile_feasibility.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/keynote_proposals.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/visual-question-cards/

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/selection_diagnostics*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/native-rejection*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/border*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/highlight*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/context_response*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/context_topics*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/context_review*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/context_candidates*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/editorial_review*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/editorial_response*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/editorial_service_error*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/qr_review/

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/semantic*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/semantic*.txt

          linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json

          linyuan/deliver/${{ env.RUN_SLUG }}/meta.json

          linyuan/deliver/${{ env.RUN_SLUG }}/subtitles*.ass

          '
        retention-days: 30
        if-no-files-found: ignore
    - name: 独立保存原始识别检查点（缓存淘汰后仍可复用）
      if: always() && steps.render.outcome != 'skipped' && env.MOTHER_ASR_KEY != ''
      uses: actions/upload-artifact@v4
      with:
        name: preview-raw-asr-${{ env.MOTHER_ASR_KEY }}
        path: linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/asr_raw_chunks.json
        retention-days: 30
        if-no-files-found: ignore
    - name: 保存已完成的母片转写供后续选段复用
      if: always() && steps.render.outcome != 'skipped' && env.MOTHER_ASR_KEY != ''
      run: python mother_asr_cache.py save --work "deliver/$RUN_SLUG/_tmp" --cache ".mother_asr/$MOTHER_ASR_KEY"
        --source-report "deliver/$RUN_SLUG/_tmp/source_quality.json"
    - uses: actions/cache/save@v4
      if: always() && steps.render.outcome != 'skipped' && env.MOTHER_ASR_KEY != ''
      with:
        path: linyuan/.mother_asr/${{ env.MOTHER_ASR_KEY }}
        key: mother-asr-${{ env.MOTHER_ASR_KEY }}
    - name: 读取逐片验收检查点（后续失败不丢失已验收文件）
      id: delivery_checkpoint
      if: always() && steps.source_gate.outcome == 'success' && steps.render.outcome != 'skipped'
      run: python delivery_checkpoint.py --directory "deliver/$RUN_SLUG" --slug "$RUN_SLUG"
    - name: 整理归档（slug 命名，留存可分析产物）
      id: archive_accepted
      if: always() && steps.delivery_checkpoint.outputs.accepted == 'true'
      run: 'set -euo pipefail

        cd "deliver/$RUN_SLUG"

        python3 -c ''import sys; sys.path.insert(0,"../.."); from batch_delivery import archive_accepted; archive_accepted(".",sys.argv[1])''
        "$RUN_SLUG"

        echo "归档产物："

        ls -la _accepted/

        '
    - name: 原文件逐项复验并生成无重复视频的发布包
      id: compact_delivery
      if: always() && steps.archive_accepted.outcome == 'success'
      run: python compact_delivery.py --directory "deliver/$RUN_SLUG" --slug "$RUN_SLUG" --preview-only
    - name: 上传成片到 Artifact
      if: always() && steps.compact_delivery.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: preview-deliver-${{ env.RUN_SLUG }}
        path: linyuan/deliver/${{ env.RUN_SLUG }}/_publish_ready/
        retention-days: 90
        if-no-files-found: error
    - name: 留存精简包哈希复验证据
      if: always() && steps.compact_delivery.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: preview-publish-bundle-proof-${{ env.RUN_SLUG }}
        path: linyuan/deliver/${{ env.RUN_SLUG }}/compact-report.json
        retention-days: 30
        if-no-files-found: error
    - name: 保留部分失败的实际成片与逐帧取景证据
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: preview-render-evidence-${{ env.RUN_SLUG }}
        path: 'linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/rejected/

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/tracked*.json

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/tracked*.evidence/

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/live-region-*/

          linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/final_identity*/

          '
        retention-days: 14
        if-no-files-found: ignore
    - name: 保存本地模型运行日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: preview-local-text-runtime-${{ env.RUN_SLUG }}
        path: /tmp/ollama.log
        if-no-files-found: ignore
    - name: 失败时上传中间产物
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: preview-debug-${{ env.RUN_SLUG }}
        path: 'linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/

          linyuan/deliver/${{ env.RUN_SLUG }}/meta.json

          linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json

          linyuan/deliver/${{ env.RUN_SLUG }}/final*.mp4

          '
        retention-days: 14
        if-no-files-found: ignore
    - name: 上传整源无合格片结果供自动补位
      if: failure() && inputs.repair_bvid == ''
      uses: actions/upload-artifact@v4
      with:
        name: preview-production-reject-${{ env.RUN_SLUG }}
        path: linyuan/deliver/${{ env.RUN_SLUG }}/batch_report.json
        retention-days: 14
        if-no-files-found: ignore
    - name: 上传素材拒绝结果
      if: failure() && (steps.source_admission.outcome == 'failure' || steps.source_gate.outcome == 'failure' ||
        steps.src.outcome == 'failure')
      uses: actions/upload-artifact@v4
      with:
        name: preview-source-reject-${{ env.RUN_SLUG }}
        path: linyuan/deliver/${{ env.RUN_SLUG }}/_tmp/source_quality.json
        retention-days: 14
        if-no-files-found: error
    - name: 摘要
      if: always()
      run: "{\n  echo \"## $RUN_SLUG\"\n  # cwd 是 linyuan/（job 级 working-directory），路径不带前缀；\n  # 只有 actions/* 的\
        \ with.path 才相对仓库根、需要 linyuan/ 前缀。\n  if [ -f \"deliver/$RUN_SLUG/meta.json\" ]; then\n    echo '```json'\n\
        \    cat \"deliver/$RUN_SLUG/meta.json\"\n    echo '```'\n  else\n    echo \"未产出 meta.json，见 debug artifact\"\
        \n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
