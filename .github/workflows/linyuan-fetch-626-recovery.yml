name: 林园626取源故障实测
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-fetch-626-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linyuan-fetch-626-recovery
  cancel-in-progress: false
jobs:
  download-same-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 断点续传、总预算与质量门禁回归
        run: |
          pip install -q pytest requests
          python -m pytest -q tests/test_linyuan_fetch_budget.py tests/test_linyuan_hd_download.py
      - name: 实际重下626同一母片，验证完整音视频轨和头尾解码
        timeout-minutes: 25
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          mkdir -p /tmp/fetch-626
          set -o pipefail
          python -u linyuan/ci_fetch_bilibili.py \
            --url https://www.bilibili.com/video/BV1EV411g7LU \
            --out /tmp/fetch-626/video.mp4 --budget-seconds 1200 \
            --failure-report /tmp/fetch-626/source_quality.json 2>&1 | tee /tmp/fetch-626/download.log
          python linyuan/ci_fetch_bilibili.py --validate-only /tmp/fetch-626/video.mp4 | tee /tmp/fetch-626/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-626-evidence
          path: |
            /tmp/fetch-626/*.log
            /tmp/fetch-626/*.json
          if-no-files-found: warn
