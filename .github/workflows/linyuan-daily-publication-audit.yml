name: 林园每日四条实际发布验收
# 0914 recovery: recheck exact creator receipts after the repaired catch-up.
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-daily-publication-audit.yml, linyuan/daily_publication_audit.py]
  schedule:
    - cron: '30 1 * * *' # 09:30 Beijing: inspect ready stock before the first slot.
    - cron: '0 5,12 * * *' # 13:00 / 20:00 Beijing: before the two treatment slots.
    - cron: '20 2,6,8,13 * * *'
    - cron: '50 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: linyuan-daily-publication-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 核对实际日期、独立文件、稿件回执与公开状态
        run: |
          pip install -q -r linyuan/fc/runtime-requirements.txt
          python linyuan/daily_publication_audit.py
      - name: 实验稿不足时请求一次正常库存核验与补源
        if: always()
        run: |
          set -euo pipefail
          test -f daily-publication-audit.json || exit 0
          needed=$(PYTHONPATH=linyuan python -c 'import json; from daily_publication_audit import experiment_recovery_needed; r=json.load(open("daily-publication-audit.json")); print("yes" if experiment_recovery_needed(r) else "no")')
          if [ "$needed" = yes ]; then
            gh workflow run linyuan-source-inventory.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-publication-audit
          path: daily-publication-audit.json
          if-no-files-found: error
          retention-days: 30
