name: 实验视频同龄播放采样（不投稿）
on:
  schedule:
    - cron: '17 * * * *'
  # Hosted cron can miss the two-hour observation window. Trusted production
  # completions offer additional read-only opportunities; no window widening.
  workflow_run:
    workflows: ['林园监控 · 每日抓取', '林园素材与真实成片库存', '中文源出片', '林园每日四条实际发布验收']
    types: [completed]
  push:
    branches: [main]
    paths: [linyuan/collect_experiment_stats.py, linyuan/bili_archive_status.py, .github/workflows/linyuan-experiment-observations.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linyuan-stats
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 通过现有登录态只查真实回执对应的自家稿件
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python linyuan/collect_experiment_stats.py
      - name: 保存实际观测，未采到不补零
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- site/stats.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/stats.json
          git commit -m 'chore(stats): record receipt-bound same-age experiment observations'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
