name: 林园14条一次性投稿触发

# 一次性启动器：本文件进入 main 时只负责调用正式投稿工作流。
# 正式上传仍由阿里云 FC fc-develop 执行。
# 2026-09-05：保留旧 BV 证据后，恢复 V4 真人封面批次 ly-parity-v3-14-0905。
# 2026-09-05 13:20：校正前两条回执后，从第3条继续投稿。
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-publish-batch-once.yml

permissions:
  actions: write

concurrency:
  group: linyuan-publish-batch-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 启动 ly-parity-v3-14-0905 的14条投稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run linyuan-publish-batch.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f slug='ly-parity-v3-14-0905' \
            -f total='14'
