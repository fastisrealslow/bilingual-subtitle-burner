name: 林园成片归档瘦身修复

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-artifact-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 只上传归档后的交付文件
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/linyuan-produce-cn.yml')
          s = p.read_text()
          old = '''      - name: 上传成片到 Artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: deliver-${{ inputs.slug }}\n          path: linyuan/deliver/${{ inputs.slug }}/\n          exclude: linyuan/deliver/${{ inputs.slug }}/_tmp/**\n          retention-days: 90\n          if-no-files-found: error\n'''
          new = '''      - name: 上传成片到 Artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: deliver-${{ inputs.slug }}\n          # upload-artifact@v4 没有 exclude 参数。只上传整理归档后带 slug\n          # 前缀的交付文件，避免把 _tmp、源文件及未前缀副本重复塞进 Artifact。\n          path: linyuan/deliver/${{ inputs.slug }}/${{ inputs.slug }}.*\n          retention-days: 90\n          if-no-files-found: error\n          compression-level: 0\n'''
          if old not in s:
              raise SystemExit('target artifact block not found')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/linyuan-produce-cn.yml
      - name: 提交修复
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/linyuan-produce-cn.yml
          git commit -m 'fix: slim production artifact to archived delivery files'
          git push origin HEAD:main
