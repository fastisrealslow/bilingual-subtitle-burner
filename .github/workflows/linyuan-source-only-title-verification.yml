name: 修复问答对象误屏蔽与短标题长度：17实片复验（不投稿）
on:
  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-source-only-title-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '17'
      content_policy: reference_v1
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
