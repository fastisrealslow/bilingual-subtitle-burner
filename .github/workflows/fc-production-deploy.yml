name: FC production deploy

# FC 代码进入 main 后直接部署到已有阿里云函数；函数中的 GitHub token、
# B站 cookies、依赖层和触发器都会保留；同时把投稿超时和临时磁盘调整到
# 可容纳一条 57 分钟完整版的规格。
on:
  push:
    branches: [main]
    paths:
      - linyuan/fc/index.py
      - linyuan/fc/stage_revision.py
      - linyuan/fc/title_revision.py
      - linyuan/fc/media_repair.py
      - linyuan/fc/reviewed_updates.py
      - linyuan/fc/reviewed_third_video.py
      - linyuan/fc/invoke_third_video.py
      - linyuan/fc/reviewed_0910/**
      - linyuan/fc/invoke_reviewed_updates.py
      - linyuan/fc/state_read.py
      - linyuan/fc/catchup_from_inventory.py
      - tests/test_linyuan_receipt_recovery.py
      - tests/test_linyuan_required_live.py
      - linyuan/stage_context.py
      - linyuan/title_rewrite.py
      - linyuan/stock_upgrade_plan.py
      - .github/workflows/linyuan-title-claim-check.yml
      - tests/fixtures/linyuan_0913_landscape_title.json
      - linyuan/headline_policy.py
      - linyuan/editorial_policy.py
      - linyuan/fc/deploy_code.py
      - tests/test_fc_deploy_code.py
      - linyuan/fc/verify_production.py
      - .github/workflows/fc-production-deploy.yml
  workflow_dispatch:
    inputs:
      refill:
        description: '部署核验后按当前库存补候选（仅素材刷新使用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fc-production-deploy
  cancel-in-progress: false

jobs:
  editorial-check:
    uses: ./.github/workflows/linyuan-title-claim-check.yml
  deploy:
    needs: editorial-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
      # runner context 在 job 级 env 尚不可用；使用固定临时路径避免工作流预校验失败。
      FC_CODE_ZIP: /tmp/fc-code.zip
      FC_MEMORY_SIZE_MB: '1024'
      FC_CPU: '0.5'
      FC_TIMEOUT_SECONDS: '7200'
      FC_DISK_SIZE_MB: '10240'
      # 普通代码部署只核验，不应顺带启动另一批生产。只有素材刷新
      # 显式 workflow_dispatch(refill=true) 才补队列。
      FC_REFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.refill && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查一次性部署凭据
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ALIYUN_AK" || -z "$ALIYUN_SK" ]]; then
            echo "请在仓库 Settings → Secrets and variables → Actions 中配置 ALIYUN_AK 和 ALIYUN_SK" >&2
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装阿里云 FC SDK
        run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi

      - name: 打包并校验 FC 代码
        shell: bash
        run: |
          set -euo pipefail
          zip -j "$FC_CODE_ZIP" linyuan/fc/index.py linyuan/stage_context.py linyuan/title_rewrite.py linyuan/headline_policy.py linyuan/editorial_policy.py linyuan/fc/media_repair.py linyuan/fc/stage_revision.py linyuan/fc/title_revision.py linyuan/fc/reviewed_updates.py linyuan/fc/reviewed_third_video.py
          (cd linyuan/fc && zip -r "$FC_CODE_ZIP" reviewed_0910)
          unzip -t "$FC_CODE_ZIP"

      - name: 单片隔离与每日配额回归
        run: |
          pip install -q pytest jieba requests
          python -m pytest -q tests/test_linyuan_state_merge.py tests/test_linyuan_batch_isolation.py tests/test_linyuan_asr_integrity.py tests/test_linyuan_editorial_policy.py tests/test_linyuan_qwen_evidence.py tests/test_linyuan_source_supply.py tests/test_linyuan_media_revision.py tests/test_linyuan_daily_landscape.py tests/test_linyuan_preflight_recovery.py tests/test_linyuan_archive_admission.py
          python -m pytest -q tests/test_linyuan_reviewed_updates.py tests/test_linyuan_reviewed_download.py tests/test_linyuan_stage_revision.py
          python -m pytest -q tests/test_linyuan_third_video.py tests/test_fc_deploy_code.py tests/test_linyuan_config_health.py
          python -m pytest -q tests/test_linyuan_receipt_recovery.py tests/test_linyuan_required_live.py tests/test_linyuan_makeup_slot.py tests/test_linyuan_missed_slots.py tests/test_linyuan_title_claims.py tests/test_linyuan_title_revision.py
          python -m pytest -q tests/test_stock_upgrade.py

      - name: 部署到阿里云函数计算
        run: python linyuan/fc/deploy_code.py

      - name: 核对部署代码与定时器（按显式参数补候选）
        run: python linyuan/fc/verify_production.py

      - name: 原位更新用户已验收的三条稿件（带持久化回执防重）
        run: python -u linyuan/fc/invoke_reviewed_updates.py

      - name: 原位替换用户追加要求的第三条视频（独立版本回执）
        run: python -u linyuan/fc/invoke_third_video.py

      - name: 原位更新本次用户指出的标题（精确BV，不新增投稿）
        run: >-
          python -u -c "import sys; sys.path.insert(0,'linyuan/fc');
          from invoke_reviewed_updates import main;
          main(trigger='apply-title-revision-0913', state_key='title_revision_0913',
          bvids=('BV14PYY6sEbq',), version_file='linyuan/fc/title_revision.py',
          prefix='title-0913', report='title-revision-verification.json')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            production-verification.json
            reviewed-updates-verification.json
            third-video-verification.json
            title-revision-verification.json
          if-no-files-found: error
