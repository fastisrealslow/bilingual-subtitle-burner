name: 自然断句上线前回归
on:
  push:
    branches: [codex/linyuan-natural-captions-20261016]
    paths:
      - 'linyuan/**'
      - 'tests/test_linyuan_caption_lines.py'
      - '.github/workflows/linyuan-natural-caption-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk libchromaprint-tools
      - run: pip install -q pytest numpy pillow requests jieba 'opencv-python-headless<5'
      - name: 字幕、源文、时间轴、封面标题和线上包完整回归（不投稿）
        run: >-
          python -m pytest -q
          tests/test_linyuan_caption_lines.py tests/test_linyuan_caption_readability.py
          tests/test_linyuan_caption_timeout.py tests/test_linyuan_subtitle_edit_delivery.py
          tests/test_linyuan_presentation.py tests/test_linyuan_fc_package.py
          tests/test_linyuan_selection_0915.py tests/test_linyuan_source_supply.py
          tests/test_linyuan_title_claims.py tests/test_linyuan_title_batch_regressions.py
          tests/test_linyuan_asr_integrity.py tests/test_linyuan_editorial_policy.py
          tests/test_linyuan_scene_selection.py tests/test_linyuan_geometry_preflight.py
          tests/test_linyuan_quality_gates.py tests/test_fc_deploy_code.py
