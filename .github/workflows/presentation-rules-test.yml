name: 通用版式回归
on:
  push:
    branches: [main]
    paths:
      - linyuan/presentation.py
      - linyuan/caption_readability.py
      - linyuan/headline_policy.py
      - tests/test_linyuan_caption_readability.py
      - tests/fixtures/linyuan_readability_0909.json
      - linyuan/produce_cn.py
      - linyuan/live_tracking.py
      - tests/test_linyuan_live_tracking.py
      - linyuan/source_selection.py
      - linyuan/ci_fetch_bilibili.py
      - linyuan/source_geometry.py
      - tests/test_linyuan_source_selection.py
      - tests/test_linyuan_fetch_budget.py
      - tests/test_linyuan_source_borders.py
      - tests/fixtures/linyuan_685_selection.json
      - tests/fixtures/linyuan_686_selection.json
      - linyuan/fc/index.py
      - tests/test_linyuan_asr_integrity.py
      - tests/test_linyuan_presentation.py
      - tests/test_linyuan_clean_source_plan.py
      - tests/test_linyuan_quality_gates.py
      - tests/test_linyuan_source_supply.py
      - tests/test_linyuan_editorial_policy.py
      - tests/test_linyuan_qwen_evidence.py
      - .github/workflows/presentation-rules-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - run: pip install pytest numpy pillow 'opencv-python-headless<5' jieba
      - name: 通用字幕、封面、版式和投稿证据回归（不投稿）
        run: >-
          python -m pytest -q tests/test_linyuan_presentation.py
          tests/test_linyuan_live_tracking.py
          tests/test_linyuan_source_selection.py tests/test_linyuan_fetch_budget.py
          tests/test_linyuan_source_borders.py
          tests/test_linyuan_caption_readability.py tests/test_linyuan_caption_timeout.py
          tests/test_linyuan_headline_policy.py
          tests/test_linyuan_clean_source_plan.py tests/test_linyuan_quality_gates.py
          tests/test_linyuan_batch_isolation.py tests/test_linyuan_asr_integrity.py
          tests/test_linyuan_source_supply.py
          tests/test_linyuan_editorial_policy.py tests/test_linyuan_qwen_evidence.py
          -k 'not test_review_paused_batch_cannot_publish'
        # 该历史用例要求已获用户授权继续执行的 14 条批次仍被暂停，与现行状态不符；
        # 此工作流不改变该批次开关，只验证通用规则及其余质量门禁。
