name: 原片字幕已确认疑点的同 PCM 双模型对照（不入库不投稿）
on:
  push:
    branches: [fix/source-caption-asr-crosscheck-20261024]
    paths: [linyuan/check_source_caption_asr_scale.py, .github/workflows/linyuan-source-caption-asr-scale.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ASR_DIAGNOSTIC_CONTEXT_PROFILE: finance-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装与生产相同的媒体解码工具
        run: bash linyuan/ci_install_media_tools.sh
      - name: 恢复前次实测的同一 PCM 窗口，只改变既有有限词表上下文
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12521795806/zip" -o /tmp/previous.zip
          mkdir -p source-caption-asr-trial
          unzip -q /tmp/previous.zip -d source-caption-asr-trial
          for size in 0.6B 1.7B; do
            mv "source-caption-asr-trial/result-$size.json" "source-caption-asr-trial/baseline-none-$size.json"
          done
          rm /tmp/previous.zip
      - name: 安装独立 CPU 识别运行环境
        run: |
          python -m pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q qwen-asr
      - name: 两模型按顺序独立进程识别，记录耗时和内存
        run: python -u linyuan/check_source_caption_asr_scale.py compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-caption-asr-scale-trial
          path: |
            source-caption-asr-trial/*.json
            source-caption-asr-trial/core-*.wav
          retention-days: 30
          if-no-files-found: error
