name: 林园V11精确14条重跑
# One-shot exact dispatch for the authorized parity batch.
on:
  push:
    branches: [main]
    paths: [.github/workflows/fc-diagnose-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 停止旧的错误形状重跑
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 33960174018 33960451229 33960650393 33960892427; do
            gh run cancel "$run" --repo "$GITHUB_REPOSITORY" || true
          done
      - name: 触发13条切片加1条完整版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run linyuan-produce-cn.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source='https://www.bilibili.com/video/BV1Pzug6fEyY' \
            -f slug='ly-parity-v3-14-0905' \
            -f speaker='林园' \
            -f occasion='2026年8月7日林园57分钟专访' \
            -f delay_hours='0' \
            -f source_platform='bilibili' \
            -f auto_publish='false' \
            -f target_parts='13' \
            -f include_full='true' \
            -f prefer_live_video='true'
          echo '旧任务已停；已提交唯一精确14条V11重跑'
