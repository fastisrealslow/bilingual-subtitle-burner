name: FC production diagnose once

# Read-only active-instance inspection; never invokes the function.
on:
  push:
    branches: [main]
    paths: [.github/workflows/fc-diagnose-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 读取 FC 活跃实例
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          python - <<'PY'
          import json, os
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as api
          client=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],
            access_key_secret=os.environ['ALIYUN_SK'],
            endpoint='fcv3.'+os.environ['FC_REGION']+'.aliyuncs.com'))
          fn=client.get_function(os.environ['FC_FUNCTION_NAME'],m.GetFunctionRequest()).body
          active=client.list_instances(os.environ['FC_FUNCTION_NAME'],
            m.ListInstancesRequest(with_all_active=True,limit='100')).body
          print(json.dumps({'timeout':fn.timeout,'instances':active.to_map()},
            ensure_ascii=False,indent=2))
          PY
