name: FC isolated exact upload diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fc-diagnose-once.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: Isolated exact upload diagnostic
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: python linyuan/fc/run_exact_isolated_once.py

# cooldown retry: after Beijing midnight 2026-09-06

# web submit retry: exact part 5
