name: FC exact worker clone preflight
# Read-only inspection before creating an isolated exact-batch worker.
on:
  push:
    branches: [main]
    paths: [.github/workflows/fc-diagnose-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 只读核对克隆所需字段
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          python - <<'PY'
          import inspect,json,os
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as api
          client=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],
            access_key_secret=os.environ['ALIYUN_SK'],
            endpoint='fcv3.'+os.environ['FC_REGION']+'.aliyuncs.com'))
          body=client.get_function(os.environ['FC_FUNCTION_NAME'],m.GetFunctionRequest()).body
          data=body.to_map() if hasattr(body,'to_map') else {}
          safe={}
          for key,value in data.items():
              if key in {'environmentVariables','code'}:
                  safe[key]=sorted(value.keys()) if isinstance(value,dict) else '<omitted>'
              elif key in {'functionName','description','handler','runtime','memorySize',
                           'cpu','timeout','diskSize','instanceConcurrency','layers',
                           'role','internetAccess'}:
                  safe[key]=value
          print('CREATE_SIGNATURE='+str(inspect.signature(m.CreateFunctionInput.__init__)))
print('CODE_SIGNATURE='+str(inspect.signature(m.InputCodeLocation.__init__)))
print('CREATE_CALL='+str(inspect.signature(client.create_function)))
print('DELETE_CALL='+str(inspect.signature(client.delete_function)))
          print('SOURCE_CONFIG='+json.dumps(safe,ensure_ascii=False,default=str))
          PY
