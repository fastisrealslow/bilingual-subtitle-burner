name: FC production diagnose once

# Verify GitHub Release range semantics. This job is read-only and never calls FC.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fc-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 校验 Release 视频分段读取
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/deliver/ly-parity-v3-14-0905.final_1.mp4"
          headers="${RUNNER_TEMP}/headers.txt"
          sample="${RUNNER_TEMP}/sample.bin"
          curl -sS -fL --connect-timeout 15 --max-time 90             --range 0-1048575 -D "$headers" -o "$sample" "$url"
          sed -n '/^HTTP\//p;/^[Cc]ontent-[Rr]ange:/p;/^[Cc]ontent-[Ll]ength:/p;/^[Aa]ccept-[Rr]anges:/p' "$headers"
          size="$(stat -c %s "$sample")"
          echo "sample_bytes=$size"
          test "$size" -eq 1048576
