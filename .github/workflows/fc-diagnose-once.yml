name: FC production diagnose once

# Inspect active instances and retry the verified V4 batch after stale-rejection repair.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fc-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 读取函数非敏感运行状态
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          python - <<'PY'
          import json, os
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as open_api

          client = Client(open_api.Config(
              access_key_id=os.environ['ALIYUN_AK'],
              access_key_secret=os.environ['ALIYUN_SK'],
              endpoint=f"fcv3.{os.environ['FC_REGION']}.aliyuncs.com"))
          response = client.get_function(
              os.environ['FC_FUNCTION_NAME'], m.GetFunctionRequest())
          body = response.body
          print(json.dumps({
              'status_code': response.status_code,
              'function_name': body.function_name,
              'state': body.state,
              'state_reason': body.state_reason,
              'state_reason_code': body.state_reason_code,
              'last_update_status': body.last_update_status,
              'last_update_status_reason': body.last_update_status_reason,
              'last_update_status_reason_code': body.last_update_status_reason_code,
              'runtime': body.runtime,
              'handler': body.handler,
              'memory_size': body.memory_size,
              'cpu': body.cpu,
              'disk_size': body.disk_size,
              'timeout': body.timeout,
              'instance_concurrency': body.instance_concurrency,
              'internet_access': body.internet_access,
              'log_config': body.log_config.to_map() if body.log_config else None,
              'layers': [x.arn for x in (body.layers or [])],
              'environment_variable_names': sorted((body.environment_variables or {}).keys()),
              'code_size': body.code_size,
              'code_checksum': body.code_checksum,
              'last_modified_time': body.last_modified_time,
          }, ensure_ascii=False, indent=2))

          for label, call in (
              ('instances', lambda: client.list_instances(
                  os.environ['FC_FUNCTION_NAME'],
                  m.ListInstancesRequest(with_all_active=True, limit='100'))),
              ('async_tasks', lambda: client.list_async_tasks(
                  os.environ['FC_FUNCTION_NAME'],
                  m.ListAsyncTasksRequest(
                      qualifier='LATEST', limit=100,
                      started_time_begin=int(__import__('time').time() - 7200)))),
              ('async_config', lambda: client.get_async_invoke_config(
                  os.environ['FC_FUNCTION_NAME'],
                  m.GetAsyncInvokeConfigRequest(qualifier='LATEST'))),
          ):
              try:
                  value = call()
                  print(label + ': ' + json.dumps(
                      value.body.to_map() if value.body else {},
                      ensure_ascii=False, indent=2))
              except Exception as exc:
                  print(label + '_error: ' + repr(exc))
          PY


      - name: 重试已验证 V4 批次第1条
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: |
          python - <<'PY'
          import io, json, os
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as open_api
          from alibabacloud_tea_util import models as util_models

          client = Client(open_api.Config(
              access_key_id=os.environ['ALIYUN_AK'],
              access_key_secret=os.environ['ALIYUN_SK'],
              endpoint=f"fcv3.{os.environ['FC_REGION']}.aliyuncs.com"))
          payload = json.dumps({
              "triggerName": "publish-batch-retry",
              "batch_slug": "ly-parity-v3-14-0905",
              "batch_remaining": 1,
              "ignore_daily_limit": True,
              "source_url": "https://www.bilibili.com/video/BV1Pzug6fEyY",
              "title": "2026年8月7日林园57分钟专访",
          }).encode()
          response = client.invoke_function_with_options(
              os.environ['FC_FUNCTION_NAME'],
              m.InvokeFunctionRequest(qualifier='LATEST', body=io.BytesIO(payload)),
              m.InvokeFunctionHeaders(common_headers={
                  'x-fc-invocation-type': 'Async',
              }),
              util_models.RuntimeOptions(
                  connect_timeout=10000, read_timeout=120000))
          status = int(getattr(response, 'status_code', 202) or 202)
          print(json.dumps({"accepted": status == 202, "status_code": status}))
          if status != 202:
              raise SystemExit(f"FC async invoke rejected: HTTP {status}")
          PY
