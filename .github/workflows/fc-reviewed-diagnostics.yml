name: FC reviewed update diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/fc-reviewed-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const [run_id, expected] of [[34475136328,'263eb348b1d1a582988dea7d9c9910d64e1d2510'],[34475997562,'6b79a0088ddef08f66a7caac80e45890e2a38147']]) {
              const run = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              if (run.data.head_sha !== expected) throw new Error('Unexpected recovery run');
              if (run.data.status !== 'completed') await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
            }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: Inspect function instances without changing them
        run: |
          python - <<'PY'
          import os,json,time,io
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as api
          from alibabacloud_tea_util import models as util
          c=Client(api.Config(access_key_id=os.environ['ALIYUN_AK'],access_key_secret=os.environ['ALIYUN_SK'],endpoint='fcv3.'+os.environ['FC_REGION']+'.aliyuncs.com'))
          f=os.environ['FC_FUNCTION_NAME']
          runtime=util.RuntimeOptions(connect_timeout=20000,read_timeout=60000,autoretry=True,max_attempts=3)
          fn=c.get_function_with_options(f,m.GetFunctionRequest(qualifier='LATEST'),{},runtime).body
          print(json.dumps({'log_config':fn.log_config.to_map() if fn.log_config else None,'last_modified_time':fn.last_modified_time,'instance_concurrency':fn.instance_concurrency},ensure_ascii=False))
          r=c.list_instances_with_options(f,m.ListInstancesRequest(qualifier='LATEST',start_time_ms=1789041600000,end_time_ms=int(time.time()*1000),with_all_active=True,limit=100),{},runtime)
          before=r.body.to_map()
          print(json.dumps({'instances_before':before},ensure_ascii=False))
          response=c.invoke_function_with_options(f,m.InvokeFunctionRequest(qualifier='LATEST',body=io.BytesIO(b'{"triggerName":"diagnose-ping"}')),m.InvokeFunctionHeaders(x_fc_invocation_type='Sync'),runtime)
          body=response.body.read() if hasattr(response.body,'read') else response.body
          print(json.dumps({'ping':json.loads(body)},ensure_ascii=False))
          after=c.list_instances_with_options(f,m.ListInstancesRequest(qualifier='LATEST',with_all_active=True,limit=100),{},runtime).body.to_map()
          print(json.dumps({'instances_after':after},ensure_ascii=False))
          PY
