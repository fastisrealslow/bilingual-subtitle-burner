name: 林园完整访谈入口回归
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-full-interview-regression.yml
      - tests/test_linyuan_full_interview_recovery.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pytest 'opencv-python-headless<5' jieba requests
      - run: python -m pytest -q tests/test_linyuan_full_interview_recovery.py tests/test_linyuan_selection_incident.py tests/test_linyuan_editorial_policy.py tests/test_linyuan_headline_policy.py tests/test_linyuan_batch_isolation.py tests/test_linyuan_quality_gates.py
