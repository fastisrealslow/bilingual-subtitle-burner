name: 林园698点状字幕修复验证与恢复
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-caption-698-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: linyuan-caption-698-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 验证真实698字幕与错误时间拦截
        run: |
          python -m pip install -q pytest jieba pillow 'opencv-python-headless<5' requests
          python -m pytest -q tests/test_linyuan_caption_readability.py tests/test_linyuan_qwen_evidence.py tests/test_linyuan_caption_timeout.py
      - name: 登记同源恢复，复用母片识别并保留正常发布门禁
        run: >-
          python linyuan/register_selection_recovery.py
          --origin-slug ly-0910-663f01
          --expected-source https://www.bilibili.com/video/BV1aMCgY8EL7
          --suffix caption-time2
          --evidence-run 34472326820
