name: 林园旧库存优化最终复核
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-stock-final-inventory.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 等待本次已授权重做完成并核对发布保护
        run: python linyuan/finalize_stock_upgrade.py
      - name: 复检实际库存文件与生成版本
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q requests
          python linyuan/source_supply.py --max-new 30
          python linyuan/audit_unpublished_stock.py --out linyuan/stock-upgrade-0911-results.json
      - name: 保存最终库存及版本核查清单
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f linyuan/.automation/source_inventory.json linyuan/stock-upgrade-0911-results.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore(stock): record final audited reserve after legacy upgrades'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-upgrade-final-inventory
          path: |
            stock-upgrade-final-receipt.json
            linyuan/stock-upgrade-0911-results.json
