name: 林园旧库存优化最终复核
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-stock-final-inventory.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 等待本次已授权重做完成并核对发布保护
        run: python linyuan/finalize_stock_upgrade.py
      - name: 复检实际库存文件与生成版本
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q requests
          python linyuan/source_supply.py --max-new 30
          python linyuan/audit_unpublished_stock.py --out linyuan/stock-upgrade-0911-results.json
      - name: 保存最终库存及版本核查清单
        run: |
          python - <<'PYCODE'
          import base64,json,subprocess,time
          from pathlib import Path
          root='repos/fastisrealslow/bilingual-subtitle-burner/contents/'
          for filename in ['linyuan/.automation/source_inventory.json','linyuan/stock-upgrade-0911-results.json']:
              data=Path(filename).read_bytes()
              for attempt in range(6):
                  got=subprocess.run(['gh','api',root+filename+'?ref=main'],capture_output=True,text=True)
                  if got.returncode and '404' not in got.stderr:raise RuntimeError(got.stderr)
                  current=json.loads(got.stdout) if got.returncode==0 else {}
                  if filename.endswith('source_inventory.json') and current.get('content'):
                      old=json.loads(base64.b64decode(current['content']))
                      if old.get('updated_at',0)>=json.loads(data)['updated_at']:
                          print('Keep newer concurrent inventory');break
                  body=dict(message='chore(stock): record final audited reserve',branch='main',content=base64.b64encode(data).decode())
                  if current.get('sha'):body['sha']=current['sha']
                  saved=subprocess.run(['gh','api','--method','PUT',root+filename,'--input','-'],input=json.dumps(body),capture_output=True,text=True)
                  if saved.returncode==0:break
                  if not any(code in saved.stderr for code in ('409','422')):raise RuntimeError(saved.stderr)
                  if attempt==5:raise RuntimeError('Concurrent inventory update did not settle')
                  time.sleep(2)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-upgrade-final-inventory
          path: |
            stock-upgrade-final-receipt.json
            linyuan/stock-upgrade-0911-results.json
