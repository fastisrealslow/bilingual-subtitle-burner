name: 实际持仓与主持人未来推断 CPU 核验（不入库不投稿）
permissions:
  contents: read
  actions: read
env:
  TEXT_BACKEND: local
  LOCAL_LLM_MODEL: qwen3.5:9b
  LOCAL_LLM_TIMEOUT_SEC: '600'
  CUDA_VISIBLE_DEVICES: ''
  LINYUAN_AUTOMATIC_ONLY: 'true'
  CONTENT_POLICY: reference_v1
  LINYUAN_TITLE_DRAFT_PROFILE: production
  LINYUAN_EDITORIAL_PROFILE: baseline
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install -q jieba pillow numpy
    - uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.ollama/models
        key: ollama-qwen35-9b-v1
    - uses: actions/cache@v4
      continue-on-error: true
      with:
        path: /tmp/ollama-runtime
        key: ollama-linux-amd64-v0.33.3-c13cea8f3389db41
    - name: 同生产固定 CPU 模型，禁止云 API
      env:
        OLLAMA_VERSION: v0.33.3
        OLLAMA_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
      run: "set -euo pipefail\nmkdir -p /tmp/ollama-runtime\narchive=/tmp/ollama-runtime/ollama-linux-amd64.tar.zst\n\
        if ! echo \"${OLLAMA_SHA256}  $archive\" | sha256sum -c -; then\n  curl -fsSL --retry 8 --retry-all-errors\
        \ --retry-delay 5 --retry-max-time 300 --max-time 600 \\\n    -o /tmp/ollama-download.tar.zst\
        \ \\\n    \"https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst\"\
        \n  echo \"${OLLAMA_SHA256}  /tmp/ollama-download.tar.zst\" | sha256sum -c -\n  mv /tmp/ollama-download.tar.zst\
        \ \"$archive\"\nfi\nsudo tar --zstd -xf \"$archive\" -C /usr\nOLLAMA_HOST=127.0.0.1:11434 OLLAMA_KEEP_ALIVE=24h\
        \ OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_NUM_PARALLEL=1 \\\n  ollama serve > /tmp/ollama.log 2>&1\
        \ &\nfor _ in $(seq 1 30); do\n  curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break\n\
        \  sleep 1\ndone\ncurl -fsS http://127.0.0.1:11434/api/tags >/dev/null\nollama pull \"$LOCAL_LLM_MODEL\"\
        \nollama show \"$LOCAL_LLM_MODEL\" >/dev/null\npython -c 'import json,os; print(json.dumps(dict(model=os.environ[\"\
        LOCAL_LLM_MODEL\"],messages=[dict(role=\"user\",content=\"Reply ready\")],stream=False,think=False,options=dict(temperature=0,num_predict=8,num_ctx=16384))))'\
        \ > /tmp/ollama-warmup.json\ncurl -fsS --max-time 600 http://127.0.0.1:11434/api/chat \\\n  -H\
        \ 'Content-Type: application/json' --data-binary @/tmp/ollama-warmup.json \\\n  | python -c 'import\
        \ json,sys; assert (json.load(sys.stdin).get(\"message\") or {}).get(\"content\")'\n"
    - name: 自动派生真实新转写候选，核对角色、否认假设和实际标题
      timeout-minutes: 40
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -u linyuan/check_primary_company_holding.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: primary-company-holding-check
        path: primary-company-holding-check/
        if-no-files-found: error
'on':
  push:
    branches:
    - fix/source-bound-asr-model-pilot-20261024
    paths:
    - linyuan/check_primary_company_holding.py
    - linyuan/publishing_experiment.py
    - .github/workflows/linyuan-primary-holding-check.yml
concurrency:
  group: primary-holding-cpu-${{ github.ref }}
  cancel-in-progress: true
