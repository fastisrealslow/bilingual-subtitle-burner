name: 正式出片工具安装有界实测（不生产不投稿）
on:
  push:
    branches: [codex/linyuan-production-setup-budget-20261022, codex/linyuan-media-tools-runtime-20261023]
    paths: [linyuan/ci_install_media_tools.sh, .github/workflows/linyuan-produce-cn.yml, .github/workflows/linyuan-production-setup-check.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: 执行与正式生产完全相同的工具安装和字体核验
        run: bash linyuan/ci_install_media_tools.sh
      - name: 已安装的工具再次验证，禁止重复依赖网络
        run: bash linyuan/ci_install_media_tools.sh
