name: Expanded seeds full CPU acceptance
run-name: Expanded seeds full CPU acceptance · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linyuan-seed-acceptance.yml
      - linyuan/simulations/seed-expansion-acceptance-20260918.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '201,202,203,204,205,206'
      manifest_path: simulations/seed-expansion-acceptance-20260918.json
    secrets: inherit
