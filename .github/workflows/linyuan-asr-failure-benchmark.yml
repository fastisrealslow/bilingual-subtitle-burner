name: 数字转写失败真实音频双模型对照（不入库不投稿）
on:
  push:
    branches: [codex/linyuan-asr-failure-benchmark-20261022]
    paths:
      - linyuan/asr_failure_benchmark.py
      - tests/test_linyuan_asr_failure_benchmark.py
      - .github/workflows/linyuan-asr-failure-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [fund, percentage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装实际音频取源与解码依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install yt-dlp
      - name: 原母片缓存键（只读复用，不占用生产下载位）
        id: cache_key
        env:
          CASE: ${{ matrix.case }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,os,sys
          sys.path.insert(0,'linyuan')
          from asr_failure_benchmark import CASES
          print('key='+hashlib.sha256(CASES[os.environ['CASE']]['url'].encode()).hexdigest())
          PY
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: linyuan/_src/
          key: source-download-v1-${{ steps.cache_key.outputs.key }}-diagnostic-only
          restore-keys: source-download-v1-${{ steps.cache_key.outputs.key }}-
      - name: 核对原视频及完整PCM，再提取原始识别窗口和对照
        env:
          GH_TOKEN: ${{ github.token }}
          CASE: ${{ matrix.case }}
        run: python -u linyuan/asr_failure_benchmark.py prepare --case "$CASE"
      - uses: actions/upload-artifact@v4
        with:
          name: asr-failure-audio-${{ matrix.case }}
          path: asr-failure-audio/${{ matrix.case }}/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [0.6b, 1.7b]
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: asr-failure-audio-fund
          path: asr-failure-audio/fund
      - uses: actions/download-artifact@v4
        with:
          name: asr-failure-audio-percentage
          path: asr-failure-audio/percentage
      - name: 安装CPU识别依赖（不启动文本模型）
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install qwen-asr==0.0.6
      - name: 相同PCM、相同上下文、相同CPU配置的独立假设对照
        env:
          MODEL: ${{ matrix.model }}
        run: python -u linyuan/asr_failure_benchmark.py infer --model "$MODEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-failure-hypotheses-${{ matrix.model }}
          path: asr-failure-result/hypotheses.json
          retention-days: 30
          if-no-files-found: warn
