name: 林园审核修复实产验收
# Recovery revision 7: produce a distinct source interval requested by the user.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-editorial-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: linyuan-editorial-recovery
  cancel-in-progress: false
jobs:
  verify-and-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 审核预算、原文证据及质量门禁回归
        run: |
          python -m pip install -q pytest opencv-python-headless jieba
          python -m pytest -q tests/test_linyuan_quality_gates.py tests/test_linyuan_editorial_policy.py tests/test_linyuan_curated_editorial.py tests/test_linyuan_batch_isolation.py tests/test_linyuan_source_supply.py
      - name: 验证新选段原文字幕分屏
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34216194380 -n editorial-ly-e2e-local-0908 -D /tmp/caption-source
          python linyuan/replay_caption_boundaries.py /tmp/caption-source --source-sha a7c6c8ccefd617c019f215f817c46379626008ec51da2f8ad215bfc217148b9b --start-cue 422 --end-cue 460 --duration 129.60
      - name: 生产稀缺性新选段（排除已发布片段）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run linyuan-produce-cn.yml --ref main \
            -f source=https://www.bilibili.com/video/BV1tuCDBhE6C \
            -f slug=ly-new-scarcity-0909 -f speaker=林园 \
            -f occasion=林园投资演讲 -f source_platform=bilibili \
            -f local_text_model=qwen3:4b-instruct-2507-q4_K_M \
            -f auto_publish=false -f include_full=false -f reviewed_parts=2
          echo '已触发中文源出片；本工作流成功仅表示回归通过及任务已调度，不代表成片验收通过。' >> "$GITHUB_STEP_SUMMARY"
