name: 林园监控 · 每日抓取

# 日常抓取包含来源溯源、持久化重试与媒体证据；正式出片仍由生产工作流执行。
#
# 视频不进仓库：GitHub 仓库软限制 1GB、单文件 100MB，而素材动辄数 GB。
# 需要视频时由 produce-cn.yml 现取现用。

on:
  schedule:
    # 每两小时提前补源；不能等发布窗口才发现候选耗尽。
    - cron: '17 */2 * * *'
  # Editing this workflow is also an explicit, auditable way to perform an
  # immediate refresh when GitHub's scheduled delivery is late.  Other source
  # or state commits do not retrigger the crawler.
  push:
    branches: [main]
    # Source discovery fixes/config changes should prove themselves immediately
    # and refill FC from their refreshed data, not wait for the next cron slot.
    paths:
      - .github/workflows/linyuan-monitor.yml
      - linyuan/monitor_v2.py
      - linyuan/weibo_media.py
      - linyuan/persist_monitor_metadata.sh
      - linyuan/monitor_v2_config.json
      - linyuan/weibo_seeds.json
      - linyuan/douyin_seeds.json
      - linyuan/haokan_seeds.json
      - linyuan/yicai_seeds.json
      - linyuan/source_gap_backfill.py
      - linyuan/source_research.py
      - linyuan/source_lineage.json
  workflow_dispatch:
    inputs:
      refresh_up_list:
        description: '同时刷新 B站 UP 主视频清单（对标基准）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false     # 抓一半被取消会留下半截状态

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: linyuan

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pdftotext 用来解析股东大会公告 PDF，提取会议时间地点 ——
      # 这是「比二创早 3 周」那个提前量的来源，缺了整块能力就没了
      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ffmpeg
          python -m pip install -q pytest yt-dlp

      - name: 来源自动重试回归
        working-directory: .
        run: python -m pytest -q tests/test_linyuan_source_gap_backfill.py tests/test_linyuan_source_research.py tests/test_linyuan_weibo_video_source.py

      - name: 优先抓取可核验的官方与精确视频源
        timeout-minutes: 5
        continue-on-error: true
        run: python -u monitor_v2.py --source-types yicai_video weibo_video

      - name: 即时提交优先渠道结果（不等待慢搜索）
        run: |
          bash persist_monitor_metadata.sh 'chore(monitor): checkpoint exact video sources for early refill'

      - name: 优先渠道立即触发实际库存核验和补库
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/linyuan-source-inventory.yml/dispatches" -f ref=main

      - name: 恢复已核验来源证据
        uses: actions/cache/restore@v4
        with:
          path: linyuan/.source-research-cache
          key: source-research-v1-${{ github.run_id }}
          restore-keys: source-research-v1-

      - name: 更新参考目录与来源对应关系
        run: python -u source_gap_backfill.py

      - name: 自动补源、重试下载并比对实际音频
        timeout-minutes: 20
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python -u source_research.py --max-items 3 --max-queries 3 --download-budget 300

      - name: 保存来源核验缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: linyuan/.source-research-cache
          key: source-research-v1-${{ github.run_id }}

      - name: 留存本轮来源证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-research-evidence-${{ github.run_id }}
          path: /tmp/source-research-evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: 接口健康巡检
        id: health
        continue-on-error: true       # 巡检失败不该挡住抓取，但要留痕
        run: python3 healthcheck.py

      - name: 抓取全部源
        timeout-minutes: 18
        continue-on-error: true
        id: fetch
        run: |
          set -o pipefail
          rm -f monitor_v2_state.json
          python3 -u monitor_v2.py 2>&1 | tee /tmp/fetch.log
          echo "new=$(grep -oP '总计新增: \K\d+' /tmp/fetch.log || echo 0)" >> $GITHUB_OUTPUT

      - name: 刷新 UP 主清单
        if: inputs.refresh_up_list
        continue-on-error: true
        run: python3 fetch_up_list.py

      - name: 能力回测
        continue-on-error: true
        run: python3 backtest.py 2>&1 | tee /tmp/backtest.log

      - name: 合并来源证据并导出最新台账
        if: always()
        run: python -u source_gap_backfill.py --offline

      - name: 提交元数据变更
        if: always()
        run: |
          bash persist_monitor_metadata.sh 'chore(monitor): update discovery and persistent source research'

      - name: 报告抓取失败（已保存可恢复的补库进度）
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo '::error::常规抓取未完整完成，已提交成功渠道结果及来源重试队列；查看抓取日志。'
          exit 1

      # Completion triggers inventory verification. FC refills every 30 minutes
      # from current data and real reserve; a crawl no longer redeploys code.

      - name: 摘要
        if: always()
        run: |
          {
            echo "## 抓取结果"
            echo '```'
            grep -aE "模式|抓取成功|过滤|复用|新增:|总计" /tmp/fetch.log 2>/dev/null | head -30
            echo '```'
            if [ -f /tmp/backtest.log ]; then
              echo "## 回测"
              echo '```'
              tail -14 /tmp/backtest.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs-${{ github.run_number }}
          path: |
            /tmp/fetch.log
            /tmp/backtest.log
            linyuan/.automation/source_research_report.json
          retention-days: 14
          if-no-files-found: ignore
