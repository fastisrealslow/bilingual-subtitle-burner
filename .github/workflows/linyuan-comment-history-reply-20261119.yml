              def required(data):
                  if data is None:
                      raise ValueError("read_failed")
                  return data
              def find_root(aid, root):
                  data = required(get("/x/v2/reply", type=1, oid=aid, pn=1, ps=20, sort=0))
                  return next((r for r in data.get("replies") or [] if str(r.get("rpid")) == root), None)
              def children(aid, root):
                  t = required(get("/x/v2/reply/reply", type=1, oid=aid, root=root, pn=1, ps=20))
