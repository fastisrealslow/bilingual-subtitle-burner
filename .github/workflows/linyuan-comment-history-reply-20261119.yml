                      emit("skipped", root=root, reason="video_mismatch")
                      continue
                  row = find_root(aid, root)
                  if not row or str(row.get("mid")) == OWNER or not (row.get("content") or {}).get("message","").startswith(expected):
                      emit("skipped", root=root, reason="root_mismatch")
                      continue
                  n = int(row.get("rcount") or 0)
