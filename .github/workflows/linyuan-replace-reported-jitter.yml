name: 原位修复用户报告的可转债视频抖动
on:
  push:
    branches: [codex/linyuan-replace-jitter-20261015]
    paths: [.github/workflows/linyuan-replace-reported-jitter.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: linyuan-repair-BV1UEpC6bEQB
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TEXT_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -r requirements-dev.txt rapidocr-onnxruntime biliup
      - name: 单目标替换安全回归
        run: |
          python -m pytest -q tests/test_linyuan_tracking_replacement.py tests/test_linyuan_constrained_framing.py tests/test_linyuan_stable_framing.py tests/test_linyuan_reviewed_updates.py tests/test_linyuan_state_merge.py
          pip install yt-dlp==2026.8.19
          python -m pytest -q tests/test_linyuan_*.py tests/test_fc_deploy_code.py --tb=short
      - name: 取得原投稿文件与相同哈希母片（不重新识别、不改原话）
        run: |
          gh run download 38449197154 --repo "$GITHUB_REPOSITORY" --name deliver-ly-1013-5a1382 --dir /tmp/reported-original
          gh run download 38449197154 --repo "$GITHUB_REPOSITORY" --name editorial-ly-1013-5a1382 --dir /tmp/reported-editorial
          gh run download 38449197154 --repo "$GITHUB_REPOSITORY" --name mother-media-f6039845aad95adf33c6b3b86e520fa91298dbce5b1951fca33147026f6085dd --dir /tmp/reported-mother
      - name: 同区间重新取景并独立两次复验实际成片
        run: >-
          python -u linyuan/build_tracking_revision.py
          --original /tmp/reported-original --source /tmp/reported-mother/video.mp4
          --editorial /tmp/reported-editorial --output /tmp/reported-fixed
      - name: 上传本次修复的完整成片与核验证据
        uses: actions/upload-artifact@v4
        with:
          name: tracking-revision-BV1UEpC6bEQB
          path: /tmp/reported-fixed
          include-hidden-files: true
          retention-days: 30
      - name: 只编辑原稿，持久化上传和编辑回执，禁止新增投稿
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python -u linyuan/replace_reported_tracking.py --directory /tmp/reported-fixed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tracking-revision-failure-BV1UEpC6bEQB
          path: /tmp/reported-fixed
          retention-days: 14
