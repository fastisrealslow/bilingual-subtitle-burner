name: 复验已完成普通回退原文件（不重出片不投稿）
on:
  push:
    branches: [fix/story-failure-baseline-backups-20261023]
    paths: [.github/workflows/linyuan-story-backup-validate-existing.yml, scripts/check_actual_story_backup_media.py]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装正式文件检查依赖
        run: |
          bash linyuan/ci_install_media_tools.sh
          python -m pip install -q requests pillow jieba numpy 'opencv-python-headless<5'
      - name: 读取实际完成任务的原始文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS --retry 2 --max-time 240 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12511167324/zip" -o /tmp/actual-backup-render.zip
      - name: 对原MP4、字幕、封面与元数据做正式完整复验
        run: python scripts/check_actual_story_backup_media.py /tmp/actual-backup-render.zip actual-backup-file-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-backup-original-file-validation
          path: actual-backup-file-validation/
          if-no-files-found: error
          retention-days: 30
