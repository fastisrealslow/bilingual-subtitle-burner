  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-packaging-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '7,39'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
