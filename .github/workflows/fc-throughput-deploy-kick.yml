name: FC throughput deploy kick

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fc-throughput-deploy-kick.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy optimized FC code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run fc-production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'FC production deploy dispatched'
