name: 国内原位替换已验收的抖动修复版
on:
  # Historical one-shot repair, not a recurring deployment hook. Repeating
  # its immutable async task produces 409; do not evade that guard with a new ID.
  workflow_dispatch:
permissions:
  contents: write  # Only exact stopped-worker lease cleanup; media state is written by FC.
  actions: write  # Cancel only the positively identified pre-edit overseas attempt.
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 国内接管前停止唯一仍未编辑原稿的旧上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u linyuan/stop_prior_tracking_upload.py
      - name: 国内执行并回读唯一原稿，不增加发布数量
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
          FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
        run: python -u linyuan/fc/invoke_tracking_revision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-revision-mainland-receipt
          path: tracking-revision-verification.json
          retention-days: 30
