    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-visual-question-cards.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
