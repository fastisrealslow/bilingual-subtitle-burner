name: 人感简介与现场封面上线前回归
on:
  push:
    branches: [codex/linyuan-human-copy-scenes-20261017]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk libchromaprint-tools
      - run: pip install -q pytest numpy pillow requests jieba fonttools 'opencv-python-headless<5'
      - name: 简介时间、现场封面、标题字幕与线上包回归，不投稿
        run: >-
          python -m pytest -q tests/test_linyuan_human_scene_cover.py
          tests/test_linyuan_speech_dates.py tests/test_linyuan_audience_copy.py
          tests/test_linyuan_cover* tests/test_linyuan_scene_selection.py
          tests/test_linyuan_editorial_iteration.py tests/test_linyuan_fc_package.py
          tests/test_fc_deploy_code.py tests/test_linyuan_title*
          tests/test_linyuan_click_packaging.py tests/test_linyuan_presentation.py
          tests/test_linyuan_caption_lines.py tests/test_linyuan_quality_gates.py
