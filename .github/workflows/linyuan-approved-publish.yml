name: 林园已验收成片发布

on:
  push:
    branches: [main]
    paths:
      - linyuan/.automation/publish_request.json

permissions:
  contents: read

concurrency:
  group: linyuan-approved-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 境内发布并等待真实回执
        run: python -u linyuan/fc/publish_approved.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-publish-receipt
          path: approved-publish-receipt.json
          if-no-files-found: warn
