name: 实验公开播放读取实测（不采样不投稿）
on:
  push:
    branches: [codex/linyuan-experiment-observation-clock-20261023]
    paths: [linyuan/collect_experiment_stats.py, linyuan/bili_archive_status.py, .github/workflows/linyuan-experiment-observation-check.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 已授权创作中心只读实测，不登记采样
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: python linyuan/collect_experiment_stats.py --probe-bvid BV1rLnC6CEyx
