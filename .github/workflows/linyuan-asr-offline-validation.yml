name: 林园离线 ASR 上线验收
on:
  workflow_dispatch:
  push:
    branches: [fix/cpu-offline-asr]
    paths:
      - linyuan/produce_cn.py
      - linyuan/validate_asr_offline.py
      - tests/test_linyuan_asr_integrity.py
      - .github/workflows/linyuan-asr-offline-validation.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      ASR_CPU_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
          pip install pytest numpy pillow 'opencv-python-headless<5' jieba sherpa-onnx huggingface_hub
      - name: Verify subtitle integrity and existing visual gates
        run: >-
          python -m pytest -q tests/test_linyuan_asr_integrity.py
          tests/test_linyuan_subtitle_cover_regressions.py
          tests/test_linyuan_presentation.py tests/test_linyuan_clean_source_plan.py
          tests/test_linyuan_quality_gates.py tests/test_linyuan_batch_isolation.py
          -k 'not test_review_paused_batch_cannot_publish'
      - name: Decode full production clips offline and verify cache and timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u linyuan/validate_asr_offline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-asr-validation
          path: |
            asr-validation/validation.json
            asr-validation/*.srt
            asr-validation/interview-full/*.json
            asr-validation/shareholder-full/*.json
          retention-days: 90
