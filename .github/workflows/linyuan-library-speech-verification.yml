name: 素材库完整短问答与口语开头验证（204、208、212，单列修复）
on:
  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-library-speech-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '204,208,212'
      manifest_path: simulations/library20-20260921.json
      content_policy: reference_v1
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
