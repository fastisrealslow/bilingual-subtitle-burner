name: Export third reviewed source
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-third-source-export.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Inspect available source caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("source-download")) | {key,ref,size_in_bytes}'
      - uses: actions/cache/restore@v4
        with:
          path: linyuan/_src/
          key: source-download-v1-0e87a0f5eace2d0141d9794024ab5ca4c53dad95e120a71fcafd22c797b27983-export
          restore-keys: source-download-v1-0e87a0f5eace2d0141d9794024ab5ca4c53dad95e120a71fcafd22c797b27983-
      - name: Install media reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp requests
      - name: Recover original source if cache has expired
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          if ! test -s linyuan/_src/video.mp4; then
            python -u linyuan/ci_fetch_bilibili.py --url https://www.bilibili.com/video/BV1JWQWYKEy6 --out linyuan/_src/video.mp4 --budget-seconds 3600
          fi
      - name: Verify cached source and export exact reviewed range
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          mkdir -p third-source
          python - <<'PY'
          import hashlib,pathlib,json,subprocess
          src=pathlib.Path('linyuan/_src/video.mp4')
          digest=hashlib.file_digest(src.open('rb'),'sha256').hexdigest()
          expected='58371b9c7b0693310ac6704258565f48e1507a0bb6736c289ad0c5a92497d604'
          if digest!=expected: raise SystemExit('Cached source differs from the published source')
          metadata=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(src)]))
          pathlib.Path('third-source/source-proof.json').write_text(json.dumps({'source_sha256':digest,'source_url':'https://www.bilibili.com/video/BV1JWQWYKEy6','start':1267.56,'end':1505.4,'media':metadata},ensure_ascii=False,indent=2))
          PY
          ffmpeg -y -v error -ss 1267.56 -i linyuan/_src/video.mp4 -t 237.84 -map 0:v:0 -map 0:a:0 -c:v libx264 -crf 16 -preset fast -c:a flac third-source/source-excerpt.mkv
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-third-source
          path: third-source/
          compression-level: 0
          retention-days: 7

