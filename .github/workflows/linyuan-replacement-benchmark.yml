# Freeze a fresh whole-batch measurement of the candidate's production defaults.
# Title-only/layout-only diagnostics are intentionally not added to this score.
name: 候选版本完整100素材回归（不投稿）
on:
  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-replacement-benchmark.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all100:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: ''
      content_policy: reference_v1
      title_draft_profile: production
      recovery_run_id: '35833967072'
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
