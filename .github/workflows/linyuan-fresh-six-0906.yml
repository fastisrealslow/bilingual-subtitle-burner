name: 林园今日新六条实产
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-fresh-six-0906.yml]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: 重新生产已核验真人长访谈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run linyuan-produce-cn.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source=https://www.bilibili.com/video/BV1kJuu6XEMS \
            -f slug=ly-fresh-six-0906-01 -f speaker=林园 \
            -f occasion=今日新六条真人访谈 -f source_platform=bilibili \
            -f delay_hours=0 -F auto_publish=false -f target_parts=0 \
            -F include_full=false -F prefer_live_video=true
