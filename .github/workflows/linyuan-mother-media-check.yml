name: 林园806断点择优下载实测
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-mother-media-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_URL: https://www.bilibili.com/video/BV19P4y1m77K?p=35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: linyuan/_src/
          key: source-download-v1-0be23b7f0bf4a41655de79cca4b6fe76a3e0c898c2c01fbf5f52abd24c796b5b-mirror-resume-${{ github.run_id }}
          restore-keys: source-download-v1-0be23b7f0bf4a41655de79cca4b6fe76a3e0c898c2c01fbf5f52abd24c796b5b-
      - name: 用有界Range持续下载同一高清流的已保存断点
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          python -u linyuan/ci_fetch_bilibili.py --url "$SOURCE_URL" --out linyuan/_src/video.mp4 --budget-seconds 1200 --failure-report /tmp/source-fetch-report.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linyuan/_src/
          key: source-download-v1-0be23b7f0bf4a41655de79cca4b6fe76a3e0c898c2c01fbf5f52abd24c796b5b-mirror-resume-${{ github.run_id }}
      - name: 核对实际完整音视频与母片哈希
        run: |
          python - <<'PY'
          import sys,os,json
          sys.path.insert(0,'linyuan')
          from mother_media_cache import verified
          from ci_fetch_bilibili import validate_media
          assert verified('linyuan/_src',os.environ['SOURCE_URL'])
          data=json.load(open('linyuan/_src/video.mp4.source.json'))
          media=validate_media('linyuan/_src/video.mp4')
          print(json.dumps(dict(size=data['size'],sha256=data['sha256'],media=media),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mother-media-0be23b7f0bf4a41655de79cca4b6fe76a3e0c898c2c01fbf5f52abd24c796b5b
          path: |
            linyuan/_src/video.mp4
            linyuan/_src/video.mp4.source.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
