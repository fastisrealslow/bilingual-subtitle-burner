name: 每日四条真实恢复验收
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stable-four-recovery.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stable-four-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 归还恢复任务登记期间被自动补源抢占的第七个名额
        run: |
          gh run cancel 34759030883 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 34758729804 --repo "$GITHUB_REPOSITORY" || true
      - name: 等待一个生产名额
        run: |
          python - <<'PY'
          import json,subprocess,time,sys
          sys.path.insert(0,'linyuan')
          from register_selection_recovery import read_state
          if any(e.get('slug')=='ly-0912-5dc339-stable-clean-proof-portrait' for e in read_state()[1].get('dispatched',[])):
              raise SystemExit(0)
          for _ in range(16):
              active=sum(len(json.loads(subprocess.check_output(['gh','api','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/workflows/linyuan-produce-cn.yml/runs?status='+status+'&per_page=100']))['workflow_runs']) for status in ('in_progress','queued'))
              if active<6:break
              time.sleep(20)
          else:raise SystemExit('Six source tasks remain active; no duplicate dispatch')
          PY
      - name: 复用原始ASR与已经选定的区间，重新验证真人竖屏
        run: >-
          python linyuan/register_selection_recovery.py
          --origin-slug ly-0912-5dc339
          --expected-source https://www.bilibili.com/video/BV1hj411X7BL
          --suffix stable-clean-proof-portrait
          --output-layout portrait
          --evidence-run 34755308322
          --selected-parts 2,4
