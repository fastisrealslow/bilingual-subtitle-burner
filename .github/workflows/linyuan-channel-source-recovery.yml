name: 素材311保留原始左声道后的完整出片复验（不投稿）
on:
  push:
    branches: [codex/linyuan-reliability-packaging]
    paths: [.github/workflows/linyuan-channel-source-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/linyuan-simulate-100.yml
    with:
      sample_ids: '311'
      manifest_path: simulations/library17-20260923.json
      content_policy: reference_v1
    secrets:
      BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
