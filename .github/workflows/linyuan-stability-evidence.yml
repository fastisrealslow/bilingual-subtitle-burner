name: 林园稳定性故障证据
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stability-evidence.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 保存805人物失败帧及818原始字幕计时证据
        run: |
          gh run download 34756033917 --repo "$GITHUB_REPOSITORY" --name render-evidence-ly-0913-be3bb0 --dir /tmp/failure-evidence/805
          gh run download 34761171240 --repo "$GITHUB_REPOSITORY" --name editorial-ly-0912-5dc339-reserve-13-portrait --dir /tmp/failure-evidence/818
          cd /tmp/failure-evidence
          zip -qr /tmp/failure805-818.zip 805 818
          gh release upload stability-0913 /tmp/failure805-818.zip --repo "$GITHUB_REPOSITORY" --clobber
