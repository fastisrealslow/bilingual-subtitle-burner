name: 林园稳定性故障证据
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stability-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 读取实际CPU计算检查点
        run: |
          gh run download 34760249532 --repo "$GITHUB_REPOSITORY" --name title-claim-verification --dir /tmp/cpu154
          gh run download 34762401393 --repo "$GITHUB_REPOSITORY" --name title-proof-reuse --dir /tmp/cpu156
          python - <<'PY'
          import json
          from pathlib import Path
          print('RESUME_PROVENANCE',Path('/tmp/cpu156/title-proof-reuse.json').read_text())
          for path in sorted(Path('/tmp/cpu154').rglob('*.json')):
              if '.llm_cache' not in path.parts:continue
              data=json.loads(path.read_text())
              print('ACTUAL_CPU_RESPONSE',json.dumps(dict(file=path.name,model=data.get('model'),content=data.get('content')),ensure_ascii=False))
          PY
