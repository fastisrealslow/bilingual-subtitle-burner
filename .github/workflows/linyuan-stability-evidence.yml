name: 林园稳定性故障证据
on:
  push:
    branches: [main]
    paths: [.github/workflows/linyuan-stability-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检查158实际原文阅读和候选响应
        run: |
          gh run download 34763327956 --repo "$GITHUB_REPOSITORY" --name title-claim-verification --dir /tmp/title-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('/tmp/title-evidence').rglob('*.json')):
              if '.llm_cache' not in str(path):continue
              data=json.loads(path.read_text())
              print(json.dumps(dict(file=path.name,backend=data.get('backend'),model=data.get('model'),response=data.get('content',data.get('response'))),ensure_ascii=False))
          PY
