name: 林园单批连续投稿

on:
  workflow_dispatch:
    inputs:
      slug:
        description: '只投稿这个已完成 slug'
        required: true
        type: string
      total:
        description: '本批总投稿数'
        required: true
        default: '14'
        type: string
  workflow_run:
    workflows: ['中文源出片']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: linyuan-publish-batch-${{ inputs.slug }}
  # 仅本次已授权 V4 批次允许新运行替换超时旧运行，避免并发投稿。
  cancel-in-progress: ${{ inputs.slug == 'ly-parity-v3-14-0905' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}
      FC_FUNCTION_NAME: ${{ vars.FC_FUNCTION_NAME || 'fc-develop' }}
      BATCH_SLUG: ${{ inputs.slug || 'ly-parity-v3-14-0905' }}
      BATCH_TOTAL: ${{ inputs.total || '14' }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q alibabacloud-fc20230330 alibabacloud-tea-openapi
      - name: 仅接管指定14条生产批次
        id: target
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "${{ github.event.workflow_run.conclusion }}" = success && \
             gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/artifacts" \
               --jq '.artifacts[].name' | grep -Fxq "deliver-$BATCH_SLUG"; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: 为旧批次补齐逐条封面
        if: github.event_name == 'workflow_run' && steps.target.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          first_cover="https://github.com/${GITHUB_REPOSITORY}/releases/download/deliver/${BATCH_SLUG}.cover_1.jpg"
          if curl -sfIL "$first_cover" >/dev/null; then
            echo '逐条封面已在 Release，无需补传'
            exit 0
          fi
          source_dir="$RUNNER_TEMP/source-delivery"
          release_dir="$RUNNER_TEMP/release-covers"
          mkdir -p "$source_dir" "$release_dir"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "deliver-$BATCH_SLUG" --dir "$source_dir"
          while IFS= read -r -d '' cover; do
            cp "$cover" "$release_dir/${BATCH_SLUG}.$(basename "$cover")"
          done < <(find "$source_dir" -type f -name 'cover*.jpg' -print0)
          test -n "$(find "$release_dir" -type f -name '*.jpg' -print -quit)"
          gh release upload deliver "$release_dir"/*.jpg --clobber \
            --repo "$GITHUB_REPOSITORY"
      - name: 分批调用境内投稿器
        if: github.event_name == 'workflow_dispatch' || steps.target.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, time, urllib.request
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_fc20230330 import models as m
          from alibabacloud_tea_openapi import models as open_api
          from alibabacloud_tea_util import models as util_models

          config = open_api.Config(
              access_key_id=os.environ["ALIYUN_AK"],
              access_key_secret=os.environ["ALIYUN_SK"],
              endpoint=f"fcv3.{os.environ['FC_REGION']}.aliyuncs.com")
          config.connect_timeout = 10000
          config.read_timeout = 120000
          client = Client(config)

          slug = os.environ["BATCH_SLUG"]
          total = int(os.environ["BATCH_TOTAL"])

          def published_parts():
              url = ("https://api.github.com/repos/"
                     f"{os.environ['GITHUB_REPOSITORY']}/contents/"
                     "linyuan/.automation/fc_state.json?ref=main")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github.raw",
                  "Cache-Control": "no-cache",
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  state = json.loads(response.read().decode())
              for item in state.get("dispatched", []):
                  if item.get("slug") == slug:
                      return int(item.get("published_parts", 0))
              return 0

          completed = published_parts()
          print(f"批次当前进度：{completed}/{total}", flush=True)
          while completed < total:
              payload = json.dumps({
                  "triggerName": "publish-batch",
                  "batch_slug": slug,
                  # 一次 FC 调用只投一条：失败只重试当前 part，不在函数内递归上传。
                  "batch_remaining": 1,
                  "ignore_daily_limit": True,
                  "source_url": "https://www.bilibili.com/video/BV1Pzug6fEyY",
                  "title": "2026年8月7日林园57分钟专访",
              }).encode()
              accepted = False
              headers = m.InvokeFunctionHeaders(common_headers={
                  "x-fc-invocation-type": "Async",
              })
              for attempt in range(1, 6):
                  try:
                      response = client.invoke_function_with_options(
                          os.environ["FC_FUNCTION_NAME"],
                          m.InvokeFunctionRequest(
                              qualifier="LATEST",
                              body=io.BytesIO(payload)),
                          headers,
                          util_models.RuntimeOptions(
                              connect_timeout=10000,
                              read_timeout=120000))
                      status = int(getattr(response, "status_code", 202) or 202)
                      if status != 202:
                          raise RuntimeError(f"异步调用未被接受，HTTP {status}")
                      accepted = True
                      break
                  except Exception as exc:
                      if attempt == 5:
                          raise
                      wait_seconds = attempt * 15
                      print(f"阿里 FC 异步提交失败（第 {attempt}/5 次）：{exc}；"
                            f"{wait_seconds} 秒后重试", flush=True)
                      time.sleep(wait_seconds)
              if not accepted:
                  raise SystemExit(f"阿里 FC 未接受第 {completed + 1} 条任务")

              # 同步调用会在约 60 秒被网关以 503 中断；异步提交立即返回 202，
              # 再通过 FC 写回的 published_parts 等待真实 B 站回执。只有进度增加
              # 才提交下一条，避免 14 条并发和超时后的重复投稿。
              target = completed + 1
              print(f"阿里 FC 已接收第 {target}/{total} 条，等待 B 站回执", flush=True)
              deadline = time.time() + 45 * 60
              while time.time() < deadline:
                  time.sleep(15)
                  current = published_parts()
                  if current >= target:
                      completed = current
                      print(f"B 站已确认：{completed}/{total}", flush=True)
                      break
              else:
                  raise SystemExit(
                      f"等待第 {target}/{total} 条回执超过 45 分钟；"
                      "未自动重投，以免重复投稿")
          print(f"投稿完成：{completed}/{total}")
          PY
