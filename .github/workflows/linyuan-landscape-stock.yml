name: 林园首批横屏试产
# First clip accepted; remove the second clip's transient source-caption edge.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linyuan-landscape-stock.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: linyuan-landscape-stock
  cancel-in-progress: true
jobs:
  landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: [ly-0909-2e376f-wide0911]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 验证字幕时间、画幅和真实画面检查
        run: |
          pip install -q pytest jieba pillow numpy 'opencv-python-headless<5' rapidocr-onnxruntime
          python -m pytest -q tests/test_linyuan_landscape.py tests/test_linyuan_presentation.py tests/test_stock_upgrade.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/cache@v4
        with:
          path: /tmp/linyuan-face-models
          key: linyuan-local-face-v1
      - name: 复用已验收成片，重排并复检实际横版
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          UPGRADE_SLUG: ${{ matrix.slug }}
        run: python -u linyuan/run_landscape_stock.py --slug "$UPGRADE_SLUG"
      - uses: actions/upload-artifact@v4
        with:
          name: deliver-${{ matrix.slug }}
          path: linyuan/deliver/${{ matrix.slug }}/_accepted/
          retention-days: 90
          if-no-files-found: error
      - name: 保存横版长期下载链接
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deliver-${{ matrix.slug }}
          name: 成品库 · ${{ matrix.slug }}
          files: linyuan/deliver/${{ matrix.slug }}/_accepted/${{ matrix.slug }}.*
      - name: 再次核对未发布状态后入库
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_SLUG: ${{ matrix.slug }}
        run: python linyuan/run_landscape_stock.py --slug "$UPGRADE_SLUG" --admit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-receipt-${{ matrix.slug }}
          path: stock-upgrade-receipt.json
  refresh:
    needs: landscape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 更新库存
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linyuan-source-inventory.yml --repo "$GITHUB_REPOSITORY" --ref main
