name: 林园新版10条园园对齐验收

on:
  push:
    paths:
      - '.github/workflows/linyuan-ten-sample-review.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-ten:
    runs-on: ubuntu-latest
    steps:
      - name: 挑10个不同母素材并触发新版验收
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          repo='fastisrealslow/bilingual-subtitle-burner'
          H={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/linyuan/.automation/fc_state.json',headers=H)
          state=json.loads(base64.b64decode(json.load(urllib.request.urlopen(req))['content']))
          pool=[]; seen=set()
          for item in reversed(state.get('dispatched',[])):
            url=item.get('asset_url') or item.get('source_url'); key=item.get('video_id') or url
            if not url or not key or key in seen or 'parity' in (item.get('slug') or ''): continue
            seen.add(key); pool.append(item)
            if len(pool)>=10: break
          if len(pool)<10: raise SystemExit(f'不同母素材不足10个：{len(pool)}')
          for i,item in enumerate(reversed(pool),1):
            payload={'ref':'main','inputs':{'source':item.get('asset_url') or item.get('source_url'),'slug':f'ly-live70-review-0906-{i:02d}','speaker':'林园','occasion':'园园对齐10条验收','delay_hours':'0','source_platform':item.get('source') or '','auto_publish':False,'target_parts':'0','include_full':False,'prefer_live_video':True}}
            r=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/linyuan-produce-cn.yml/dispatches',data=json.dumps(payload).encode(),headers={**H,'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(r) as resp: print(i,item.get('title','')[:60],resp.status)
          PY
